name: Deploy Telegram bot (Cloudflare Worker)

# Publishes telegram-bot/worker.js to Cloudflare Workers (free plan)
# automatically whenever it changes on main — the same way index.html
# already auto-deploys to GitHub Pages, so worker.js never needs a manual
# `wrangler deploy` from a laptop again.
#
# One-time setup required (can't be done from here — it needs your
# Cloudflare account, which this session has no access to):
#   1. https://dash.cloudflare.com/profile/api-tokens → Create Token →
#      "Edit Cloudflare Workers" template → Create Token. Copy it.
#   2. In this GitHub repo: Settings → Secrets and variables → Actions →
#      New repository secret:
#        CLOUDFLARE_API_TOKEN   = the token from step 1
#        CLOUDFLARE_ACCOUNT_ID  = Cloudflare dashboard → Workers & Pages →
#                                  Account ID (right sidebar)
# After both secrets exist, this workflow deploys on every push that
# touches telegram-bot/ — and you can also trigger it manually any time
# from the Actions tab ("Run workflow").
#
# This only publishes worker.js itself. The bot's own secrets (BOT_TOKEN,
# WEBHOOK_SECRET) are a separate, rarely-repeated step — see
# telegram-bot/README.md — and aren't touched by this workflow.
#
# FIREBASE_SERVICE_ACCOUNT_KEY is the one exception: it's synced here (the
# step below) rather than set once via the Cloudflare dashboard, because
# this Worker also has Cloudflare's own native "Workers Builds" GitHub
# integration configured (a separate deploy path from this workflow, using
# its own build token) — and secrets saved through the dashboard's
# "Variables and Secrets" UI turned out to be tied to THAT path, not to
# deploys this workflow makes. Since Workers Builds' token was broken
# (deleted/rolled) at the time this was debugged, dashboard-saved secrets
# silently never reached the version this workflow actually deploys. Piping
# it through here, via the SAME CLOUDFLARE_API_TOKEN this workflow already
# uses successfully, sidesteps that entirely: set FIREBASE_SERVICE_ACCOUNT_KEY
# as a GitHub Actions repo secret (Settings → Secrets and variables →
# Actions) with the full Firebase service-account JSON, and every deploy
# keeps Cloudflare's copy in sync with it.

on:
  push:
    branches: [main]
    paths:
      - "telegram-bot/**"
      - ".github/workflows/deploy-telegram-bot.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Firebase service account secret
        working-directory: telegram-bot
        run: echo "$FIREBASE_SERVICE_ACCOUNT_KEY" | npx wrangler secret put FIREBASE_SERVICE_ACCOUNT_KEY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: telegram-bot
          command: deploy
