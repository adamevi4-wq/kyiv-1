const db = initializeFirestore(fbApp, {});

async function fsGet(collection, key) {
  try {
    const snap = await getDoc(doc(db, collection, key));
    return snap.exists() ? snap.data().value : undefined;
  } catch (e) { console.error(e); return undefined; }
}
async function fsSet(collection, key, value) {
  await setDoc(doc(db, collection, key), { value }, { merge: true });
}

const ADMIN_DEFAULT_PASSWORD = "DM-Kyiv1";
const OVERDUE_DAYS = 30;
const SILENT_DAYS = 7;
const DEFAULT_REPORTS_WINDOW = { start: "17:00", end: "23:00" };

function escapeHtml(str) {
  return String(str ?? "").replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function kyivNow() {
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false, weekday: "short",
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date()).map((p) => [p.type, p.value]));
  return { dateStr: `${parts.year}-${parts.month}-${parts.day}`, hhmm: `${parts.hour}:${parts.minute}` };
}
function daysBetween(a, b) { if (!a || !b) return null; return Math.round((new Date(b) - new Date(a)) / 86400000); }
function roundTo5(hhmm) {
  const [hh, mm] = hhmm.split(":").map(Number);
  const rounded = Math.round((hh * 60 + mm) / 5) * 5;
  const h = Math.floor((rounded % 1440) / 60), m = rounded % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

// ================= global state =================
let authed = false;
let chatIds = [];
let selectedChatId = null;
let chatState = {};
let stores = [];
let activeTab = "overview";
let loginError = "";

async function boot() {
  const raw = await fsGet("telegram-bot", "chats-index");
  chatIds = raw ? JSON.parse(raw) : [];
  selectedChatId = chatIds[0] ?? null;
  const s = await fsGet("kyiv1", "staffing-stores");
  stores = s ? JSON.parse(s) : [];
  await loadChatState();
}
async function loadChatState() {
  if (selectedChatId == null) { chatState = {}; return; }
  const raw = await fsGet("telegram-bot", `chat-${selectedChatId}`);
  chatState = raw ? JSON.parse(raw) : {};
}
async function saveChatState() {
  await fsSet("telegram-bot", `chat-${selectedChatId}`, JSON.stringify(chatState));
}

function render() {
  const root = document.getElementById("root");
  if (!authed) { root.innerHTML = loginHtml(); bindLogin(); return; }
  root.innerHTML = `
    <div class="topbar">
      <div style="display:flex;align-items:center;">
        <h1>🤖 Telegram-бот Kyiv-1</h1><span class="tag">панель керування</span>
      </div>
      <div class="tab-nav">
        ${tabBtn("overview", "Огляд")}${tabBtn("reminders", "Нагадування")}${tabBtn("reports", "Звіти магазинів")}${tabBtn("settings", "Налаштування")}${tabBtn("warns", "Попередження")}
      </div>
      <button class="icon-btn-top" id="logout-btn">Вийти</button>
    </div>
    <main>${chatIds.length === 0 ? noChatHtml() : tabContentHtml()}</main>
  `;
  document.getElementById("logout-btn").onclick = () => { authed = false; render(); };
  if (chatIds.length) bindTabHandlers();
}
function tabBtn(id, label) { return `<button class="tab-btn ${activeTab === id ? "active" : ""}" data-tab="${id}">${label}</button>`; }
function noChatHtml() {
  return `<div class="card"><h2>Бот ще не бачив жодного чату</h2><div class="desc">Напишіть у Telegram-групі команду /setreportstopic, /digest on або /addreminder — після цього чат з'явиться тут.</div></div>`;
}

function loginHtml() {
  return `
    <div id="login-screen">
      <div class="login-card">
        <h1>🤖 Telegram-бот Kyiv-1</h1>
        <div class="sub">Панель керування ботом. Вхід — той самий пароль District Manager, що й у дашборді.</div>
        <label>Пароль</label>
        <input type="password" id="pw-input" />
        <div class="err" id="pw-err">${escapeHtml(loginError)}</div>
        <button class="btn btn-block" id="pw-btn">Увійти</button>
      </div>
    </div>
  `;
}
function bindLogin() {
  const btn = document.getElementById("pw-btn");
  const input = document.getElementById("pw-input");
  const tryLogin = async () => {
    const ap = await fsGet("kyiv1", "admin-password");
    const adminPassword = ap || ADMIN_DEFAULT_PASSWORD;
    if (input.value === adminPassword) {
      authed = true; loginError = ""; render();
    } else {
      loginError = "Невірний пароль."; render();
    }
  };
  btn.onclick = tryLogin;
  input.addEventListener("keydown", (e) => { if (e.key === "Enter") tryLogin(); });
  input.focus();
}

function tabContentHtml() {
  if (activeTab === "overview") return overviewHtml();
  if (activeTab === "reminders") return remindersHtml();
  if (activeTab === "reports") return reportsHtml();
  if (activeTab === "settings") return settingsHtml();
  if (activeTab === "warns") return warnsHtml();
  return "";
}

// ---- overview ----
function statsTotals(days) {
  const totals = {};
  const base = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(base); d.setUTCDate(d.getUTCDate() - i);
    const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit" });
    const parts = Object.fromEntries(fmt.formatToParts(d).map((p) => [p.type, p.value]));
    const key = `${parts.year}-${parts.month}-${parts.day}`;
    const day = (chatState.stats && chatState.stats[key]) || {};
    for (const [uid, count] of Object.entries(day)) totals[uid] = (totals[uid] || 0) + count;
  }
  return totals;
}
function overviewHtml() {
  const today = statsTotals(1);
  const week = statsTotals(7);
  const todayCount = Object.values(today).reduce((a, b) => a + b, 0);
  const weekCount = Object.values(week).reduce((a, b) => a + b, 0);
  const warnCount = Object.values(chatState.warns || {}).filter((c) => c > 0).length;
  const rows = Object.entries(week).sort((a, b) => b[1] - a[1]).slice(0, 10);
  const max = rows.length ? rows[0][1] : 1;
  return `
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ПОВІДОМЛЕНЬ СЬОГОДНІ</div><div class="val">${todayCount}</div></div>
      <div class="stat-card"><div class="lbl">ПОВІДОМЛЕНЬ ЗА 7 ДНІВ</div><div class="val">${weekCount}</div></div>
      <div class="stat-card"><div class="lbl">АКТИВНИХ УЧАСНИКІВ (7Д)</div><div class="val">${Object.keys(week).length}</div></div>
      <div class="stat-card"><div class="lbl">З ПОПЕРЕДЖЕННЯМИ</div><div class="val" style="${warnCount ? "color:var(--amber)" : ""}">${warnCount}</div></div>
    </section>
    <div class="card">
      <h2>Топ активних учасників за 7 днів</h2>
      <div class="desc">Хто найбільше пише в чаті — дані з /stats бота.</div>
      ${rows.length ? rows.map(([uid, count]) => `
        <div class="bar-row">
          <div class="bar-name">${escapeHtml(chatState.names?.[uid] || uid)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${Math.round((count / max) * 100)}%"></div></div>
          <div class="bar-count">${count}</div>
        </div>
      `).join("") : `<div class="empty">Ще немає даних активності.</div>`}
    </div>
  `;
}

// ---- reports ----

  const win = chatState.reportsWindow || DEFAULT_REPORTS_WINDOW;
  const now = kyivNow();
  const reportedToday = (chatState.reports && chatState.reports[now.dateStr]) || {};
  const missing = stores.filter((s) => s.code && !reportedToday[s.code]);
  return `
    <div class="card">
      <h2>Тема звітів</h2>
      <div class="desc">Прив'язується командою /setreportstopic, написаною в потрібній темі чату.</div>
      ${rt ? `<div class="row"><span class="pill pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${rt.threadId}</span></div>`
           : `<div class="empty">Тема ще не прив'язана.</div>`}
      <div class="row" style="margin-top:14px;">
        <label>Вікно перевірки</label>
        <input type="time" id="rw-start" value="${win.start}" /> — <input type="time" id="rw-end" value="${win.end}" />
        <button class="btn btn-sm" id="rw-save-btn">Зберегти</button>
        <span class="save-msg" id="rw-save-msg"></span>
      </div>
    </div>
    <div class="card">
      <h2>Статус на сьогодні (${now.dateStr}, станом на ${now.hhmm})</h2>

// ================= event binding =================
function bindTabHandlers() {
  document.querySelectorAll(".tab-btn").forEach((b) => {
    b.onclick = () => { activeTab = b.dataset.tab; render(); };
  });
  if (chatIds.length === 0) return;

  if (activeTab === "reminders") {
    document.querySelectorAll("[data-del-reminder]").forEach((b) => {
      b.onclick = async () => {
        chatState.reminders = (chatState.reminders || []).filter((r) => r.id !== b.dataset.delReminder);
        await saveChatState(); render();
      };
    });
    const daysSel = document.getElementById("rem-days");
    const daysCustom = document.getElementById("rem-days-custom");
    daysSel.onchange = () => { daysCustom.style.display = daysSel.value === "custom" ? "" : "none"; };
    document.getElementById("rem-add-btn").onclick = async () => {
      const time = roundTo5(document.getElementById("rem-time").value || "09:00");
      const daysSelVal = daysSel.value;
      const dayMap = { "пн": "mon", "вт": "tue", "ср": "wed", "чт": "thu", "пт": "fri", "сб": "sat", "нд": "sun" };
      const days = daysSelVal === "custom"
        ? daysCustom.value.split(",").map((s) => dayMap[s.trim().toLowerCase()] || s.trim().toLowerCase()).filter(Boolean)
        : daysSelVal === "daily" ? "daily" : daysSelVal.split(",");
      const text = document.getElementById("rem-text").value.trim();
      if (!text) { document.getElementById("rem-save-msg").textContent = "Вкажіть текст."; return; }
      chatState.reminders = chatState.reminders || [];
      chatState.reminders.push({ id: String(Date.now()).slice(-6), time, days, text, lastSentDate: null });
      await saveChatState(); render();
    };
  }

  if (activeTab === "reports") {
    document.getElementById("rw-save-btn").onclick = async () => {
      const start = roundTo5(document.getElementById("rw-start").value);
      const end = roundTo5(document.getElementById("rw-end").value);
      chatState.reportsWindow = { start, end };
      await saveChatState();
      document.getElementById("rw-save-msg").textContent = "Збережено ✓";
    };
  }

  if (activeTab === "settings") {
    document.getElementById("rules-save-btn").onclick = async () => {
      chatState.rules = document.getElementById("rules-text").value;
      await saveChatState();
      document.getElementById("rules-save-msg").textContent = "Збережено ✓";
    };
    document.getElementById("digest-save-btn").onclick = async () => {
      chatState.digest = { ...(chatState.digest || {}), enabled: document.getElementById("digest-on").checked, time: roundTo5(document.getElementById("digest-time").value) };
      await saveChatState();
      document.getElementById("digest-save-msg").textContent = "Збережено ✓";
    };
    document.getElementById("morning-save-btn").onclick = async () => {
      chatState.morning = { ...(chatState.morning || {}), enabled: document.getElementById("morning-on").checked, time: roundTo5(document.getElementById("morning-time").value) };
      await saveChatState();
      document.getElementById("morning-save-msg").textContent = "Збережено ✓";
    };
    document.getElementById("congrats-on").onchange = async (e) => {
      chatState.congratsEnabled = e.target.checked;
      await saveChatState(); render();
    };
  }

  if (activeTab === "warns") {
    document.querySelectorAll("[data-reset-warn]").forEach((b) => {
      b.onclick = async () => {
        chatState.warns[b.dataset.resetWarn] = 0;
        await saveChatState(); render();
      };
    });
  }
}

// ================= boot =================
styleTag();
document.getElementById("root").textContent = "Завантаження…";
await boot();
render();
</script>
</body>
</html>
