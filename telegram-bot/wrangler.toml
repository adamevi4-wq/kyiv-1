name = "kyiv1-telegram-bot"
main = "worker.js"
compatibility_date = "2024-11-01"

# Same free Firebase project the dashboard (../index.html) already uses.
[vars]
FIRESTORE_PROJECT_ID = "district-tracker-ef4c6"

# Cloudflare's own hosted AI models (env.AI.run(...) in worker.js) — no
# separate account/key, no resource to pre-create. Included on the Workers
# Free plan: 10,000 Neurons/day at no charge (resets 00:00 UTC), further
# calls past that simply fail rather than bill anything. Used as the
# free second-tier ask-bot brain when ANTHROPIC_API_KEY isn't set — see
# askWorkersAI in worker.js.
[ai]
binding = "AI"

# Runs every 5 minutes to fire due custom reminders and the optional daily
# work digest (vacancies + manager activity). Cron Triggers are free on the
# Cloudflare Workers Free plan.
[triggers]
crons = ["*/5 * * * *"]

# Secrets (set with `wrangler secret put <NAME>`, never commit them):
#   BOT_TOKEN                    — token from @BotFather
#   WEBHOOK_SECRET               — random string, also passed to setWebhook as secret_token
#   FIREBASE_SERVICE_ACCOUNT_KEY — the full JSON key of a Firebase service
#     account (Firebase Console → Project Settings → Service accounts →
#     Generate new private key), pasted as ONE secret value. Lets this
#     worker authenticate its own Firestore access instead of relying on
#     firestore.rules leaving `telegram-bot/{doc}` open to anyone — see the
#     comment above firestoreGetRaw/getGoogleAccessToken in worker.js and
#     the top of ../firestore.rules for the full story. Without this secret
#     every Firestore call the bot makes fails (loudly, on purpose — see
#     README).
