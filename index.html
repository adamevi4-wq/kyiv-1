// ---- analysis ----
// Richer, per-message breakdown (media, "success" and "support" keyword
// hits, day-by-day regularity) fed by worker.js's state.stats2 — recorded
// going forward only from state.stats2Since, since Telegram's Bot API
// can't retrieve a chat's message history. See the disclaimer text in
// tgAnalysisHtml() for what this is (and isn't) meant to show.
const TG_MONTH_NAMES_UA = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
function tgFormatDateUA(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return `${d} ${TG_MONTH_NAMES_UA[m - 1]} ${y}`;
}
function tgDaysBetween(a, b) {
  const da = new Date(a + "T00:00:00Z"), db = new Date(b + "T00:00:00Z");
  return Math.max(1, Math.round((db - da) / 86400000) + 1);
}
function tgDayWord(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return "днів";
  if (mod10 === 1) return "день";
  if (mod10 >= 2 && mod10 <= 4) return "дні";
  return "днів";
}
function tgParticipantWord(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return "учасників";
  if (mod10 === 1) return "учасник";
  if (mod10 >= 2 && mod10 <= 4) return "учасники";
  return "учасників";
}
function tgAnalysisData() {
  const stats2 = tgChatState.stats2 || {};
  const days = Object.keys(stats2).sort();
  const users = {};
  for (const day of days) {
    for (const [uid, rec] of Object.entries(stats2[day])) {
      const u = users[uid] || (users[uid] = { msgs: 0, photos: 0, videos: 0, docs: 0, replies: 0, success: 0, support: 0, activeDays: 0, days: {} });
      u.msgs += rec.msgs || 0;
      u.photos += rec.photos || 0;
      u.videos += rec.videos || 0;
      u.docs += rec.docs || 0;
      u.replies += rec.replies || 0;
      u.success += rec.success || 0;
      u.support += rec.support || 0;
      u.activeDays += 1;
      u.days[day] = rec.msgs || 0;
    }
  }
  return { days, users };
}
// Score is deliberately not "just count messages": volume is capped at half
// the scale, the rest comes from media use, success/support keyword hits,
// and how many of the tracked days the person showed up at all.
function tgEngagementScore(u, maxMsgs, totalDays) {
  const volume = maxMsgs > 0 ? (u.msgs / maxMsgs) * 5 : 0;
  const media = Math.min(1.5, (u.photos + u.videos + u.docs) * 0.3);
  const signal = Math.min(2, (u.success + u.support) * 0.5);
  const regularity = totalDays > 0 ? Math.min(1.5, (u.activeDays / totalDays) * 1.5) : 0;
  return Math.max(1, Math.min(10, Math.round(volume + media + signal + regularity)));
}
// Groups the analysis rows by the store each uid is already linked to
// (tgChatState.storeMembers, filled in automatically as people are
// recognized — see the kyiv1-daily-check skill) so the table reads by
// store instead of one long flat ranking. Anyone not yet linked to a
// store lands in a separate "Без магазину" group rather than being
// silently dropped from the analysis.
function tgGroupAnalysisRowsByStore(rows) {
  const storeMembers = tgChatState.storeMembers || {};
  const byStore = {};
  const unassigned = [];
  for (const r of rows) {
    const code = storeMembers[r.uid];
    if (code) {
      if (!byStore[code]) byStore[code] = { store: stores.find(s => s.code === code) || { code, name: "" }, rows: [] };
      byStore[code].rows.push(r);
    } else {
      unassigned.push(r);
    }
  }
  const groups = Object.values(byStore)
    .map(g => ({ ...g, avgScore: Math.round(g.rows.reduce((s, r) => s + r.score, 0) / g.rows.length * 10) / 10 }))
    .sort((a, b) => b.avgScore - a.avgScore);
  return { groups, unassigned };
}
function tgAnalysisHtml() {
  const since = tgChatState.stats2Since;
  if (!since) {
    return `
      <div class="tg-card">
        <h2>Аналіз активності</h2>
        <div class="tg-desc">Ще немає даних для аналізу. Ця вкладка рахує розширену статистику (медіа, згадки про виконані завдання, підтримку колег, регулярність) з моменту, коли бот почав це відстежувати — Telegram не дозволяє прочитати історію чату заднім числом, тож аналіз завжди починається "від сьогодні".</div>
        <div class="tg-desc" style="margin-bottom:0;">Якщо бот уже якийсь час працює в цьому чаті, а дані тут порожні — ймовірно, ще не задеплоєно оновлену версію <code>telegram-bot/worker.js</code>. Це відбувається автоматично при push у <code>main</code> (див. <code>telegram-bot/README.md</code>, розділ «Автодеплой»); якщо це перший запуск — перевірте вкладку Actions репозиторію, чи задеплоївся Worker. Дані з'являться з наступного повідомлення в чаті після деплою.</div>
      </div>
    `;
  }

  const { days, users } = tgAnalysisData();
  const today = tgKyivNow().dateStr;
  const totalDays = tgDaysBetween(since, today);
  const uids = Object.keys(users);
  if (!uids.length) {
    return `
      <div class="tg-card">
        <h2>Аналіз активності</h2>
        <div class="tg-desc" style="margin-bottom:0;">Дані збираються з ${tgFormatDateUA(since)} — поки що жодних повідомлень не зафіксовано.</div>
      </div>
    `;
  }

  const maxMsgs = Math.max(...uids.map(uid => users[uid].msgs));
  const rows = uids
    .map(uid => { const u = users[uid]; return { uid, name: tgChatState.names?.[uid] || uid, ...u, score: tgEngagementScore(u, maxMsgs, totalDays) }; })
    .sort((a, b) => b.score - a.score || b.msgs - a.msgs);

  const byVolume = [...rows].sort((a, b) => b.msgs - a.msgs).slice(0, 3);
  const qualityScore = (r) => r.success * 2 + r.support * 2 + r.photos + r.videos + r.docs;
  const byQuality = [...rows].sort((a, b) => qualityScore(b) - qualityScore(a)).slice(0, 3);
  const lowActivity = totalDays >= 3 ? rows.filter(r => (r.activeDays / totalDays) < 0.34) : [];

  const totals = rows.reduce((acc, r) => {
    acc.msgs += r.msgs; acc.media += r.photos + r.videos + r.docs;
    acc.success += r.success; acc.support += r.support;
    return acc;
  }, { msgs: 0, media: 0, success: 0, support: 0 });
  const avgMsgs = Math.round(totals.msgs / rows.length);

  const dayHeat = (u) => days.slice(-14).map(d => `<span class="tg-heat-dot ${u.days[d] ? "on" : ""}" title="${d}"></span>`).join("");
  const analysisTableHtml = (groupRows) => `
    <div style="overflow-x:auto;">
      <table class="tg-table">
        <thead><tr>
          <th>#</th><th>Учасник</th><th>Повідомлень</th><th>Медіа</th><th>Успіхи</th>
          <th>Підтримка/відповіді</th><th>Активність по днях</th><th>Оцінка</th>
        </tr></thead>
        <tbody>
          ${groupRows.map((r, i) => `
            <tr>
              <td class="mono">${i + 1}</td>
              <td>${escapeHtml(r.name)}</td>
              <td class="mono">${r.msgs}</td>
              <td class="mono">${r.photos + r.videos + r.docs}</td>
              <td class="mono">${r.success}</td>
              <td class="mono">${r.support + r.replies}</td>
              <td><span class="tg-heat">${dayHeat(r)}</span><span style="color:var(--ink-soft);font-size:11px;">${r.activeDays}/${totalDays}</span></td>
              <td><span class="tg-pill ${r.score >= 7 ? "tg-pill-green" : r.score >= 4 ? "tg-pill-amber" : "tg-pill-red"}">${r.score}/10</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  const { groups: storeGroups, unassigned } = tgGroupAnalysisRowsByStore(rows);

  return `
    <div class="tg-card">
      <h2>Аналіз активності</h2>
      <div class="tg-desc">
        Дані з ${tgFormatDateUA(since)} по сьогодні (${totalDays} ${tgDayWord(totalDays)}) — бот не має доступу до історії чату до цієї дати.
        Оцінка залученості (1-10) — орієнтовний показник: враховує не лише кількість повідомлень, а й використання фото/відео/документів,
        згадки про виконані завдання чи результати, підтримку колег і регулярність активності за днями. Ключові слова для "успіхів" і
        "підтримки" — прості безкоштовні евристики (без ШІ), тож можуть щось пропустити або помилково зарахувати.
        <b>Це не оцінка продуктивності</b> й не повинна бути єдиною підставою для висновків про роботу конкретної людини.
      </div>
      <div class="tg-desc" style="margin-bottom:10px;">Розбито по магазинах — хто до якого прив'язаний, бот визначає сам (підпис під фото, текстове підтвердження або вручну під час щоденної перевірки). Клікніть на магазин, щоб розгорнути список.</div>
      ${storeGroups.map(g => `
        <details class="store-analysis-group">
          <summary>
            <span class="store-analysis-code">${escapeHtml(g.store.code)}</span>
            ${g.store.name ? `<span class="store-analysis-name">${escapeHtml(g.store.name)}</span>` : ""}
            <span class="store-analysis-meta">${g.rows.length} ${tgParticipantWord(g.rows.length)} · середня оцінка ${g.avgScore}/10</span>
          </summary>
          ${analysisTableHtml(g.rows)}
        </details>
      `).join("")}
      ${unassigned.length ? `
        <details class="store-analysis-group">
          <summary>
            <span class="store-analysis-code" style="color:var(--ink-soft);">Без магазину</span>
            <span class="store-analysis-meta">${unassigned.length} ${tgParticipantWord(unassigned.length)}</span>
          </summary>
          ${analysisTableHtml(unassigned)}
        </details>
      ` : ""}
    </div>

    <div class="tg-card">
      <h2>Топ-учасники</h2>
      <div class="tg-desc">За кількістю повідомлень і окремо — за "якістю" внеску (успіхи, підтримка колег, медіа), без урахування самого лише обсягу.</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;">
        <div>
          <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">За кількістю повідомлень</div>
          ${byVolume.map((r, i) => `<div class="tg-row" style="margin-bottom:6px;"><span class="tg-pill tg-pill-amber">${i + 1}</span> ${escapeHtml(r.name)} <span style="color:var(--ink-soft);">— ${r.msgs}</span></div>`).join("")}
        </div>
        <div>
          <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">За якістю внеску</div>
          ${byQuality.map((r, i) => `<div class="tg-row" style="margin-bottom:6px;"><span class="tg-pill tg-pill-green">${i + 1}</span> ${escapeHtml(r.name)} <span style="color:var(--ink-soft);">— успіхи ${r.success}, підтримка ${r.support}, медіа ${r.photos + r.videos + r.docs}</span></div>`).join("")}
        </div>
      </div>
    </div>

    <div class="tg-card">
      <h2>Низька або нерегулярна активність</h2>
      <div class="tg-desc">Учасники, які писали менш ніж у третині днів періоду — без оцінки причини (може бути пов'язано з робочим графіком, роллю в чаті тощо).</div>
      ${lowActivity.length ? lowActivity.map(r => `<div class="tg-row"><span class="tg-pill tg-pill-red">${r.activeDays}/${totalDays} дн.</span> ${escapeHtml(r.name)}</div>`).join("") : `<div class="tg-empty">Наразі таких немає${totalDays < 3 ? " (період ще замалий для оцінки регулярності)" : ""}.</div>`}
    </div>

    <div class="tg-card">
      <h2>Теми успіхів і типи контенту</h2>
      <section class="stat-row" style="margin-bottom:0;">
        <div class="stat-card"><div class="lbl">ПОВІДОМЛЕНЬ УСЬОГО</div><div class="val">${totals.msgs}</div></div>
        <div class="stat-card"><div class="lbl">ЗГАДОК ПРО УСПІХИ</div><div class="val">${totals.success}</div></div>
        <div class="stat-card"><div class="lbl">ПІДТРИМКИ КОЛЕГ</div><div class="val">${totals.support}</div></div>
        <div class="stat-card"><div class="lbl">ФОТО/ВІДЕО/ДОКУМЕНТІВ</div><div class="val">${totals.media}</div></div>
      </section>
    </div>

    <div class="tg-card">
      <h2>Короткі висновки</h2>
      <div class="tg-desc" style="margin-bottom:0;">
        За ${totalDays} ${tgDayWord(totalDays)} у чаті активність зафіксовано у ${rows.length} учасників, у середньому ${avgMsgs} повідомлень на людину.
        ${totals.success ? `Найбільше про виконані завдання й результати писали: ${escapeHtml(byQuality[0]?.name || "")}. ` : "Явних згадок про виконані завдання чи результати поки небагато — можливо, команда ділиться результатами в іншому форматі (особисто, звітами на дашборді тощо). "}
        ${lowActivity.length ? `${lowActivity.length} ${lowActivity.length === 1 ? "учасник пише" : "учасників пишуть"} нерегулярно — це не обов'язково ознака проблеми, а привід поглянути уважніше, якщо це важливо для командної комунікації. ` : ""}
        Нагадуємо: ця сторінка показує активність у чаті, а не оцінку роботи людини — не варто робити висновки про продуктивність конкретного співробітника лише на основі цих цифр.
      </div>
    </div>
  `;
}

// ---- leaderboard (levels & reputation) ----
// Points are earned in worker.js (POINTS const): a message, a bonus for
// photo/video/document, for "success"/"support" keyword signals, and
// bigger bonuses for a first-of-the-day evening report, morning photo
// report, or monthly-checklist confirmation. Purely a chat-engagement
// signal, same disclaimer as "Аналіз активності" — not a productivity score.
// Status card for the twice-a-day (10:00/17:00) "Активності/Акції" chat
// digest — a separate, self-resetting daily counter (worker.js's
// state.dailyPoints), unrelated to the cumulative state.points below.
function tgActivityDigestCardHtml() {
  const at = tgChatState.activityTopic;
  const ad = tgChatState.activityDigest || {};
  const today = tgKyivNow().dateStr;
  return `
    <div class="tg-card">
      <h2>Щоденна статистика в чаті</h2>
      <div class="tg-desc">
        Прив'язується командою <code>/setactivitytopic</code>, написаною в потрібній темі (напр. «Активності/Акції»).
        О 10:00 бот надсилає туди підсумок активності <b>за вчора</b>, о 17:00 — зріз <b>за сьогодні</b> (з короткою
        мотивацією) — рахунок щодня оновлюється з нуля. Лідерборд і рівні вище (і на сайті) рахуються окремо й ніколи не скидаються.
      </div>
      ${at ? `<div class="tg-row"><span class="tg-pill tg-pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${at.threadId}</span></div>`
           : `<div class="tg-empty">Тема ще не прив'язана.</div>`}
      ${at ? `<div class="tg-row" style="margin-top:8px;gap:16px;">
        <span class="tg-pill ${ad.lastSent10 === today ? "tg-pill-green" : "tg-pill-amber"}">10:00 — ${ad.lastSent10 === today ? "надіслано сьогодні" : "ще не сьогодні"}</span>
        <span class="tg-pill ${ad.lastSent17 === today ? "tg-pill-green" : "tg-pill-amber"}">17:00 — ${ad.lastSent17 === today ? "надіслано сьогодні" : "ще не сьогодні"}</span>
      </div>` : ""}
    </div>

    <div class="tg-card">
      <h2>Дайджест досягнень за тиждень</h2>
      <div class="tg-desc">
        Щопонеділка о 10:01, у ту саму тему: найактивніші учасники тижня, магазини з найбільшою кількістю виконаних
        завдань (вечірні звіти + ранкові фотозвіти), і — якщо на боті ввімкнено відстеження реакцій
        (<code>telegram-bot/README.md</code>, крок «Реакції на привітання», опційний) — чиє привітання зібрало найбільше
        реакцій за тиждень.
      </div>
      ${at ? `<div class="tg-row"><span class="tg-pill ${ad.lastSentWeekly ? "tg-pill-green" : "tg-pill-amber"}">Понеділок 10:01 — ${ad.lastSentWeekly ? `останній раз надіслано ${escapeHtml(ad.lastSentWeekly)}` : "ще не надсилався"}</span></div>`
           : `<div class="tg-empty">Спершу прив'яжіть тему вище.</div>`}
    </div>
  `;
}

function tgLeaderboardHtml() {
  const points = tgChatState.points || {};
  const uids = Object.keys(points).filter((uid) => points[uid] > 0);
  if (!uids.length) {
    return `
      <div class="tg-card">
        <h2>Рейтинг</h2>
        <div class="tg-desc" style="margin-bottom:0;">Ще немає накопичених балів. Бали нараховуються за повідомлення, медіа, вечірні/ранкові звіти по магазинах і підтвердження щомісячного чекліста — з'являться після першої активності в чаті.</div>
      </div>
      ${tgActivityDigestCardHtml()}
    `;
  }

  const rows = uids
    .map((uid) => ({ uid, name: tgChatState.names?.[uid] || uid, pts: points[uid] }))
    .sort((a, b) => b.pts - a.pts);
  const medals = ["🥇", "🥈", "🥉"];
  const maxPts = rows[0].pts;

  return `
    <div class="tg-card">
      <h2>Рейтинг чату</h2>
      <div class="tg-desc">
        Бали: +1 за повідомлення, +2 за фото/відео/документ, +3 за згадку про виконане завдання, +1 за підтримку колег,
        +10 за вечірній звіт і +10 за ранковий фотозвіт мінусових залишків (перший раз на день по кожному магазину),
        +15 за підтвердження щомісячного чекліста. Це показник активності в чаті, а не оцінка роботи людини.
      </div>
      <div style="overflow-x:auto;">
        <table class="tg-table">
          <thead><tr><th>#</th><th>Учасник</th><th>Рівень</th><th>Бали</th><th>До наступного рівня</th></tr></thead>
          <tbody>
            ${rows.map((r, i) => {
              const level = tgGetLevel(r.pts);
              const next = TG_LEVELS[level.idx + 1];
              const progress = next ? Math.min(100, Math.round(((r.pts - level.min) / (next.min - level.min)) * 100)) : 100;
              const toNext = next ? `${next.min - r.pts} балів до «${next.emoji} ${next.name}»` : "максимальний рівень 🎉";
              return `
                <tr>
                  <td class="mono">${medals[i] || i + 1}</td>
                  <td>${escapeHtml(r.name)}</td>
                  <td><span class="tg-pill tg-pill-green">${level.emoji} ${level.name}</span></td>
                  <td class="mono">${r.pts}</td>
                  <td>
                    <div class="tg-bar-row" style="padding:0;">
                      <div class="tg-bar-track" style="width:100px;flex:none;"><div class="tg-bar-fill" style="width:${progress}%;"></div></div>
                      <span style="font-size:11px;color:var(--ink-soft);white-space:nowrap;">${toNext}</span>
                    </div>
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="tg-desc" style="margin-bottom:0;margin-top:10px;">Топ-10 у самому чаті — командою <code>/rating</code> (або <code>/top</code>). Тут — повний список.</div>
    </div>

    <div class="tg-card">
      <h2>Рівні</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;">
        ${TG_LEVELS.map((l) => `<span class="tg-pill ${maxPts >= l.min ? "tg-pill-green" : "tg-pill-amber"}">${l.emoji} ${l.name} — від ${l.min}</span>`).join("")}
      </div>
    </div>

    ${tgActivityDigestCardHtml()}
  `;
}

          <td class="mono">${r.time}</td>

// ---- reports (evening text + morning photo + store links) ----
function tgReportsHtml() {
  const now = tgKyivNow();

  const rt = tgChatState.reportsTopic;
  const win = tgChatState.reportsWindow || TG_DEFAULT_REPORTS_WINDOW;
  const reportedToday = (tgChatState.reports && tgChatState.reports[now.dateStr]) || {};
  const missingText = stores.filter(s => s.code && !reportedToday[s.code]);

  const pt = tgChatState.photoReportsTopic;
  const pwin = tgChatState.photoReportsWindow || TG_DEFAULT_PHOTO_REPORTS_WINDOW;
  const photoReportedToday = (tgChatState.photoReports && tgChatState.photoReports[now.dateStr]) || {};
  const missingPhoto = stores.filter(s => s.code && !photoReportedToday[s.code]);

  return `
    <div class="tg-card">
      <h2>Текстові звіти (вечір)</h2>
      <div class="tg-desc">Прив'язується командою /setreportstopic, написаною в потрібній темі. Магазин пише код у тексті звіту.</div>
      ${rt ? `<div class="tg-row"><span class="tg-pill tg-pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${rt.threadId}</span></div>`
           : `<div class="tg-empty">Тема ще не прив'язана.</div>`}
      <div class="tg-row" style="margin-top:10px;">
        <label>Вікно перевірки</label>
        <input type="time" id="tg-rw-start" value="${win.start}" /> — <input type="time" id="tg-rw-end" value="${win.end}" />
        <button class="tg-btn tg-btn-sm" id="tg-rw-save-btn">Зберегти</button>
        <span class="tg-save-msg" id="tg-rw-save-msg"></span>
      </div>
      ${!stores.length ? "" : missingText.length
        ? `<div class="tg-desc" style="margin-top:10px;">Сьогодні ще не звітували (${missingText.length}):</div>
           <div style="display:flex;flex-wrap:wrap;gap:6px;">${missingText.map(s => `<span class="tg-pill tg-pill-amber">${escapeHtml(s.code)}</span>`).join("")}</div>`
        : `<div class="tg-row"><span class="tg-pill tg-pill-green">Усі магазини відзвітували сьогодні ✅</span></div>`}
    </div>

    <div class="tg-card">
      <h2>Фотозвіти по мінусових залишках (ранок)</h2>
      <div class="tg-desc">Прив'язується командою /setphotoreportstopic — або автоматично, коли надійде фото з підписом-кодом магазину.</div>
      ${pt ? `<div class="tg-row"><span class="tg-pill tg-pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${pt.threadId}</span></div>`
           : `<div class="tg-empty">Тема ще не прив'язана.</div>`}
      <div class="tg-row" style="margin-top:10px;">
        <label>Вікно перевірки</label>
        <input type="time" id="tg-pw-start" value="${pwin.start}" /> — <input type="time" id="tg-pw-end" value="${pwin.end}" />
        <button class="tg-btn tg-btn-sm" id="tg-pw-save-btn">Зберегти</button>
        <span class="tg-save-msg" id="tg-pw-save-msg"></span>
      </div>
      ${!stores.length ? "" : missingPhoto.length
        ? `<div class="tg-desc" style="margin-top:10px;">Сьогодні ще не надіслали фото (${missingPhoto.length}):</div>
           <div style="display:flex;flex-wrap:wrap;gap:6px;">${missingPhoto.map(s => `<span class="tg-pill tg-pill-amber">${escapeHtml(s.code)}</span>`).join("")}</div>`

// ---- acknowledgment tracking (reaction triggers) ----
// Read-only here — managed via /trackack (reply to a message) in the chat
// itself, same division as topic bindings and moderation (see README).
function tgAcksHtml() {
  const acks = Object.entries(tgChatState.trackedAcks || {});
  return `
    <div class="tg-card">
      <h2>Тригери на реакції</h2>
      <div class="tg-desc">
        Бот реагує не лише на текст, а й на емодзі-реакції під повідомленнями. Адмін позначає повідомлення
        командою <code>/trackack &lt;мітка&gt;</code> (відповіддю на нього, напр. на інструкцію) — відтоді будь-яка
        реакція від учасника чату зараховується як «ознайомлений(а)». Перевірити — <code>/ackstatus</code>
        (відповіддю на позначене повідомлення) або <code>/acklist</code> для повного списку. Потребує один раз
        оновленого webhook з типом <code>message_reaction</code> (<code>telegram-bot/README.md</code>, розділ
        «Реакції») — без цього кроку позначення працює, але реакції не зараховуються.
      </div>
      ${acks.length ? "" : `<div class="tg-empty">Ще немає повідомлень під відстеженням.</div>`}
    </div>
    ${acks.length ? `
    <div class="tg-card">
      <h2>Повідомлення під відстеженням (${acks.length})</h2>
      <div style="overflow-x:auto;">
        <table class="tg-table">
          <thead><tr><th>Мітка</th><th>Позначив(ла)</th><th>Дата</th><th>Ознайомились</th></tr></thead>
          <tbody>
            ${acks
              .sort((a, b) => (b[1].createdAt || "").localeCompare(a[1].createdAt || ""))
              .map(([, t]) => {
                const names = Object.values(t.reactedBy || {});
                return `
                  <tr>
                    <td>${escapeHtml(t.label || "")}</td>
                    <td>${escapeHtml(t.createdBy || "")}</td>
                    <td class="mono">${escapeHtml(t.createdAt || "")}</td>
                    <td><span class="tg-pill ${names.length ? "tg-pill-green" : "tg-pill-amber"}">${names.length}</span>${names.length ? ` <span style="font-size:11px;color:var(--ink-soft);">${names.map(escapeHtml).join(", ")}</span>` : ""}</td>
                  </tr>
                `;
              }).join("")}
          </tbody>
        </table>
      </div>
    </div>` : ""}
  `;
}

// ---- event binding ----
function tgBindSubTabHandlers() {
  if (tgSubTab === "overview") {
    document.querySelectorAll("[data-tg-stats-period]").forEach(b => {
      b.addEventListener("click", () => { tgStatsPeriod = b.dataset.tgStatsPeriod; renderTelegramTab(); });
    });
  }
  if (tgSubTab === "reminders") {
    document.querySelectorAll("[data-tg-del-reminder]").forEach(b => {
      b.addEventListener("click", async () => {
        tgChatState.reminders = (tgChatState.reminders || []).filter(r => r.id !== b.dataset.tgDelReminder);
        await tgSaveChatState(); renderTelegramTab();
      });
    });
    const daysSel = document.getElementById("tg-rem-days");
    const daysCustom = document.getElementById("tg-rem-days-custom");
    daysSel.addEventListener("change", () => { daysCustom.style.display = daysSel.value === "custom" ? "" : "none"; });
    document.getElementById("tg-rem-add-btn").addEventListener("click", async () => {
      const time = tgRoundTo5(document.getElementById("tg-rem-time").value || "09:00");
      const daysSelVal = daysSel.value;
      const dayMap = { "пн": "mon", "вт": "tue", "ср": "wed", "чт": "thu", "пт": "fri", "сб": "sat", "нд": "sun" };
      const days = daysSelVal === "custom"
        ? daysCustom.value.split(",").map(s => dayMap[s.trim().toLowerCase()] || s.trim().toLowerCase()).filter(Boolean)
        : daysSelVal === "daily" ? "daily" : daysSelVal.split(",");
      const text = document.getElementById("tg-rem-text").value.trim();
      if (!text) { document.getElementById("tg-rem-save-msg").textContent = "Вкажіть текст."; return; }
      tgChatState.reminders = tgChatState.reminders || [];
      tgChatState.reminders.push({ id: String(Date.now()).slice(-6), time, days, text, lastSentDate: null });
      await tgSaveChatState(); renderTelegramTab();
    });
  }

  if (tgSubTab === "reports") {
    document.getElementById("tg-rw-save-btn").addEventListener("click", async () => {
      tgChatState.reportsWindow = { start: tgRoundTo5(document.getElementById("tg-rw-start").value), end: tgRoundTo5(document.getElementById("tg-rw-end").value) };
      await tgSaveChatState();
      document.getElementById("tg-rw-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-pw-save-btn").addEventListener("click", async () => {
      tgChatState.photoReportsWindow = { start: tgRoundTo5(document.getElementById("tg-pw-start").value), end: tgRoundTo5(document.getElementById("tg-pw-end").value) };
      await tgSaveChatState();
      document.getElementById("tg-pw-save-msg").textContent = "Збережено ✓";
    });
  }

  if (tgSubTab === "members") {
    document.querySelectorAll("[data-tg-del-member]").forEach(b => {
      b.addEventListener("click", async () => {
        delete tgChatState.storeMembers[b.dataset.tgDelMember];
        await tgSaveChatState(); renderTelegramTab();
      });
    });
  }

  if (tgSubTab === "tasks") {
    document.getElementById("tg-mc-time-save-btn").addEventListener("click", async () => {
      tgChatState.monthlyChecklist = { ...(tgChatState.monthlyChecklist || {}), time: tgRoundTo5(document.getElementById("tg-mc-time").value) };
      await tgSaveChatState();
      document.getElementById("tg-mc-time-save-msg").textContent = "Збережено ✓";
    });
  }

  if (tgSubTab === "settings") {
    document.getElementById("tg-label-save-btn").addEventListener("click", async () => {
      tgChatState.label = document.getElementById("tg-label-text").value.trim();
      tgLabels[tgSelectedChatId] = tgChatState.label || null;
      await tgSaveChatState();
      document.getElementById("tg-label-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-rules-save-btn").addEventListener("click", async () => {
      tgChatState.rules = document.getElementById("tg-rules-text").value;
      await tgSaveChatState();
      document.getElementById("tg-rules-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-digest-save-btn").addEventListener("click", async () => {
      tgChatState.digest = { ...(tgChatState.digest || {}), enabled: document.getElementById("tg-digest-on").checked, time: tgRoundTo5(document.getElementById("tg-digest-time").value) };
      await tgSaveChatState();
      document.getElementById("tg-digest-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-morning-save-btn").addEventListener("click", async () => {
      tgChatState.morning = { ...(tgChatState.morning || {}), enabled: document.getElementById("tg-morning-on").checked, time: tgRoundTo5(document.getElementById("tg-morning-time").value) };
      await tgSaveChatState();
      document.getElementById("tg-morning-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-congrats-on").addEventListener("change", async (e) => {
      tgChatState.congratsEnabled = e.target.checked;
      await tgSaveChatState(); renderTelegramTab();
    });
  }

  if (tgSubTab === "warns") {
    document.querySelectorAll("[data-tg-reset-warn]").forEach(b => {
      b.addEventListener("click", async () => {
        tgChatState.warns[b.dataset.tgResetWarn] = 0;
        await tgSaveChatState(); renderTelegramTab();
      });
    });
  }
}

// ================= REAL-TIME SYNC (Firestore push, not polling) =================

function isTyping(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}
function canApplyRemoteUpdate(){
  if(!currentUser) return false;
  if(isTyping()) return false; // не перебивати активне редагування
  if(document.getElementById("comments-overlay")?.classList.contains("open")) return false;
  if(document.getElementById("password-overlay")?.classList.contains("open")) return false;
  if(document.getElementById("notif-overlay")?.classList.contains("open")) return false;
  if(document.getElementById("tg-subtab-overlay")?.classList.contains("open")) return false;
  if(addingVacancy) return false;
  return true;
}

let realtimeUnsubs = [];
function startPolling(){
  if(realtimeUnsubs.length) return;
  const bind = (key, apply) => onSnapshot(doc(db, "kyiv1", key), (snap) => {
    if(!snap.exists() || !canApplyRemoteUpdate()) return;
    apply(snap.data().value);
    render();
  });
  realtimeUnsubs.push(bind(FS_KEYS.users, (v) => { users = v ? JSON.parse(v) : DEFAULT_USERS; }));
  realtimeUnsubs.push(bind(FS_KEYS.zones, (v) => { zones = v ? JSON.parse(v) : DEFAULT_ZONES; }));
  realtimeUnsubs.push(bind(FS_KEYS.stores, (v) => { stores = v ? JSON.parse(v) : DEFAULT_STORES; sortStoresByCode(); }));
  realtimeUnsubs.push(bind(FS_KEYS.vacancies, (v) => { vacancies = v ? JSON.parse(v) : []; }));
  realtimeUnsubs.push(bind(FS_KEYS.loginLog, (v) => { loginLog = v ? JSON.parse(v) : []; }));
  realtimeUnsubs.push(bind(FS_KEYS.responsibilityLog, (v) => { responsibilityLog = v ? JSON.parse(v) : []; }));
  realtimeUnsubs.push(bind(FS_KEYS.responsibilitySeenAt, (v) => { responsibilitySeenAt = v || null; }));
  realtimeUnsubs.push(bind(FS_KEYS.adminPassword, (v) => { adminPassword = v || ADMIN_DEFAULT_PASSWORD; }));
}
function stopPolling(){
  realtimeUnsubs.forEach((unsub) => unsub());
  realtimeUnsubs = [];
}

// ================= INIT =================

async function init(){
  await loadAll();
  render();
}
init();
