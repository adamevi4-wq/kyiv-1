function pptxPromoSlide(pptx){
  const slide = pptx.addSlide();
  const todayStr = new Date().toISOString().slice(0,10);
  pptxAddHeader(slide, pptx, "Активності та акції", "FY27 — календар змін цін і медіа-активностей");
  const sorted = [...PRICE_CHANGE_CALENDAR].sort((a,b)=>a.date.localeCompare(b.date));
  const next = sorted.find(e => e.date >= todayStr) || null;
  const highlightedCount = PRICE_CHANGE_CALENDAR.filter(e=>e.note).length;
  const mSorted = [...MARKETING_CALENDAR].sort((a,b)=>a.start.localeCompare(b.start));
  const mTopCount = MARKETING_CALENDAR.filter(e=>e.top).length;
  // Short "за N дн." form for the tile — formatPriceChangeDate's full
  // "DD.MM.YYYY (weekday)" is far too long for an 18pt stat-tile value.
  const daysUntilNext = next ? Math.round((new Date(next.date+"T00:00:00Z") - new Date(todayStr+"T00:00:00Z")) / 86400000) : null;
  const nextLabel = daysUntilNext === null ? "—" : daysUntilNext === 0 ? "сьогодні" : daysUntilNext === 1 ? "завтра" : `за ${daysUntilNext} дн.`;
  const hero = [
    { icon:"calendar", label:"Наступна зміна цін", value: nextLabel, color:PX.navy },
    { icon:"percent", label:"Всього подій у FY27", value: PRICE_CHANGE_CALENDAR.length, color:PX.navy },
    { icon:"storeAlert", label:"Великих акційних змін", value: highlightedCount, color: highlightedCount>0?PX.amber:PX.green },
    { icon:"award", label:"ТОП-активностей у медіа", value: `${mTopCount}/${MARKETING_CALENDAR.length}`, color:PX.navy },
  ];
  let y = pptxHeroStatsRow(slide, pptx, 0.4, 1.25, 12.53, hero);
  const upcomingPrice = sorted.filter(e => e.date >= todayStr).slice(0,5).map(e => ({ name: formatPriceChangeDate(e.date), sub: e.note || "Плановий день", value: e.note ? "Багато цінників" : "", color: e.note ? PX.red : PX.inkSoft }));
  const upcomingMarketing = mSorted.filter(e => e.end >= todayStr).slice(0,5).map(e => ({ name: formatMarketingRange(e), sub: pptxTruncate(e.label, 42), value: e.top ? "ТОП" : "", color: e.top ? PX.amber : PX.inkSoft }));
  pptxAddRankedList(slide, pptx, 0.4, y, 6.05, "Найближчі зміни цін", upcomingPrice, "clock");
  pptxAddRankedList(slide, pptx, 6.85, y, 6.05, "Найближчі медіа-активності", upcomingMarketing, "target");
  slide.addNotes(`Активності та акції FY27: наступна зміна цін ${next ? formatPriceChangeDate(next.date) : "—"}, ${mTopCount} топ-активностей у медіа-календарі.`);
}

async function exportActiveTabPptx(){
  const btn = document.getElementById("export-pptx-btn");

    return;
  }
  if(btn){ btn.disabled = true; btn.textContent = "⏳ Генерується…"; }
  try{
    await loadPptxGenJS();
    const pptx = new window.PptxGenJS();
    pptx.layout = "LAYOUT_WIDE"; // 13.33in x 7.5in — true 16:9, not LAYOUT_16x9's 10x5.625
    pptx.author = "Kyiv-1 Dashboard";

    cfg.build(pptx);
    await pptx.writeFile({ fileName: `Kyiv-1_${cfg.file}_${todayISO()}.pptx` });
  }catch(e){
    alert("Не вдалося сформувати PowerPoint: " + (e?.message || e));
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = "📤 Експорт PPTX"; }
  }
}

// ================= TAB 2: VACANCIES =================
// Split into subtabs (same pattern as "Звіти та показники"): "Вакансії" —
// the existing pipeline below — and "Онбординг" — pending training plans
// for people already hired, a different question ("are new hires getting
// through onboarding") from "do we have open headcount".
// "Персонал" — merges what used to be two separate top-level tabs
// (Магазини та ставки, Вакансії) plus Онбординг (which already lived
// inside Вакансії) into one tab with a single three-way switcher, since
// all three answer variations on the same "who do we have / who are we
// hiring / are they getting through training" question for a store's
// people. "Штат" reuses renderDistrictTab (the old Магазини та ставки
// content) unchanged aside from taking a containerId now, same pattern
// renderDeliveriesTab already established when Доставки moved under
// Звіти та показники.
const PERSONNEL_SUBTABS = [
  { key: "staff", label: "Штат" },
  { key: "vacancies", label: "Вакансії" },
  { key: "onboarding", label: "Онбординг" },
];

function renderPersonnelTab(){
  const wrap = document.getElementById("tab-content");
  if(!personnelSubTab || !PERSONNEL_SUBTABS.some(t => t.key === personnelSubTab)) personnelSubTab = PERSONNEL_SUBTABS[0].key;
  wrap.innerHTML = `
    <div class="month-tabs" style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">
      ${PERSONNEL_SUBTABS.map(t => `<button class="tg-btn tg-btn-sm ${personnelSubTab===t.key?"":"tg-btn-ghost"}" data-personnel-subtab="${t.key}">${escapeHtml(t.label)}</button>`).join("")}
    </div>
    <div id="personnel-subtab-content"></div>
  `;
  wrap.querySelectorAll("[data-personnel-subtab]").forEach(btn => btn.addEventListener("click", () => { personnelSubTab = btn.dataset.personnelSubtab; renderPersonnelTab(); }));
  if(personnelSubTab === "staff"){ renderDistrictTab(); return; }
  if(personnelSubTab === "onboarding"){ renderOnboardingSubTabContent(); return; }
  renderVacanciesSubTabContent();
}

function renderVacanciesSubTabContent(){
  const wrap = document.getElementById("personnel-subtab-content");
  const withInfo = vacancies.map(v => ({v, d: vacancyInfo(v)}));
  const openCount = withInfo.filter(x => x.d.status === "open").length;
  const overdueCount = withInfo.filter(x => x.d.overdue).length;
  const filled = withInfo.filter(x => x.d.status === "filled" && x.d.timeToFill != null);
  const avgTtf = filled.length ? round2(filled.reduce((s,x)=>s+x.d.timeToFill,0)/filled.length) : null;
  const filtered = withInfo
    .filter(({d}) => vacFilter === "all" ? true : vacFilter === "open" ? d.status === "open" : d.status !== "open")
    .filter(({v}) => vacStoreFilter === "all" || v.storeCode === vacStoreFilter)
    .sort((a,b) => a.v.storeCode.localeCompare(b.v.storeCode));

  const openVacs = withInfo.filter(x => x.d.status === "open").map(x => x.v);
  const totalCandidates = openVacs.reduce((s,v) => s + (v.candidateCount||0), 0);
  const totalContacts = openVacs.reduce((s,v) => s + (v.openContacts||0), 0);

  // "Потребує уваги" — open vacancies that are either overdue against the
  // team's own time-to-fill target, or flagged by the sourcing heuristic
  // (few candidates and few open contacts at once) — combines two signals
  // that otherwise only show up as small badges buried in the table below.
  // The stat tile above shares this exact count (not just the sourcing
  // half) so the number always matches what the section right below it
  // says — a stat tile and a section with the same label showing different
  // counts reads as a bug, not two deliberately different signals.
  const needsAttentionVacs = withInfo
    .filter(x => x.d.status === "open")
    .map(({v, d}) => ({ v, d, sourcing: sourcingStatus(v) }))
    .filter(x => x.d.overdue || x.sourcing.level === "attention")
    .sort((a,b) => (b.d.daysOpen||0) - (a.d.daysOpen||0));

  wrap.innerHTML = `
    ${heroBannerHtml("Вакансії дістрикту — пошук кандидатів і time-to-fill")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ВІДКРИТІ ВАКАНСІЇ</div><div class="val">${openCount}</div></div>
      <div class="stat-card"><div class="lbl">ПРОСТРОЧЕНО (&gt;${OVERDUE_DAYS} ДН.)</div><div class="val" style="${overdueCount>0?'color:var(--red)':''}">${overdueCount}</div></div>
      <div class="stat-card"><div class="lbl">СЕРЕДНІЙ TIME-TO-FILL</div><div class="val" style="${avgTtf!=null?`color:${avgTtf>OVERDUE_DAYS?'var(--red)':'var(--green)'}`:''}">${avgTtf ?? "—"}${avgTtf!=null?`<span class="unit">дн.</span>`:""}</div></div>
      <div class="stat-card"><div class="lbl">ЦІЛЬ TIME-TO-FILL</div><div class="val">${OVERDUE_DAYS}<span class="unit">дн.</span></div></div>
      <div class="stat-card"><div class="lbl">КАНДИДАТІВ (ВІДКРИТІ)</div><div class="val">${totalCandidates}</div></div>
      <div class="stat-card"><div class="lbl">ВІДКРИТИХ КОНТАКТІВ</div><div class="val">${totalContacts}</div></div>
      <div class="stat-card"><div class="lbl">ПОТРЕБУЮТЬ УВАГИ</div><div class="val" style="${needsAttentionVacs.length>0?'color:var(--red)':''}">${needsAttentionVacs.length}</div></div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">1</div><h2>Потребує уваги</h2>
        <div class="count ${needsAttentionVacs.length===0?'done':''}">${needsAttentionVacs.length===0?"без зауважень":`${needsAttentionVacs.length} ${pluralUA(needsAttentionVacs.length, "вакансія", "вакансії", "вакансій")}`}</div>
      </div>
      ${needsAttentionVacs.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Відкриті вакансії, що прострочили ціль по time-to-fill або мають мало кандидатів і контактів одночасно.</div>
        <div class="attn-list">
        ${needsAttentionVacs.map(({v, d, sourcing}) => `
          <div class="attn-row" style="--card-color:${d.overdue?'var(--red)':sourcing.color};">
            <div class="attn-name">${escapeHtml(v.storeCode)} · ${escapeHtml(v.position)}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:${d.overdue?'var(--red)':'var(--ink-soft)'};border-color:${d.overdue?'var(--red)':'var(--line)'};background:#fff;">${d.daysOpen} дн. відкрита${d.overdue?` · прострочено`:""}</span>
              <span class="attn-badge" style="color:${sourcing.color};border-color:${sourcing.border};background:#fff;">${escapeHtml(sourcing.label)}</span>
            </div>
          </div>
        `).join("")}
        </div>
      ` : `<div class="empty-state">Наразі жодна вакансія не потребує уваги.</div>`}
    </section>

    <div class="filter-row">
      <button class="filter-chip ${vacFilter==='all'?'active':''}" data-filter="all">Всі</button>
      <button class="filter-chip ${vacFilter==='open'?'active':''}" data-filter="open">Відкриті</button>
      <button class="filter-chip ${vacFilter==='closed'?'active':''}" data-filter="closed">Закриті</button>
      ${currentUser.isAdmin ? `
      <select class="text-field" id="vac-store-filter" style="width:auto; margin-left:4px;">
        <option value="all">Всі магазини</option>
        ${stores.map(s => `<option value="${escapeHtml(s.code)}" ${vacStoreFilter===s.code?"selected":""}>${escapeHtml(s.code)}${s.sm ? " · " + escapeHtml(s.sm) : ""}</option>`).join("")}
      </select>` : ""}
      <button class="btn2 btn-navy vac-add-btn" id="add-vacancy-btn">+ Додати вакансію</button>
    </div>
    ${!currentUser.isAdmin ? `<div class="meta" style="margin:-10px 0 12px;">🔒 Ви бачите вакансії лише свого магазину (${escapeHtml(currentUser.store)}).</div>` : ""}
    <div class="meta" style="margin:-8px 0 12px;">
      🟢 багато відкритих контактів — керуючий активно опрацьовує вакансію · 🟡 помірна активність · 🔴 мало кандидатів і мало контактів — потрібна увага
    </div>
    <div id="add-vacancy-form"></div>
    ${filtered.length === 0 ? `
      <div class="empty-state">${vacancies.length===0 ? "Ще немає жодної вакансії в дістрикті." : "Немає вакансій за цим фільтром."}</div>
    ` : `
      <div class="mobile-scroll-hint">Гортайте таблицю вбік, щоб побачити всі стовпці →</div>
      <div class="vac-table-wrap">
        <table class="vac-table">
          <thead><tr><th>Магазин</th><th>Зайнятість</th><th>Посада</th><th>Кандидати</th><th>Контакти</th><th>Пошук</th><th>Дата відкриття</th><th>Дата закриття</th><th>Ціль (${OVERDUE_DAYS} днів)</th><th></th></tr></thead>
          <tbody id="vac-tbody"></tbody>
        </table>
      </div>
    `}
  `;
  document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => { vacFilter = btn.dataset.filter; renderVacanciesSubTabContent(); }));
  const storeFilterSel = document.getElementById("vac-store-filter");
  if(storeFilterSel) storeFilterSel.addEventListener("change", () => { vacStoreFilter = storeFilterSel.value; renderVacanciesSubTabContent(); });
  const addBtn = document.getElementById("add-vacancy-btn");
  if(addBtn) addBtn.addEventListener("click", () => { addingVacancy = !addingVacancy; renderVacanciesSubTabContent(); if(addingVacancy) renderAddVacancyForm(); });
  if(addingVacancy) renderAddVacancyForm();
  const tbody = document.getElementById("vac-tbody");
  if(tbody){ tbody.innerHTML = filtered.map(({v}) => vacancyRowHtml(v)).join(""); wireVacancyRowEvents(); }
}

// "Онбординг" — незавершені навчальні плани, один знімок стану з
// ONBOARDING_SNAPSHOTS (див. коментар біля константи) за раз, обраний
// вкладками-датами нижче. Не Firestore-дані — немає live-редагування,
// тому ні canEdit-гейтів, ні persist-викликів тут немає.
function renderOnboardingSubTabContent(){
  const wrap = document.getElementById("personnel-subtab-content");
  const snapshots = [...ONBOARDING_SNAPSHOTS].sort((a,b) => new Date(b.date) - new Date(a.date));
  if(!onboardingSnapshotDate || !snapshots.some(s => s.date === onboardingSnapshotDate)) onboardingSnapshotDate = snapshots[0]?.date || null;
  const snapshot = snapshots.find(s => s.date === onboardingSnapshotDate) || { date: onboardingSnapshotDate, plans: [] };
  // ONBOARDING_SNAPSHOTS is a hardcoded constant shipped in index.html
  // itself, not a Firestore read — so unlike kyiv1_stores/kyiv1_vacancies
  // (2026-09-20, see firestore.rules), there's no server-side rule that
  // can restrict it; every visitor's browser already has every store's
  // plans in the page source regardless. Adam asked for the same "only my
  // store" view here anyway, so this scopes the DISPLAY the same way the
  // Магазини та ставки tab's per-store sections do, purely for a focused,
  // uncluttered view — not a security boundary, since one can't exist here.
  const allRows = snapshot.plans.map(p => ({ ...p, target: onboardingTargetDays(p.plan), overdue: p.dur != null && p.dur >= 0 && onboardingTargetDays(p.plan) != null && p.dur > onboardingTargetDays(p.plan) }));
  const rows = currentUser.isAdmin ? allRows : allRows.filter(r => r.store === currentUser.store);
  const byStore = {};
  rows.forEach(r => { (byStore[r.store] = byStore[r.store] || []).push(r); });
  const storesWithPlans = stores.filter(s => byStore[s.code]);
  const employeeCount = new Set(rows.map(r => `${r.store}|${r.name}`)).size;
  const withProgress = rows.filter(r => r.pct != null);
  const avgPct = withProgress.length ? round2(withProgress.reduce((s,r) => s+r.pct, 0) / withProgress.length) : null;
  const overdueRows = rows.filter(r => r.overdue).sort((a,b) => (b.dur - onboardingTargetDays(b.plan)) - (a.dur - onboardingTargetDays(a.plan)));

  const progressColor = (pct) => pct == null ? "var(--ink-soft)" : pct >= 70 ? "var(--green)" : pct >= 30 ? "var(--amber)" : "var(--red)";

  const progressRanked = [...rows].sort((a,b) => (b.pct ?? 0) - (a.pct ?? 0));
  const progressBest = progressRanked.slice(0, 5);
  const progressWorst = progressRanked.slice(-5).reverse();

  wrap.innerHTML = `
    ${heroBannerHtml(`Онбординг — незавершені навчальні плани, станом на ${new Date(snapshot.date).toLocaleDateString("uk-UA",{day:"2-digit",month:"long",year:"numeric"})}`)}
    ${snapshots.length > 1 ? kpiPeriodSelectorHtml(snapshots.map(s => ({ id: s.date, period: new Date(s.date).toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit"}) })), onboardingSnapshotDate, "onb-snapshot") : ""}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">СПІВРОБІТНИКІВ У ПРОЦЕСІ</div><div class="val">${employeeCount}</div></div>
      <div class="stat-card"><div class="lbl">НЕЗАВЕРШЕНИХ ПЛАНІВ</div><div class="val">${rows.length}</div></div>
      <div class="stat-card"><div class="lbl">МАГАЗИНІВ ЗАЛУЧЕНО</div><div class="val">${storesWithPlans.length}<span class="unit">/ ${stores.length}</span></div></div>
      <div class="stat-card"><div class="lbl">СЕРЕДНІЙ ПРОГРЕС</div><div class="val" style="${avgPct!=null?`color:${progressColor(avgPct)}`:''}">${avgPct!=null?avgPct.toLocaleString("uk-UA",{maximumFractionDigits:1}):"—"}${avgPct!=null?"<span class=\"unit\">%</span>":""}</div></div>
      <div class="stat-card"><div class="lbl">ПРОСТРОЧЕНО ЦІЛЬ ПЛАНУ</div><div class="val" style="${overdueRows.length>0?'color:var(--red)':''}">${overdueRows.length}</div></div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">1</div><h2>Потребує уваги</h2>
        <div class="count ${overdueRows.length===0?'done':''}">${overdueRows.length===0?"без зауважень":`${overdueRows.length} ${pluralUA(overdueRows.length, "план", "плани", "планів")}`}</div>
      </div>
      ${overdueRows.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Плани, що вийшли за власну ціль тривалості (з назви плану) і ще не завершені.</div>
        <div class="attn-list">
        ${overdueRows.map(r => `
          <div class="attn-row" style="--card-color:var(--red);">
            <div class="attn-name">${escapeHtml(r.store)}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:var(--red);border-color:var(--red);background:#fff;">${escapeHtml(onboardingPlanShortName(r.plan))}</span>
              <span class="attn-badge" style="color:var(--red);border-color:var(--red);background:#fff;">+${r.dur - r.target} дн. понад ціль</span>
              <span class="attn-badge">прогрес: ${r.pct ?? 0}%</span>
            </div>
          </div>
        `).join("")}
        </div>
      ` : `<div class="empty-state">Немає планів, що вийшли за власну ціль тривалості.</div>`}
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">2</div><h2>${currentUser.isAdmin ? "По магазинах" : "Мій магазин"}</h2>
        <div class="count done">${storesWithPlans.length} ${pluralUA(storesWithPlans.length, "магазин", "магазини", "магазинів")}</div>
      </div>
      ${storesWithPlans.length ? storesWithPlans.map(s => {
        const storeRows = byStore[s.code];
        const byEmployee = {};
        storeRows.forEach(r => { (byEmployee[r.name] = byEmployee[r.name] || []).push(r); });
        return `
        <div class="tg-card">
          <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--ink-2);">${escapeHtml(s.code)}${s.name ? ` · ${escapeHtml(s.name)}` : ""}</div>
          ${Object.entries(byEmployee).map(([name, plans]) => `
            <div style="margin-bottom:12px;">
              <div class="meta" style="margin-bottom:6px;">керівник: ${escapeHtml(plans[0].manager || "—")}</div>
              ${plans.map(p => `
                <div class="dist-bar-row">
                  <div class="dist-bar-name" style="width:auto;flex:1 1 auto;${p.overdue?'color:var(--red);':''}">${escapeHtml(p.plan)}${p.overdue?" · прострочено":""}</div>
                  <div class="dist-bar-track" style="width:120px;flex:none;"><div class="dist-bar-fill" style="width:${Math.max(0,Math.min(100,p.pct??0))}%;background:${progressColor(p.pct)};"></div></div>
                  <div class="dist-bar-count">${p.dur<0?"ще не почато":`${p.dur} дн.`} · ${p.pct ?? 0}%</div>
                </div>
              `).join("")}
            </div>
          `).join("")}
        </div>
      `; }).join("") : `<div class="empty-state">${currentUser.isAdmin ? "У жодного з магазинів дістрикту немає незавершених навчальних планів." : "У вашому магазині немає незавершених навчальних планів."}</div>`}
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">3</div><h2>Прогрес планів</h2>
        <div class="count done">${progressRanked.length} ${pluralUA(progressRanked.length, "план", "плани", "планів")}</div>
      </div>
      ${progressRanked.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Усі незавершені плани цього знімку, за відсотком проходження курсів.</div>
        ${progressRanked.map(r => `
          <div class="tg-bar-row">
            <div class="tg-bar-name" title="${escapeHtml(r.store)} · ${escapeHtml(r.plan)}">${escapeHtml(r.store)} · ${escapeHtml(onboardingPlanShortName(r.plan))}</div>
            <div class="tg-bar-track"><div class="tg-bar-fill" style="width:${Math.max(0,Math.min(100,r.pct??0))}%;background:${progressColor(r.pct)};"></div></div>
            <div class="tg-bar-count">${r.pct ?? 0}%</div>
          </div>
        `).join("")}
        ${progressRanked.length >= 4 ? `
        <div class="top5-grid">
          <div><div class="top5-head best">ТОП-5 · НАЙБІЛЬШИЙ ПРОГРЕС</div>${progressBest.map(r => `<div class="top5-row"><span class="name">${escapeHtml(r.store)} · ${escapeHtml(onboardingPlanShortName(r.plan))}</span><span class="pct">${r.pct ?? 0}%</span></div>`).join("")}</div>
          <div><div class="top5-head worst">ТОП-5 · ПОТРЕБУЮТЬ УВАГИ</div>${progressWorst.map(r => `<div class="top5-row"><span class="name">${escapeHtml(r.store)} · ${escapeHtml(onboardingPlanShortName(r.plan))}</span><span class="pct">${r.pct ?? 0}%</span></div>`).join("")}</div>
        </div>` : ""}
      ` : `<div class="empty-state">У цьому знімку немає незавершених навчальних планів.</div>`}
    </section>
  `;
  wrap.querySelectorAll("[data-onb-snapshot]").forEach(btn => btn.addEventListener("click", () => { onboardingSnapshotDate = btn.dataset.onbSnapshot; renderOnboardingSubTabContent(); }));
}

function renderAddVacancyForm(){
  const host = document.getElementById("add-vacancy-form");
  if(!host) return;
  const storeOptions = currentUser.isAdmin ? stores : stores.filter(s => s.code === currentUser.store);
  host.innerHTML = `
    <div class="vform">
      <div class="vform-grid">
        <label>Магазин<select class="text-field" id="nv-store" ${!currentUser.isAdmin ? "disabled" : ""}>${storeOptions.map(s => `<option value="${escapeHtml(s.code)}">${escapeHtml(s.code)} · ${escapeHtml(s.sm)}</option>`).join("")}</select></label>
        <label>Посада<select class="text-field" id="nv-position">${POSITIONS.map(p => `<option value="${p}">${p}</option>`).join("")}</select></label>
        <label>Зайнятість (ставка)<input class="text-field" id="nv-share" placeholder="0.5" value="0.5" /></label>
        <label>Дата відкриття<input type="date" class="text-field" id="nv-opened" value="${todayISO()}" /></label>
        <label>Статус<select class="text-field" id="nv-status">${Object.entries(HIRE_STATUS).map(([k,m]) => `<option value="${k}">${m.label}</option>`).join("")}</select></label>
        <label id="nv-hired-wrap" style="display:none;">Дата закриття (найму)<input type="date" class="text-field" id="nv-hired" /></label>
      </div>
      <div class="form-error" id="nv-error" style="display:none;"></div>
      <div class="vform-actions">
        <button class="btn2 btn-ghost" id="nv-cancel">Скасувати</button>
        <button class="btn2 btn-navy" id="nv-save">Зберегти вакансію</button>
      </div>
    </div>
  `;
  const statusSel = document.getElementById("nv-status");
  statusSel.addEventListener("change", () => { document.getElementById("nv-hired-wrap").style.display = statusSel.value === "filled" ? "block" : "none"; });
  document.getElementById("nv-cancel").addEventListener("click", () => { addingVacancy = false; renderVacanciesSubTabContent(); });
  document.getElementById("nv-save").addEventListener("click", () => {
    const storeCode = currentUser.isAdmin ? document.getElementById("nv-store").value : currentUser.store;
    const position = document.getElementById("nv-position").value;
    const employmentShare = numOrNull(document.getElementById("nv-share").value) ?? 0.5;
    const openedDate = document.getElementById("nv-opened").value;
    const hireStatus = document.getElementById("nv-status").value;
    const hiredDate = document.getElementById("nv-hired") ? document.getElementById("nv-hired").value : "";
    const errEl = document.getElementById("nv-error");
    if(!openedDate){ errEl.textContent = "Вкажіть дату відкриття."; errEl.style.display="block"; return; }
    if(hireStatus === "filled" && !hiredDate){ errEl.textContent = "Вкажіть дату закриття (найму)."; errEl.style.display="block"; return; }
    const newVacancy = { id:"v_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), storeCode, vacancyName:null, position, employmentShare,
      openedDate, hiredDate: hireStatus==="filled" ? hiredDate : null, hireStatus, responsiblePerson:null, priority:null,
      minorEmployeePresent:null, searchChannels:[], marketingPresence:"", ambassadorActions:"", comments:[], workUaContacts:null, workUaUpdatedAt:null,
      candidateCount:null, openContacts:null };
    vacancies.unshift(newVacancy);
    persistVacancies(newVacancy.id); addingVacancy = false; renderVacanciesSubTabContent();
  });
}

function vacancyRowHtml(v){
  const info = vacancyInfo(v);
  const statusMeta = HIRE_STATUS[v.hireStatus || "open"];
  const store = stores.find(s => s.code === v.storeCode);
  const rowColor = info.overdue ? "var(--red)" : statusMeta.color;
  const expanded = expandedVacancy === v.id;
  const canEdit = currentUser.isAdmin || v.storeCode === currentUser.store;
  const ro = canEdit ? "" : "disabled";
  const src = sourcingStatus(v);
  const commentCount = normalizeVacancyComments(v).length;
  let targetCell = `<span class="target-muted">—</span>`;
  if(v.hireStatus === "filled"){
    targetCell = info.timeToFill != null
      ? `<span class="${info.timeToFill>OVERDUE_DAYS?'overdue-flag':'target-ok'}">${info.timeToFill} дн. <span class="target-muted">(ціль ${OVERDUE_DAYS})</span></span>`
      : `<span class="overdue-flag">вкажіть дату</span>`;
  } else if(v.hireStatus === "open" || !v.hireStatus){
    targetCell = `<span class="${info.overdue?'overdue-flag':'target-muted'}">${info.daysOpen} дн. ${info.overdue?"· прострочено":`(ціль ${OVERDUE_DAYS})`}</span>`;
  }
  const mainRow = `
    <tr class="vac-row" data-id="${v.id}" style="--row-color:${rowColor}">
      <td class="vac-td vac-td--store"><span class="vac-code">${escapeHtml(v.storeCode)}</span>${store ? `<span class="vac-sm">${escapeHtml(store.sm)}</span>` : ""}</td>
      <td class="vac-td vac-td--center">${v.employmentShare ?? "—"} ставки</td>
      <td class="vac-td vac-td--center"><span class="vac-position">${escapeHtml(v.position||"—")}</span></td>
      <td class="vac-td vac-td--center"><input type="text" inputMode="numeric" class="num-field" style="width:52px;" data-vac-field="candidateCount" placeholder="—" value="${v.candidateCount ?? ""}" ${ro} /></td>
      <td class="vac-td vac-td--center"><input type="text" inputMode="numeric" class="num-field" style="width:52px;" data-vac-field="openContacts" placeholder="—" value="${v.openContacts ?? ""}" ${ro} /></td>
      <td class="vac-td vac-td--center"><span class="activity-badge" style="color:${src.color};background:#fff;border:1px solid ${src.border};">${src.label}</span></td>
      <td class="vac-td vac-td--center"><input type="date" class="date-input-inline" data-vac-field="openedDate" value="${v.openedDate||""}" ${ro} /></td>
      <td class="vac-td vac-td--center">
        <select class="status-select" data-vac-field="hireStatus" style="color:${statusMeta.color}" ${ro}>
          ${Object.entries(HIRE_STATUS).map(([k,m]) => `<option value="${k}" ${v.hireStatus===k?"selected":""}>${m.label}</option>`).join("")}
        </select>
        ${v.hireStatus === "filled" ? `<input type="date" class="date-input-inline" data-vac-field="hiredDate" value="${v.hiredDate||""}" style="margin-top:4px;display:block;" ${ro} />` : ""}
      </td>
      <td class="vac-td vac-td--center">${targetCell}</td>
      <td class="vac-td vac-td--actions">${canEdit ? `<button class="icon-btn" data-action="delete" title="Видалити">✕</button>` : ""}<button class="icon-btn" data-action="expand" title="Деталі">${expanded ? "▲" : "▼"}</button></td>
    </tr>`;
  const detailRow = expanded ? `
    <tr class="vac-detail-row"><td class="vac-td vac-detail-td" colspan="10">
      <div class="vac-expanded-grid">
        <div><span class="exp-label">Відповідальний:</span><select class="text-field" data-vac-field="responsiblePerson" ${ro}><option value="">—</option>${RESPONSIBLE_OPTIONS.map(r => `<option value="${r}" ${v.responsiblePerson===r?"selected":""}>${r}</option>`).join("")}</select></div>
        <div><span class="exp-label">Пріоритет:</span><select class="text-field" data-vac-field="priority" ${ro}><option value="">—</option><option value="1" ${v.priority==1?"selected":""}>1</option><option value="2" ${v.priority==2?"selected":""}>2</option><option value="3" ${v.priority==3?"selected":""}>3</option></select></div>
        <div><span class="exp-label">Неповнолітніх:</span> ${v.minorEmployeePresent ?? "—"}</div>
        <div><span class="exp-label">Маркетинг:</span> ${escapeHtml(v.marketingPresence||"—")}</div>
      </div>
      <div style="margin-top:10px;"><button class="comments-btn" data-action="open-vac-comments">Коментарі${commentCount ? `<span class="count">${commentCount}</span>` : ""}</button></div>
    </td></tr>` : "";
  return mainRow + detailRow;
}

function wireVacancyRowEvents(){
  document.querySelectorAll('.vac-row').forEach(row => {
    const id = row.dataset.id;
    const v0 = vacancies.find(x => x.id === id);
    const canEdit = v0 && (currentUser.isAdmin || v0.storeCode === currentUser.store);
    row.querySelectorAll('[data-vac-field]').forEach(inp => {
      inp.addEventListener("change", () => {
        if(!canEdit) return;
        const v = vacancies.find(x => x.id === id); if(!v) return;
        const field = inp.dataset.vacField;
        if(field === "candidateCount" || field === "openContacts"){
          v[field] = numOrNull(inp.value);
        } else {
          v[field] = inp.value || (field==="hiredDate"?null:inp.value);
        }
        persistVacancies(id); renderVacanciesSubTabContent();
      });
    });
    const delBtn = row.querySelector('[data-action="delete"]');
    if(delBtn && canEdit) delBtn.addEventListener("click", () => { vacancies = vacancies.filter(v => v.id !== id); persistVacancies(id); renderVacanciesSubTabContent(); });
    const expBtn = row.querySelector('[data-action="expand"]');
    if(expBtn) expBtn.addEventListener("click", () => { expandedVacancy = expandedVacancy === id ? null : id; renderVacanciesSubTabContent(); });
  });
  document.querySelectorAll('.vac-detail-row [data-vac-field]').forEach(inp => {
    inp.addEventListener("change", () => {
      const tr = inp.closest("tr").previousElementSibling;
      const id = tr ? tr.dataset.id : null; if(!id) return;
      const v = vacancies.find(x => x.id === id); if(!v) return;
      if(!(currentUser.isAdmin || v.storeCode === currentUser.store)) return;
      const field = inp.dataset.vacField;
      v[field] = field === "priority" ? (inp.value===""?null:Number(inp.value)) : inp.value;
      persistVacancies(id);
    });
  });
  document.querySelectorAll('[data-action="open-vac-comments"]').forEach(btn => {
    btn.addEventListener("click", () => {
      const tr = btn.closest("tr").previousElementSibling;
      const id = tr ? tr.dataset.id : null; if(!id) return;
      commentsModalTarget = { kind: "vacancy", id };
      openCommentsModal();
    });
  });
}

// ================= TAB 3: ВІДПОВІДАЛЬНІСТЬ (zones) =================

function renderZonesTab(){
  const wrap = document.getElementById("tab-content");
  const filledCount = zones.filter(z => z.responsibles && z.responsibles.length > 0).length;
  const zonesTotal = zones.length || 1; // guards the % math below if zones is ever empty
  const unfilledCount = zones.length - filledCount;
  const avgProgress = zones.length ? Math.round(zones.reduce((s,z)=>s+(Number.isFinite(z.progress)?z.progress:0),0)/zones.length) : 0;
  const avgColor = avgProgress < 40 ? "var(--red)" : avgProgress < 70 ? "var(--amber)" : "var(--green)";

  // "Потребує уваги" — zones with no responsible assigned at all, or with
  // a responsible but very low progress; unassigned zones sort first since
  // that's the more fundamental gap.
  const needsAttentionZones = zones
    .map(z => ({ z, hasResp: !!(z.responsibles && z.responsibles.length > 0), progress: Number.isFinite(z.progress) ? z.progress : 0 }))
    .filter(x => !x.hasResp || x.progress < 40)
    .sort((a,b) => (a.hasResp === b.hasResp) ? a.progress - b.progress : (a.hasResp ? 1 : -1));

  wrap.innerHTML = `
    ${heroBannerHtml("Відповідальність — зони амбасадорів дістрикту")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ПРИЗНАЧЕНО ЗОН</div><div class="val">${filledCount}<span class="unit">/ ${zones.length}</span></div></div>
      <div class="stat-card"><div class="lbl">КАТЕГОРІЙ</div><div class="val">${CATEGORIES.length}</div></div>
      <div class="stat-card"><div class="lbl">КОМЕНТАРІВ ВСЬОГО</div><div class="val">${zones.reduce((s,z)=>s+(z.comments||[]).length,0)}</div></div>
    </section>
    <section class="overview-row">
      ${gaugeHtml(avgProgress, avgColor, "Середній прогрес по зонах", `${avgProgress}% в середньому`, `${filledCount}/${zones.length} зон із призначеним відповідальним`)}
      <div class="tg-card" style="margin-bottom:0;">
        <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл зон за призначенням</div>
        <div class="dist-bar-row">
          <div class="dist-bar-name">Призначено</div>
          <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(filledCount/zonesTotal*100)}%;background:var(--green);"></div></div>
          <div class="dist-bar-count">${filledCount} · ${Math.round(filledCount/zonesTotal*100)}%</div>
        </div>
        <div class="dist-bar-row">
          <div class="dist-bar-name">Не призначено</div>
          <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(unfilledCount/zonesTotal*100)}%;background:var(--red);"></div></div>
          <div class="dist-bar-count">${unfilledCount} · ${Math.round(unfilledCount/zonesTotal*100)}%</div>
        </div>
      </div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">1</div><h2>Потребує уваги</h2>
        <div class="count ${needsAttentionZones.length===0?'done':''}">${needsAttentionZones.length===0?"без зауважень":`${needsAttentionZones.length} ${pluralUA(needsAttentionZones.length, "зона", "зони", "зон")}`}</div>
      </div>
      ${needsAttentionZones.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Зони без призначеного відповідального або з прогресом нижче 40%.</div>
        <div class="attn-list">
        ${needsAttentionZones.map(({z, hasResp, progress}) => { const progColor = progress<40?'var(--red)':progress<70?'var(--amber)':'var(--green)'; return `
          <div class="attn-row" style="--card-color:${hasResp?progColor:'var(--red)'};">
            <div class="attn-name">${escapeHtml(z.title)}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:${hasResp?'var(--green)':'var(--red)'};border-color:${hasResp?'var(--green)':'var(--red)'};background:#fff;">${hasResp?"Призначено":"Не призначено"}</span>
              <span class="attn-badge attn-badge-progress">
                <span class="mini-bar"><span class="mini-bar-fill" style="width:${progress}%;background:${progColor};"></span></span>
                <span>${progress}%</span>
              </span>
            </div>
          </div>
        `; }).join("")}
        </div>
      ` : `<div class="empty-state">Наразі жодна зона не потребує уваги.</div>`}
    </section>

    ${currentUser.isAdmin ? `
    <div style="display:flex; justify-content:flex-end; margin-bottom:${addingZone ? "0" : "18px"};">
      <button class="btn2 btn-navy" id="add-zone-btn">+ Додати зону</button>
    </div>
    <div id="add-zone-form"></div>
    ` : ""}

    <div id="zones-root"></div>
  `;
  const addZoneBtn = document.getElementById("add-zone-btn");
  if(addZoneBtn) addZoneBtn.addEventListener("click", () => { addingZone = !addingZone; renderZonesTab(); });
  if(addingZone) renderAddZoneForm();
  const zonesRoot = document.getElementById("zones-root");
  CATEGORIES.forEach((cat, catIdx) => {
    const items = zones.filter(z => z.cat === cat);
    if(items.length === 0) return;
    const catFilled = items.filter(z => z.responsibles && z.responsibles.length > 0).length;
    const catDone = catFilled === items.length;
    const section = document.createElement("div");
    section.className = "category";
    section.innerHTML = `
      <div class="category-head">
        <span class="cat-index">${String(catIdx+1).padStart(2,"0")}</span>
        <h2>${escapeHtml(cat)}</h2>
        <span class="count ${catDone?'done':''}">${catFilled}/${items.length}</span>
      </div>
      <div class="cards-grid">${items.map(z => zoneCardHtml(z)).join("")}</div>
    `;
    zonesRoot.appendChild(section);
  });
  wireZoneEvents();
}

function renderAddZoneForm(){
  const host = document.getElementById("add-zone-form");
  if(!host) return;
  host.innerHTML = `
    <div class="vform" style="margin-bottom:18px;">
      <div class="vform-grid">
        <label>Категорія<select class="text-field" id="nz-cat">${CATEGORIES.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("")}</select></label>
        <label>Назва<input class="text-field" id="nz-title" placeholder="Напр. Welcome day" /></label>
        <label>Підзаголовок<input class="text-field" id="nz-sub" placeholder="Необов'язково" /></label>
      </div>
      <label style="display:block;">Ціль<textarea class="textarea" id="nz-goal" rows="2" placeholder="Ціль: …"></textarea></label>
      <div class="form-error" id="nz-error" style="display:none;"></div>
      <div class="vform-actions">
        <button class="btn2 btn-ghost" id="nz-cancel">Скасувати</button>
        <button class="btn2 btn-navy" id="nz-save">Зберегти зону</button>
      </div>
    </div>
  `;
  document.getElementById("nz-cancel").addEventListener("click", () => { addingZone = false; renderZonesTab(); });
  document.getElementById("nz-save").addEventListener("click", () => {
    const cat = document.getElementById("nz-cat").value;
    const title = document.getElementById("nz-title").value.trim();
    const sub = document.getElementById("nz-sub").value.trim();
    const goal = document.getElementById("nz-goal").value.trim();
    const errEl = document.getElementById("nz-error");
    if(!title){ errEl.textContent = "Вкажіть назву зони."; errEl.style.display = "block"; return; }
    const newZone = { id: "z_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), cat, title, sub, goal, responsibles: [], progress: 0, comments: [] };
    zones.push(newZone);
    persistZones(); addingZone = false; renderZonesTab();

function zoneCardHtml(z){
  const list = (z.responsibles || []).filter(Boolean);
  const hasResp = list.length > 0;
  const commentCount = (z.comments || []).length;
  const progress = Number.isFinite(z.progress) ? z.progress : 0;
  return `
    <div class="card" data-zone-id="${z.id}" style="--card-color:${hasResp?'var(--green)':'var(--red)'}">
      <div class="card-top"><div><h3>${escapeHtml(z.title)}</h3>${z.sub ? `<div class="meta">${escapeHtml(z.sub)}</div>` : ""}</div></div>
      <p class="goal">${escapeHtml(z.goal)}</p>
      <div class="progress-block">
        <div class="progress-head">
          <span class="lbl">Прогрес</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="val" id="progress-val-${z.id}">${progress}%</span>
            <button class="icon-btn" data-unlock-id="${z.id}" title="Розблокувати повзунок для редагування">🔓</button>
          </span>
        </div>
        <input type="range" min="0" max="100" value="${progress}" data-progress-id="${z.id}" style="--pct:${progress}%" disabled />
      </div>
      <div class="resp-row">
        <div class="resp-label">${list.length > 1 ? "Відповідальні" : "Відповідальний"}</div>
        ${hasResp ? list.map(n => `<div class="resp-name"><span class="dot"></span>${escapeHtml(n)}</div>`).join("") : `<div class="resp-name empty"><span class="dot"></span>Не призначено</div>`}
        ${z.lastEditedBy ? `<div class="meta">оновив: ${escapeHtml(z.lastEditedBy)}</div>` : ""}
      </div>
      <div class="card-actions">
        <button class="edit-link" data-assign-id="${z.id}">Призначити →</button>
        <button class="comments-btn" data-comments-id="${z.id}">Коментарі${commentCount ? `<span class="count">${commentCount}</span>` : ""}</button>
      </div>
    </div>
  `;
}

function wireZoneEvents(){
  document.querySelectorAll('[data-assign-id]').forEach(btn => {
    btn.addEventListener("click", () => {
      const z = zones.find(x => x.id === btn.dataset.assignId);
      if(!z) return;
      const current = (z.responsibles||[]).join(", ");
      const val = window.prompt(`Відповідальний(і) за "${z.title}" (через кому, напр. "Ім'я — J104"):`, current);
      if(val === null) return;
      const oldList = (z.responsibles || []).slice();
      z.responsibles = val.split(",").map(s=>s.trim()).filter(Boolean).slice(0,3);
      z.lastEditedBy = currentUser.name;
      z.lastEditedAt = new Date().toISOString();
      persistZones();
      // Notify the District Manager (bell icon) whenever the assignment
      // actually changes — but not when they're the one changing it.
      if(JSON.stringify(oldList) !== JSON.stringify(z.responsibles)) logResponsibilityChange(z, oldList, z.responsibles);
      renderZonesTab();
    });
  });
  document.querySelectorAll('[data-comments-id]').forEach(btn => {
    btn.addEventListener("click", () => { commentsModalTarget = { kind: "zone", id: btn.dataset.commentsId }; openCommentsModal(); });
  });
  // The slider starts `disabled` (see zoneCardHtml) so it can't be nudged by
  // a stray click, scroll-wheel-while-hovering, or touch-scroll gesture —
  // it only becomes draggable after an explicit unlock click, and re-locks
  // itself the moment a drag commits, so each change takes a deliberate
  // unlock + drag, never an accidental one.
  document.querySelectorAll('[data-unlock-id]').forEach(btn => {
    btn.addEventListener("click", () => {
      const inp = document.querySelector(`input[data-progress-id="${btn.dataset.unlockId}"]`);
      if(!inp) return;
      inp.disabled = false;
      inp.focus();
    });
  });
  document.querySelectorAll('input[type=range][data-progress-id]').forEach(inp => {
    inp.addEventListener("input", () => {
      inp.style.setProperty("--pct", inp.value + "%");
      const lbl = document.getElementById("progress-val-" + inp.dataset.progressId);
      if(lbl) lbl.textContent = inp.value + "%";
    });
    inp.addEventListener("change", () => {
      const z = zones.find(x => x.id === inp.dataset.progressId);
      if(!z) return;
      z.progress = Number(inp.value);
      persistZones();
      inp.disabled = true;
    });
  });
}

// Shared comments-thread modal — one implementation for every entity on the
// site that keeps a timestamped/attributed comment history (zones, stores,
// vacancies), keyed by `commentsModalTarget.kind`. Add a new kind to this
// table rather than forking a second modal when the next entity needs
// comments too.
const COMMENTS_MODAL_KINDS = {
  zone: {
    find: id => zones.find(x => x.id === id),
    list: z => (z.comments = z.comments || []),
    title: z => z.title,
    persist: persistZones,
    rerender: renderZonesTab,
  },
  store: {
    find: id => stores.find(x => x.code === id),
    list: normalizeStoreComments,
    title: s => `${s.code}${s.name ? " · " + s.name : ""}`,
    persist: persistStores,
    rerender: renderDistrictTab,
  },
  vacancy: {
    find: id => vacancies.find(x => x.id === id),
    list: normalizeVacancyComments,
    title: v => `${v.storeCode}${v.position ? " · " + v.position : ""}`,
    persist: persistVacancies,
    rerender: renderVacanciesSubTabContent,
  },
};
function openCommentsModal(){
  if(!commentsModalTarget) return;
  const { kind, id } = commentsModalTarget;
  const spec = COMMENTS_MODAL_KINDS[kind];
  const entity = spec && spec.find(id);
  if(!spec || !entity) return;
  const list = spec.list(entity);
  const title = spec.title(entity);
  const overlay = document.getElementById("comments-overlay");
  overlay.innerHTML = `
    <div class="modal">
      <button class="close-x" id="comments-close">✕</button>
      <h3>Коментарі</h3>
      <div class="meta" style="margin-bottom:14px;">${escapeHtml(title)}</div>
      <div class="comments-list">
        ${list.length === 0 ? `<div class="comments-empty">Ще немає коментарів.</div>` :
          list.map(c => `<div class="comment-item"><div class="txt">${escapeHtml(c.text)}</div><div class="who-when">${escapeHtml(c.who)}${c.who&&c.when?" · ":""}${escapeHtml(c.when)}</div></div>`).join("")}
      </div>
      <textarea class="textarea" id="new-comment-text" rows="3" placeholder="Новий коментар…"></textarea>
      <div class="modal-actions">
        <button class="btn2 btn-ghost" id="comments-cancel">Закрити</button>
        <button class="btn2 btn-navy" id="comments-add">Додати</button>
      </div>
    </div>
  `;
  overlay.classList.add("open");
  document.getElementById("comments-close").onclick = closeCommentsModal;
  document.getElementById("comments-cancel").onclick = closeCommentsModal;
  document.getElementById("comments-add").onclick = () => {
    const txt = document.getElementById("new-comment-text").value.trim();
    if(!txt) return;
    const entry = { text: txt, who: currentUser.name, when: new Date().toLocaleString("uk-UA", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}) };
    list.push(entry);
    spec.persist(id);
    spec.rerender();
    openCommentsModal();
  };
}
function closeCommentsModal(){
  const overlay = document.getElementById("comments-overlay");
  if(overlay) overlay.classList.remove("open");
}

// Bell-icon notification list: recent changes to zones' assigned
// responsible person(s), so the District Manager doesn't have to notice
// a reassignment by re-checking every card on the Відповідальність tab.
function notifItemHtml(e){
  const when = new Date(e.at).toLocaleString("uk-UA", {day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const from = (e.oldResponsibles||[]).join(", ") || "не призначено";
  const to = (e.newResponsibles||[]).join(", ") || "не призначено";
  return `
    <div class="comment-item">
      <div class="txt"><b>${escapeHtml(e.zoneTitle)}</b><br/>${escapeHtml(from)} → ${escapeHtml(to)}</div>
      <div class="who-when">${escapeHtml(e.changedBy)} · ${when}</div>
    </div>
  `;
}
function openNotifModal(){
  const overlay = document.getElementById("notif-overlay");
  if(!overlay) return;

function openPasswordModal(){
  const overlay = document.getElementById("password-overlay");
  if(!overlay) return;
  overlay.innerHTML = `
    <div class="modal">
      <button class="close-x" id="pw-close">✕</button>
      <h3>Змінити пароль</h3>
      <div class="meta" style="margin-bottom:14px;">${escapeHtml(currentUser.name)}</div>
      <label>Поточний пароль</label>
      <input type="password" id="pw-current" placeholder="Поточний пароль" />
      <label>Новий пароль</label>
      <input type="password" id="pw-new" placeholder="Новий пароль" />
      <label>Повторіть новий пароль</label>
      <input type="password" id="pw-confirm" placeholder="Повторіть новий пароль" />
      <div class="err" id="pw-err"></div>
      <div class="modal-actions">
        <button class="btn2 btn-ghost" id="pw-cancel">Скасувати</button>
        <button class="btn2 btn-navy" id="pw-save">Зберегти</button>
      </div>
    </div>
  `;
  overlay.classList.add("open");
  document.getElementById("pw-close").onclick = closePasswordModal;
  document.getElementById("pw-cancel").onclick = closePasswordModal;
  document.getElementById("pw-save").onclick = async () => {
    const cur = document.getElementById("pw-current").value;
    const next = document.getElementById("pw-new").value;
    const confirm = document.getElementById("pw-confirm").value;
    const errEl = document.getElementById("pw-err");
    const correctCurrent = currentUser.isAdmin ? adminPassword : users.find(u => u.id === currentUser.id)?.password;
    if(!(await verifyCredential(cur, correctCurrent))){ errEl.textContent = "Поточний пароль невірний."; return; }
    if(!next || next.length < 3){ errEl.textContent = "Новий пароль має містити мінімум 3 символи."; return; }
    if(next !== confirm){ errEl.textContent = "Паролі не співпадають."; return; }
    if(currentUser.isAdmin){
      adminPassword = await makeCredential(next);
      persistAdminPassword();
    } else {
      const u = users.find(u => u.id === currentUser.id);
      if(u){ u.password = await makeCredential(next); persistUsers(u.id); }
    }
    errEl.style.color = "var(--green)";
    errEl.textContent = "Пароль оновлено.";
    setTimeout(closePasswordModal, 900);
  };
}

  passwordModalOpen = false;
  const overlay = document.getElementById("password-overlay");

// Adam надіслав — фіксовані, вже відомі дати аж до лютого 2027, не щось, що

// нагадування за день до кожної дати — тримайте обидва місця синхронізованими
// при зміні цього календаря (проєкт без build-кроку для спільного модуля,
// той самий підхід, що й TG_LEVELS у worker.js).

}

function renderDeliveriesTab(containerId){

  DELIVERIES.forEach(d => { (byStore[d.store] = byStore[d.store] || []).push(d); });

  const totalCost = DELIVERIES.reduce((s,d) => s+d.cost, 0);
  const storesWithDeliveries = Object.keys(byStore).length;
  const avgCost = DELIVERIES.length ? Math.round(totalCost / DELIVERIES.length) : 0;

function equipmentCountFor(storeCode, itemId){
  const doc = equipment.find(e => e.storeCode === storeCode);

  const doc = equipment.find(e => e.storeCode === storeCode);
  if(!doc) return;
  doc.updatedAt = new Date().toISOString();
  debSave("equipment:"+storeCode, () => fsDocSet("kyiv1_equipment", storeCode, doc));
}

    if(results) results.innerHTML = equipmentSearchResultsHtml(equipmentSearchMatches());

  const storeSelect = document.getElementById("equipment-store-select");
  if(storeSelect) storeSelect.addEventListener("change", () => { equipmentStore = storeSelect.value; renderEquipmentSubTab(); });
  const canEdit = currentUser.isAdmin || equipmentStore === currentUser.store;
  if(!canEdit) return;
  sub.querySelectorAll("input[data-equip-id]").forEach(inp => {
    inp.addEventListener("change", () => {
      let doc = equipment.find(e => e.storeCode === equipmentStore);
      if(!doc){ doc = { storeCode: equipmentStore, counts: {} }; equipment.push(doc); }
      if(!doc.counts) doc.counts = {};
      const val = numOrNull(inp.value);
      if(val == null) delete doc.counts[inp.dataset.equipId]; else doc.counts[inp.dataset.equipId] = val;
      persistEquipment(equipmentStore);
    });

// ================= TAB: ЗВІТИ ТА ПОКАЗНИКИ =================
// District Manager надсилає показники дістрикту прямо в чат з Claude — сюди
// вони потрапляють без окремої форми на сайті, тому перегляд тут доступний
// і District Manager, і Store Managers, а редагування — лише через чат.

// Один рядок рейтингу (дистрикт або магазин) — та сама розмітка, що й скрізь
// у проєкті (.tg-bar-row), просто довжина стовпчика рахується від |value|,
// бо для деяких звітів (напр. "7-го коду") "кращий" показник — від'ємний.
// Стрілка з дельтою проти попереднього завантаження цього ж звіту — щоб
// динаміка була видна відразу в рядку, а не лише у сирих числах.
function kpiDeltaHtml(delta, goodDirection){
  if(delta == null) return "";
  const flat = Math.abs(delta) < 0.005;
  const improved = goodDirection === "low" ? delta < 0 : delta > 0;
  const color = flat ? "var(--ink-soft)" : (improved ? "var(--green)" : "var(--red)");
  const arrow = flat ? "•" : (delta > 0 ? "▲" : "▼");
  const rounded = Math.round(Math.abs(delta) * 100) / 100;
  return ` <span style="color:${color};font-size:11px;font-family:'Courier New',monospace;">${arrow}${flat ? "0" : rounded}</span>`;
}

// Кольорова градація (не бінарне "вкладається/ні") — де магазин стоїть
// між lo (гірший кінець діапазону) і hi (кращий кінець), суцільним
// переходом червоний → жовтий → зелений, а не лише двома кольорами.
// Діапазон зазвичай беремо з рейтингу дистриктів (найгірший..найкращий
// дистрикт мережі) — так магазин фарбується і "між собою" (різні
// магазини дають різні позиції в тому самому діапазоні), і "відносно
// інших дистриктів" одночасно. goodDirection="low" інвертує напрямок
// (звіти типу "7-го коду", де глибше від'ємне значення — краще).
//
// mid — необов'язкова фіксована ціль (напр. 98% для Click & Collect):
// коли задана, шкала ламається на дві половини (lo..mid і mid..hi), щоб
// один магазин-аутсайдер далеко за межами цілі не "розтягував" шкалу і
// не робив усіх інших зеленими попри те, що вони самі нижче цілі.
function kpiGradientColor(value, lo, hi, goodDirection, mid){
  if(value == null || lo == null || hi == null || lo === hi) return null;
  const flip = goodDirection === "low";
  const v = flip ? -value : value;
  const lo2 = flip ? -hi : lo;
  const hi2 = flip ? -lo : hi;
  const mid2 = mid == null ? null : (flip ? -mid : mid);
  let hue;
  if(mid2 != null && mid2 > lo2 && mid2 < hi2){
    hue = v <= mid2
      ? Math.max(0, Math.min(1, (v - lo2) / (mid2 - lo2))) * 60
      : 60 + Math.max(0, Math.min(1, (v - mid2) / (hi2 - mid2))) * 60;
  } else {
    hue = Math.max(0, Math.min(1, (v - lo2) / (hi2 - lo2))) * 120;
  }
  return `hsl(${Math.round(hue)}, 68%, 40%)`;
}

// nameNote — необов'язковий другий рядок під назвою/кодом магазину (напр.
// сума в грн) — рендериться нижче, а не в тому самому вузькому 160px
// стовпці, що назва/код, інакше він просто обрізається (text-overflow).
// sumCol — необов'язкова додаткова колонка між назвою і смугою (напр.
// сума в грн): {text, color}. Права вирівняна, моноширинна, тож числа
// різної довжини все одно шикуються в акуратний стовпчик, а не просто
// вільний текст під назвою.
function kpiBarRow(label, code, value, maxAbs, highlight, suffix, deltaHtml, gradientColor, sumCol){
  const valueHtml = value == null ? "—" : `<span${gradientColor ? ` style="color:${gradientColor};font-weight:700;"` : ""}>${value}${suffix || ""}</span>`;
  const widthPct = value == null ? 0 : Math.max(2, Math.round(Math.abs(value) / (maxAbs || 1) * 100));
  return `
    <div class="tg-bar-row"${highlight ? ' style="font-weight:700;"' : ""}>
      <div class="tg-bar-name">${escapeHtml(label)}${code ? ` <span style="font-family:'Courier New',monospace;color:var(--ink-soft);font-size:11px;">${escapeHtml(code)}</span>` : ""}</div>
      ${sumCol ? `<div class="tg-bar-sum" style="color:${sumCol.color || "var(--ink-soft)"};">${escapeHtml(sumCol.text)}</div>` : ""}
      <div class="tg-bar-track"><div class="tg-bar-fill" style="width:${widthPct}%;${gradientColor ? `background:${gradientColor};` : ""}"></div></div>
      <div class="tg-bar-count" style="width:auto;">${valueHtml}${deltaHtml || ""}</div>
    </div>
  `;
}

// ownCodes — коди ваших магазинів (Set), якщо один із них потрапив у
// топ/антитоп по мережі, рядок виділяється жирним, щоб не загубився серед
// чужих магазинів.
function kpiTop10ColumnHtml(title, cls, items, unit, ownCodes){
  const tint = cls === "worst" ? "var(--red)" : "var(--green)";
  return `
    <div class="top10-col" style="background:color-mix(in srgb, ${tint} 6%, var(--paper-2));border:1px solid color-mix(in srgb, ${tint} 18%, var(--border-card));border-radius:12px;padding:14px 16px;">
      <div class="top5-head ${cls}">${escapeHtml(title)}</div>
      ${items.map(x => `<div class="top5-row"${ownCodes && ownCodes.has(x.code) ? ' style="font-weight:700;"' : ""}><span class="name">${escapeHtml(x.name)}<span class="code">${escapeHtml(x.code)}${x.district ? " · " + escapeHtml(x.district) : ""}</span></span><span class="pct">${x.value}${unit}</span></div>`).join("")}
    </div>
  `;
}

function renderKpiBenchmarkCard(r, prevEntry){
  // "Найвищий показник" не завжди означає найбільше число — для звітів на
  // кшталт "7-го коду" кращий результат від'ємний і глибший. dirMul ставить
  // список у порядок "від найкращого до найгіршого" в обох випадках.
  const dirMul = r.goodDirection === "low" ? 1 : -1;
  const byGoodness = (a, b) => {
    if(a.value == null && b.value == null) return 0;
    if(a.value == null) return 1;
    if(b.value == null) return -1;
    return (a.value - b.value) * dirMul;
  };
  const districts = [...r.districts].sort(byGoodness);
  const ownStores = [...r.ownStores].sort(byGoodness);
  const maxDistrictAbs = Math.max(1, ...districts.map(d => Math.abs(d.value)));
  const maxStoreAbs = Math.max(1, ...ownStores.map(s => Math.abs(s.value ?? 0)));
  const ownCodes = new Set(ownStores.map(s => s.code));

  // Динаміка проти попереднього завантаження цього ж звіту (не проти
  // попереднього тижня всередині одного файлу — деякі звіти носять лише
  // один зріз, тож єдине джерело "було/стало" — минуле надсилання).
  const prevDistrict = prevEntry ? Object.fromEntries(prevEntry.districts.map(d => [d.name, d.value])) : null;
  const prevStore = prevEntry ? Object.fromEntries(prevEntry.ownStores.map(s => [s.code, s.value])) : null;
  const districtDelta = (d) => prevDistrict && prevDistrict[d.name] != null && d.value != null ? d.value - prevDistrict[d.name] : null;
  const storeDelta = (s) => prevStore && prevStore[s.code] != null && s.value != null ? s.value - prevStore[s.code] : null;

  // Діапазон градації — від найгіршого до найкращого дистрикту мережі
  // (r.worst/r.best уже пораховані вище): магазин, що б'є найкращий
  // дистрикт, виходить повністю зеленим, гірший за найгірший — повністю
  // червоним, а решта — плавний перехід між ними.
  const storeColorLo = Math.min(r.best.value, r.worst.value);
  const storeColorHi = Math.max(r.best.value, r.worst.value);

  return `
    <div class="tg-desc" style="margin-bottom:14px;">${escapeHtml(r.period)} · ${r.storesInScope} магазинів у зрізі · ${r.districtsCount} дистриктів${prevEntry ? ` · порівняно з «${escapeHtml(prevEntry.period)}»` : ""}</div>
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">СЕРЕДНЄ ПО МЕРЕЖІ</div><div class="val">${r.networkAvg}${r.unit}</div></div>
      <div class="stat-card"><div class="lbl">НАЙВИЩИЙ ПОКАЗНИК</div><div class="val" style="color:var(--green);">${r.best.value}${r.unit}<span class="unit">${escapeHtml(r.best.district)}</span></div></div>
      <div class="stat-card"><div class="lbl">МІНІМАЛЬНИЙ ПОКАЗНИК</div><div class="val" style="color:var(--red);">${r.worst.value}${r.unit}<span class="unit">${escapeHtml(r.worst.district)}</span></div></div>
      <div class="stat-card"><div class="lbl">РОЗРИВ ТОП/МІНІМУМ</div><div class="val">${r.gap}${r.unit}</div></div>
    </section>

    <div style="font-weight:700;font-size:12.5px;margin:6px 0 8px;color:var(--ink-2);">Дистрикти — від найвищого показника до найнижчого</div>
    ${districts.map(d => kpiBarRow(d.name, null, d.value, maxDistrictAbs, d.name === r.ownDistrictName, "", kpiDeltaHtml(districtDelta(d), r.goodDirection))).join("")}

    <div class="tg-card" style="margin-top:18px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--ink-2);">${escapeHtml(r.ownDistrictName)} — ваш дістрикт, по магазинах</div>
      ${r.ownStoresInDistrict && ownStores.length < r.ownStoresInDistrict ? `<div class="tg-desc" style="margin-bottom:10px;">Дані є лише по ${ownStores.length} із ${r.ownStoresInDistrict} магазинів дістрикту — решта не потрапляє у цей звіт.</div>` : ""}
      ${ownStores.map(s => kpiBarRow(s.name, s.code, s.value, maxStoreAbs, false, "", kpiDeltaHtml(storeDelta(s), r.goodDirection), kpiGradientColor(s.value, storeColorLo, storeColorHi, r.goodDirection))).join("")}
    </div>

    <div class="top5-grid" style="margin-top:20px;">
      ${kpiTop10ColumnHtml("ТОП-10 НАЙКРАЩИХ", "best", r.topBest, r.unit, ownCodes)}
      ${kpiTop10ColumnHtml("ТОП-10 · ПОТРЕБУЮТЬ УВАГИ", "worst", r.topWorst, r.unit, ownCodes)}
    </div>
  `;
}

// Додатковий блок під бенчмарк-картку — коли один звіт насправді складений
// з кількох під-показників (напр. "Мобіліті" — 12 модулів StoreFront),
// замість того, щоб малювати рейтинг дистриктів під кожен окремо.
function kpiModuleBreakdownHtml(title, modules, unit){
  if(!modules || !modules.length) return "";
  const maxVal = Math.max(1, ...modules.map(m => Math.abs(m.value)));
  return `
    <div class="tg-card" style="margin-top:18px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--ink-2);">${escapeHtml(title)}</div>
      ${modules.map(m => kpiBarRow(m.label, null, m.value, maxVal, false, unit || "")).join("")}
    </div>
  `;
}

function renderKpiMobilityCard(r, prevEntry){
  return renderKpiBenchmarkCard(r, prevEntry) + kpiModuleBreakdownHtml(
    `${r.ownDistrictName} — модулі StoreFront: з потенціалом → лідери`,
    r.moduleBreakdown, r.unit
  );
}

// Одна діаграма-розбивка "по магазинах" для однієї категорії (DD past /
// 81 ст. / 42 ст.) — той самий kpiBarRow, лише з
// власним діапазоном градації в межах цієї категорії. Чим менше — тим
// краще (goodDirection "low"), як і в оригінальній частці залишків.
// Поруч зі значенням категорії — сума всіх трьох для цього магазину
// (s.share), щоб не робити її окремою діаграмою. Пропускає магазини, де
// саме цієї категорії немає в даних (напр. J121 без Marked for
// deletion), а не показує їх нулем.
// Кожна категорія (dd/mfd/online) несе свою власну суму в грн
// (ddUAH/mfdUAH/onlineUAH) — раніше тут помилково завжди показувався
// shareUAH (сума всіх трьох категорій разом), однаковий у всіх трьох
// діаграмах замість власного значення кожної.
const KPI_CLEARANCE_UAH_FIELD = { dd: "ddUAH", mfd: "mfdUAH", online: "onlineUAH" };

function kpiClearanceBreakdownPanel(title, stores, key){
  const list = stores.filter(s => s[key] != null).sort((a,b) => b[key] - a[key]);
  if(!list.length) return "";
  const max = Math.max(1, ...list.map(s => s[key]));
  const lo = Math.min(...list.map(s => s[key]));
  const hi = Math.max(...list.map(s => s[key]));
  // Сума в грн — окрема колонка (не текст під назвою), з власною
  // кольоровою градацією по діапазону цієї ж категорії серед магазинів
  // дістрикту (не по shareUAH — це вже сума всіх трьох категорій разом).
  const uahField = KPI_CLEARANCE_UAH_FIELD[key];
  const withSum = stores.filter(s => s[uahField] != null);
  const sumLo = withSum.length ? Math.min(...withSum.map(s => s[uahField])) : null;
  const sumHi = withSum.length ? Math.max(...withSum.map(s => s[uahField])) : null;
  return `
    <div class="tg-card" style="margin-top:18px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--ink-2);">${escapeHtml(title)}</div>
      ${list.map(s => {
        const sumCol = s[uahField] != null ? {
          text: `${Math.round(s[uahField]).toLocaleString("uk-UA")} грн`,
          color: kpiGradientColor(s[uahField], sumLo, sumHi, "low"),
        } : null;
        return kpiBarRow(s.name, s.code, s[key], max, false, "%", "", kpiGradientColor(s[key], lo, hi, "low"), sumCol);
      }).join("")}
    </div>
  `;
}

// Три статуси відносно середньої частки залишків по дістрикту (немає
// фіксованої цілі для цього звіту, як 98% у Click & Collect, тож
// поріг — власне середнє): понад 1.5× середнього — критично багато,
// вище середнього — підвищено, на рівні або нижче — норма. Той самий
// підхід і ті самі кольори, що й STATUS_META на вкладці "Магазини та
// ставки" (peopleCritical/peopleWarning/ok).
function kpiClearanceStatusBuckets(stores){
  const avg = stores.reduce((sum, s) => sum + s.share, 0) / stores.length;
  const buckets = [
    { key: "critical", label: "Критично багато", color: "var(--red)", count: 0 },
    { key: "elevated", label: "Підвищено", color: "var(--amber)", count: 0 },
    { key: "normal", label: "Норма", color: "var(--green)", count: 0 },
  ];
  stores.forEach(s => {
    if(s.share > avg * 1.5) buckets[0].count++;
    else if(s.share > avg) buckets[1].count++;
    else buckets[2].count++;
  });
  return buckets;
}

// Сумарні показники по дістрикту для кожної з трьох категорій (DD past /
// 81 ст. / 42 ст.) — той самий kpiBarRow, що й у діаграмах нижче (sumCol
// зліва перед смугою), лише тут рядок на категорію, а не на магазин: сума
// в грн по всьому дістрикту зліва, середнє % — сама смуга справа.
function kpiClearanceCategoryTotalsHtml(stores){
  const rows = [
    { label: "DD past", key: "dd", uahField: "ddUAH" },
    { label: "Залишки 81 ст.", key: "mfd", uahField: "mfdUAH" },
    { label: "Залишки 42 ст.", key: "online", uahField: "onlineUAH" },
  ].map(r => {
    const withPct = stores.filter(s => s[r.key] != null);
    const sumUAH = stores.reduce((sum, s) => sum + (s[r.uahField] || 0), 0);
    const avgPct = withPct.length ? round2(withPct.reduce((sum, s) => sum + s[r.key], 0) / withPct.length) : null;
    return { ...r, sumUAH, avgPct };
  });
  const max = Math.max(1, ...rows.map(r => r.avgPct || 0));
  return rows.map(r => kpiBarRow(
    r.label, null, r.avgPct, max, false, "%", "", null,
    { text: `${Math.round(r.sumUAH).toLocaleString("uk-UA")} грн` }
  )).join("");
}

function renderKpiClearanceCard(r){
  // Менше зростання = краще: цей блок фарбує "зміну за тиждень" зеленим,
  // коли вона від'ємна (залишків стало менше), і червоним, коли зросла.
  const stores = [...r.stores].sort((a,b) => b.share - a.share);
  const maxShare = Math.max(1, ...stores.map(s => s.share));
  // Немає даних по інших дистриктах у цьому звіті — градація тут лише
  // "між собою" (діапазон від найменшої до найбільшої частки залишків
  // серед власних магазинів).
  const shareColorLo = Math.min(...stores.map(s => s.share));
  const shareColorHi = Math.max(...stores.map(s => s.share));
  const cats = [...r.categories].sort((a,b) => b.value - a.value);
  const maxCat = Math.max(1, ...cats.map(c => c.value));
  const coverageNote = r.storesInScope < r.storesInDistrict
    ? `дані є лише по ${r.storesInScope} із ${r.storesInDistrict} магазинів дістрикту — решта не потрапляє у цей звіт`
    : `усі ${r.storesInDistrict} магазинів дістрикту`;
  const badgePillStyle = "font-family:'Courier New',monospace;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:#fff;";
  const badge = r.growthCount > 0
    ? `<span style="${badgePillStyle}color:var(--amber);border:1px solid var(--amber-dim);">Увага</span>`
    : `<span style="${badgePillStyle}color:var(--green);border:1px solid var(--green-dim);">Контроль</span>`;
  // Старіші завантаження несуть лише сумарну "share" без розбивки по
  // категоріях (dd/mfd/online) — для них лишаємо єдину діаграму, як і
  // раніше, замість трьох порожніх.
  const hasBreakdown = r.stores.some(s => s.dd != null || s.mfd != null || s.online != null);

  // Той самий формат "гейдж + розподіл за статусом", що й на вкладці
  // "Магазини та ставки" (gaugeHtml + .dist-bar-row), замість плоских
  // stat-card — одразу видно, скільки магазинів дійсно в нормі.
  const statusBuckets = kpiClearanceStatusBuckets(r.stores);
  const normalCount = statusBuckets.find(b => b.key === "normal").count;
  const normalPct = Math.round(normalCount / r.stores.length * 100);
  const gaugeColor = normalPct >= 70 ? "var(--green)" : normalPct >= 40 ? "var(--amber)" : "var(--red)";
  const weekChangeText = `${r.weekChange > 0 ? "+" : ""}${r.weekChange}%`;

  return `
    <div class="tg-desc" style="margin-bottom:14px;">${escapeHtml(r.periodRange)} · ${coverageNote}</div>
    <section class="overview-row">
      ${gaugeHtml(normalPct, gaugeColor, "Магазини в нормі", `${normalCount} / ${r.stores.length} магазинів`, `середня частка залишків ${r.currentShare}% · зміна за тиждень ${weekChangeText}`)}
      <div class="tg-card" style="margin-bottom:0;">
        ${hasBreakdown ? `
          <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Сумарні показники по дістрикту</div>
          ${kpiClearanceCategoryTotalsHtml(r.stores)}
        ` : `
          <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл магазинів за статусом</div>
          ${statusBuckets.map(b => `
            <div class="dist-bar-row">
              <div class="dist-bar-name">${escapeHtml(b.label)}</div>
              <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(b.count/r.stores.length*100)}%;background:${b.color};"></div></div>
              <div class="dist-bar-count">${b.count} · ${Math.round(b.count/r.stores.length*100)}%</div>
            </div>
          `).join("")}
        `}
      </div>
    </section>

    ${hasBreakdown ? `
      ${kpiClearanceBreakdownPanel("DD past — % від собівартості запасів", r.stores, "dd")}
      ${kpiClearanceBreakdownPanel("Залишки 81 ст. — % від собівартості запасів", r.stores, "mfd")}
      ${kpiClearanceBreakdownPanel("Залишки 42 ст. — % від собівартості запасів", r.stores, "online")}
    ` : `
      <div class="tg-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <div style="font-weight:700;font-size:13px;color:var(--ink-2);">Ваші магазини — від найбільшої частки залишків до найменшої</div>
          ${badge}
        </div>
        ${stores.map(s => kpiBarRow(s.name, s.code, s.share, maxShare, false, "", "", kpiGradientColor(s.share, shareColorLo, shareColorHi, "low"))).join("")}
      </div>
    `}

    ${cats.length ? `
    <div class="tg-card" style="margin-top:18px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:6px;color:var(--ink-2);">Товарні групи</div>
      <div class="tg-desc" style="margin-bottom:10px;">Частка кожної товарної групи в загальному обсязі залишків цього тижня (порівняння з минулим тижнем поки недоступне — потрібен файл за попередній період).</div>
      ${cats.map(c => kpiBarRow(c.label, null, c.value, maxCat, false)).join("")}
    </div>` : ""}
  `;
}

// Один блок метрики Click & Collect — заголовок, рейтинг дистриктів (свій
// виділено) і список власних магазинів. attachment-метрика має малу
// вибірку по кожному магазину, тож count (якщо є) показуємо поруч.
function kpiCCMetricBlock(title, metric, ownDistrictName, coverageNote, prevMetric, target){
  const districts = [...metric.districts].sort((a,b) => b.value - a.value);
  const maxDistrict = Math.max(1, ...districts.map(d => d.value));
  const maxOwn = Math.max(1, ...metric.ownStores.map(s => s.value));
  const ownRank = districts.findIndex(d => d.name === ownDistrictName) + 1;
  const badgePillStyle = "font-family:'Courier New',monospace;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;background:#fff;";
  const badge = ownRank === districts.length
    ? `<span style="${badgePillStyle}color:var(--amber);border:1px solid var(--amber-dim);margin-left:8px;">Увага</span>`
    : "";
  const prevDistrict = prevMetric ? Object.fromEntries(prevMetric.districts.map(d => [d.name, d.value])) : null;
  const prevStore = prevMetric ? Object.fromEntries(prevMetric.ownStores.map(s => [s.code, s.value])) : null;
  // Діапазон градації по магазинах — від найгіршого до найкращого
  // результату серед дистриктів і власних магазинів разом. Коли задана
  // фіксована ціль (напр. 98% для вчасного підтвердження), передаємо її
  // окремим "зламом" шкали (kpiGradientColor mid), а не просто додаємо в
  // діапазон — інакше один магазин-аутсайдер розтягнув би шкалу так, що
  // решта, і досі нижче цілі, вже виглядала б зеленою.
  const allValues = [...districts.map(d => d.value), ...metric.ownStores.map(s => s.value)];
  const storeColorLo = Math.min(...allValues);
  const storeColorHi = Math.max(...allValues);
  return `
    <div style="font-weight:700;font-size:12.5px;margin:18px 0 8px;color:var(--ink-2);">${escapeHtml(title)}${badge}</div>
    ${coverageNote ? `<div class="tg-desc" style="margin-bottom:8px;">${escapeHtml(coverageNote)}</div>` : ""}
    ${districts.map(d => kpiBarRow(d.name, null, d.value, maxDistrict, d.name === ownDistrictName, "%", prevDistrict && prevDistrict[d.name] != null ? kpiDeltaHtml(d.value - prevDistrict[d.name], "high") : "")).join("")}
    <div class="tg-card" style="margin-top:12px;">
      <div style="font-weight:700;font-size:13px;margin-bottom:10px;color:var(--ink-2);">${escapeHtml(ownDistrictName)} — по магазинах${target != null ? ` <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">(ціль ${target}%)</span>` : ""}</div>
      ${metric.ownStores.map(s => kpiBarRow(s.name, s.code, s.value, maxOwn, false, s.count != null ? `% (${s.count})` : "%", prevStore && prevStore[s.code] != null ? kpiDeltaHtml(s.value - prevStore[s.code], "high") : "", kpiGradientColor(s.value, storeColorLo, storeColorHi, "high", target))).join("")}
      ${metric.ownStores.some(s => s.count != null) ? `<div class="tg-desc" style="margin-top:8px;">У дужках — кількість замовлень C&C, на яких порахований показник (мала вибірка в частини магазинів).</div>` : ""}
    </div>
  `;
}

function renderKpiClickCollectCard(r, prevEntry){
  const attCoverage = r.attachment.storesInScope < r.storesInDistrict
    ? `Дані по додатковому товару є лише для ${r.attachment.storesInScope} із ${r.storesInDistrict} магазинів — по решті цього тижня не було зафіксовано жодного замовлення C&C з допродажем.`
    : "";
  return `

// Завжди показуємо кнопку(и) періоду — навіть коли він поки один, щоб
// одразу було видно, куди стане наступне оновлення (і щоб не смикати
// розмітку, коли з'являється друге).
// Маленький лінійний графік "показник по місяцях" для однієї картки
// магазину на вкладці "Швидкі показники" — SVG-рядок, вбудований прямо в
// innerHTML (на сайті поки немає інших SVG-графіків, тож без окремого
// компонента чи бібліотеки: лише лінія + заливка + підпис останньої
// точки, без наведення мишею — для простих щомісячних рядів цього
// достатньо). Порожні місяці (null) пропускаються, а не малюються нулем.
function fy2526ChartSvg(months, color, fmt){
  const W=290, H=112, PAD_L=4, PAD_T=10, PAD_B=18;
  const plotW=W-PAD_L*2, plotH=H-PAD_T-PAD_B;
  const xFor = i => PAD_L + plotW*i/11;
  const pts = [];
  for(let i=0;i<12;i++) if(months[i]!=null) pts.push({i, v:months[i]});
  if(!pts.length) return `<div class="fy-chart-empty">Немає даних.</div>`;

  const maxV = Math.max(...pts.map(p=>p.v)) * 1.3 || 1;
  const yFor = v => PAD_T + plotH*(1 - v/maxV);
  let marks = "";
  marks += `<line class="fy-gridline" x1="${PAD_L}" x2="${W-PAD_L}" y1="${yFor(0)}" y2="${yFor(0)}"/>`;
  const midV = maxV*0.5;
  marks += `<line class="fy-gridline" x1="${PAD_L}" x2="${W-PAD_L}" y1="${yFor(midV)}" y2="${yFor(midV)}"/>`;
  marks += `<text class="fy-axis-tick" x="${PAD_L}" y="${yFor(midV)-3}">${escapeHtml(fmtCompactUA(midV))}</text>`;
  [0,5,11].forEach(i => {
    marks += `<text class="fy-axis-label" x="${xFor(i)}" y="${H-4}" text-anchor="${i===0?'start':i===11?'end':'middle'}">${FY2526_MONTHS_UA[i]}</text>`;
  });

  if(pts.length === 1){
    const p = pts[0], cx = xFor(p.i), cy = yFor(p.v);
    marks += `<circle cx="${cx}" cy="${cy}" r="5" fill="${color}"/><circle cx="${cx}" cy="${cy}" r="5" fill="none" stroke="var(--paper-2)" stroke-width="2"/>`;
    marks += `<text class="fy-end-label" x="${cx}" y="${Math.max(cy-14, PAD_T+9)}" text-anchor="middle">${escapeHtml(fmt(p.v))}</text>`;
    return `<svg class="fy-chart" viewBox="0 0 ${W} ${H}">${marks}</svg>`;
  }

  const lineD = "M " + pts.map(p => `${xFor(p.i)} ${yFor(p.v)}`).join(" L ");
  const areaD = lineD + ` L ${xFor(pts[pts.length-1].i)} ${yFor(0)} L ${xFor(pts[0].i)} ${yFor(0)} Z`;
  marks += `<path d="${areaD}" fill="${color}" opacity="0.1" stroke="none"/>`;
  marks += `<path d="${lineD}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const last = pts[pts.length-1], lx = xFor(last.i), ly = yFor(last.v);
  marks += `<circle cx="${lx}" cy="${ly}" r="4" fill="${color}"/><circle cx="${lx}" cy="${ly}" r="4" fill="none" stroke="var(--paper-2)" stroke-width="2"/>`;
  marks += `<text class="fy-end-label" x="${lx-9}" y="${Math.max(ly-14, PAD_T+9)}" text-anchor="end">${escapeHtml(fmt(last.v))}</text>`;
  return `<svg class="fy-chart" viewBox="0 0 ${W} ${H}">${marks}</svg>`;
}
