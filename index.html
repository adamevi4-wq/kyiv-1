// Firestore rules require a real, non-anonymous auth token (see
// firestore.rules) — so unlike before, the browser gets no Firestore
// access at all until a real store/admin password has been checked. That
// check happens server-side, in functions/api/login.js (it reads the
// stored password hash via a Firebase service account, the same way
// telegram-bot/worker.js does — the browser itself never sees it). On
// success that endpoint returns a short-lived Firebase custom token; this
// just signs the browser in with it.
async function signInWithLoginToken(token){
  await signInWithCustomToken(fbAuth, token);
}

// Directory (id, name, store — no passwords) for the login screen's
// manager dropdown, fetched before any real login. Falls back to
// DEFAULT_USERS if the request fails, so the dropdown still renders (login
// itself still goes through /api/login either way). Relative paths —
// Cloudflare Pages Functions on this same origin (kyiv-1.pages.dev), the
// site's only deploy target (see README's "Хостинг" section — GitHub
// Pages was decommissioned 2026-09-19). Sitting on this origin means these
// two routes inherit the site-wide Basic Auth gate (functions/_middleware.js)
// like every other route here — a caller needs that shared password before
// they can even attempt a login, not just a real store/admin password.
async function fetchLoginDirectory(){
  try{
    const res = await fetch("/api/login-options");
    if(!res.ok) return DEFAULT_USERS.map(u => ({id:u.id, name:u.name, store:u.store}));
    return await res.json();
  }catch(e){ return DEFAULT_USERS.map(u => ({id:u.id, name:u.name, store:u.store})); }
}

// Verifies a password server-side and, on success, returns a Firebase
// custom token to sign in with; returns null on any failure (wrong
// password, unknown user, login endpoint unavailable) — callers show a
// single generic "Невірний пароль" either way, same as before.
async function loginWithCredentials(role, payload){
  try{
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role, ...payload }),
    });
    if(!res.ok) return null;
    const data = await res.json();
    return data.token || null;
  }catch(e){ return null; }
}

const FS_KEYS = { users: "users", zones: "zones", stores: "staffing-stores", vacancies: "vacancies", adminPassword: "admin-password", loginLog: "login-log", responsibilityLog: "responsibility-log", responsibilitySeenAt: "responsibility-seen-at", kpiReports: "kpi-reports", kpiBenchmarks: "kpi-benchmarks", kpiClearance: "kpi-clearance", kpiClickCollect: "kpi-click-collect", kpiTabComments: "kpi-tab-comments" };
const LOGIN_LOG_CAP = 3000; // keep the Firestore doc small — oldest entries drop off
const RESPONSIBILITY_LOG_CAP = 300; // far fewer assignment changes than logins, so a smaller cap is plenty
// GDPR storage-limitation (Art. 5(1)(e)): these logs name real people
// (login-log: who/when; responsibility-log: who assigned whom). The size
// caps above are a *safety valve*, not a retention policy — with ~11
// people logging in occasionally, 3000 entries could span years. Prune by
// age too, independent of the caps.
const LOG_RETENTION_MONTHS = 12;
function pruneLogByAge(log){
  const cutoff = Date.now() - LOG_RETENTION_MONTHS * 30 * 86400000;
  return log.filter(e => !e.at || new Date(e.at).getTime() >= cutoff);
}

async function fsGet(key) {
  try {
    const snap = await getDoc(doc(db, "kyiv1", key));
    return snap.exists() ? snap.data().value : undefined;
  } catch (e) { return undefined; }
}
async function fsSet(key, value) {
  try { await setDoc(doc(db, "kyiv1", key), { value }, { merge: true }); } catch (e) {}
}

// Per-item document collections (kyiv1_stores, kyiv1_vacancies, kyiv1_users
// — 2026-09-19, phase 4 of the security hardening, see firestore.rules):
// one real Firestore document per store/vacancy/manager, instead of the
// old kyiv1/{staffing-stores,vacancies,users} docs' single whole-district
// JSON blob — the only way firestore.rules can enforce "store X can't
// write store Y's data" itself, since rules can't see inside an opaque
// JSON string field. dataMigrated (set in loadAll) tracks whether the
// one-time copy from the old blobs has happened yet; until it has, reads
// and writes for these three fall back to the old blob docs unchanged —
// see loadAll, startPolling, persistStores/persistVacancies/persistUsers
// and migrateToPerItemDocs below.
let dataMigrated = false;
async function fsCollectionGet(collectionName) {
  try {
    const snap = await getDocs(collection(db, collectionName));
    const items = [];
    snap.forEach(d => items.push(d.data()));
    return items;
  } catch (e) { return []; }
}
// Same as fsCollectionGet, filtered to one equality match — the manager
// side of kyiv1_vacancies' 2026-09-20 per-store read scoping (see
// firestore.rules): an unfiltered collection query would be rejected
// outright for a manager token, since the rule depends on each
// document's own storeCode field, not something a "list everything"
// query can satisfy on its own.
async function fsQueryGet(collectionName, field, value) {
  try {
    const snap = await getDocs(query(collection(db, collectionName), where(field, "==", value)));
    const items = [];
    snap.forEach(d => items.push(d.data()));
    return items;
  } catch (e) { return []; }
}
async function fsDocSet(collectionName, id, value) {
  try { await setDoc(doc(db, collectionName, id), value); } catch (e) {}
}
async function fsDocDelete(collectionName, id) {
  try { await deleteDoc(doc(db, collectionName, id)); } catch (e) {}
}

}
async function tgSet(key, value) {
  try { await setDoc(doc(db, "telegram-bot", key), { value }, { merge: true }); } catch (e) {}
}

function getTheme(){
  try{ return localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light"; }catch(e){ return "light"; }
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
}
function setTheme(theme){
  applyTheme(theme);
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}

function onboardingTargetDays(planName){
  const m = planName.match(/\((\d+)\s*(тижн|дн)/i);
  if(!m) return null;
  const n = Number(m[1]);
  return m[2].toLowerCase() === "тижн" ? n * 7 : n;
}

function sourcingStatus(v){
  const cand = v.candidateCount, contacts = v.openContacts;
  if((cand === null || cand === undefined) && (contacts === null || contacts === undefined)){
    return {label:"Дані не введено", color:"var(--ink-soft)", border:"var(--line)", level:"none"};
  }
  const c = cand ?? 0, oc = contacts ?? 0;
  if(oc >= SOURCING_GOOD_CONTACTS) return {label:"Активно опрацьовується", color:"var(--green)", border:"var(--green-dim)", level:"good"};
  if(c <= SOURCING_ATTENTION_CANDIDATES && oc <= SOURCING_ATTENTION_CONTACTS) return {label:"Потребує уваги", color:"var(--red)", border:"var(--red-dim)", level:"attention"};
  return {label:"Помірна активність", color:"var(--amber)", border:"var(--amber-dim)", level:"moderate"};
}

function round2(n){ return Math.round(n*100)/100; }
// Ukrainian noun-count agreement (1 -> one, 2-4 -> few, 5+/11-14 -> many),
// e.g. pluralUA(3, "зона", "зони", "зон") === "зони" — used wherever a
// count badge is built from data whose length isn't always 5+.
function pluralUA(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return many;
  if(mod10 === 1) return one;
  if(mod10 >= 2 && mod10 <= 4) return few;
  return many;
}
// Local calendar date, not UTC — toISOString() reads UTC, so for a couple
// of hours after real local midnight (Ukraine is UTC+2/+3) it would still
// return yesterday's date, under-counting "днів відкрита" for open
// vacancies by a day during that window.
function todayISO(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function escapeHtml(str){ return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

// Password storage: a "salt:hex-sha256(salt:password)" string, not the raw
// password — so a Firestore dump (open by design, see firestore.rules)
// doesn't hand out real passwords people may reuse elsewhere. A stored
// value with no ":" is a legacy plaintext password (DEFAULT_USERS /
// ADMIN_DEFAULT_PASSWORD, or anything never re-saved since this shipped);
// verifyCredential() still accepts those directly so nothing breaks mid-
// migration, and the next password change for that account upgrades it.
async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}
function randomSaltHex(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function makeCredential(password){
  const salt = randomSaltHex();
  return `${salt}:${await sha256Hex(`${salt}:${password}`)}`;
}
async function verifyCredential(password, stored){
  if(typeof stored !== "string" || !stored) return false;
  const sep = stored.indexOf(":");
  if(sep === -1) return password === stored;
  const salt = stored.slice(0, sep), hash = stored.slice(sep + 1);
  return (await sha256Hex(`${salt}:${password}`)) === hash;
}
// Two-letter avatar initials for the topbar user chip. currentUser.name is
// either a bare admin label ("Адам · District Manager") or "Name — STORE"
// for a manager — take only the part before that separator so the store
// code never ends up contributing a letter.
function userInitials(name){
  const base = String(name ?? "").split(/[—·]/)[0].trim();
  const words = base.split(/\s+/).filter(Boolean);
  if(words.length >= 2) return (words[0][0] + words[1][0]).toUpperCase();
  if(words.length === 1) return words[0].slice(0,2).toUpperCase();
  return "?";
}

function staffingStatus(s){
  if(s.actualStakes===null||s.actualStakes===undefined) return "pending";
  const diff = round2(s.actualStakes - (s.baseStakes||0));
  if(s.actualHeadcount!==null && s.actualHeadcount!==undefined && s.baseHeadcount!==null && s.baseHeadcount!==undefined){
    const hcDiff = round2(s.actualHeadcount - s.baseHeadcount);
    if(hcDiff <= -2) return "peopleCritical";
    if(hcDiff <= -1) return "peopleWarning";
  }
  if(diff < -0.01) return "deficit";
  if(diff >= 1) return "surplus"; // a few hundredths over norm isn't a real surplus — only a full stake or more counts
  return "ok";
}
// Signed % distance from 100% of stakes norm — a deficit ("скільки не
// вистачає до норми") mirrors the headcount-deficit wording used in
// "Потребує уваги"; a surplus only counts once it's at least a full stake
// over norm (matches staffingStatus's own surplus threshold above) —
// anything smaller reads as "у нормі", not a spurious green surplus badge
// on a few hundredths of overage.
function stakesGap(actual, base){
  if(actual == null || !base) return null;
  const diff = round2(actual - base);
  if(diff < -0.01) return { kind: "deficit", pct: round2(-diff / base * 100) };
  if(diff >= 1) return { kind: "surplus", pct: round2(diff / base * 100) };
  return { kind: "ok", pct: 0 };
}
// Same signed gap, compact (-23.08% / +2.5% / 0%) for space-constrained
// spots like a ranked bar row's trailing column, where the full "X% не
// вистачає" wording wouldn't fit.
function stakesGapCompact(actual, base){
  const gap = stakesGap(actual, base);
  if(!gap) return "—";
  if(gap.kind === "deficit") return `-${gap.pct}%`;
  if(gap.kind === "surplus") return `+${gap.pct}%`;
  return "0%";
}
function vacancyInfo(v){
  const status = v.hireStatus || "open";
  let daysOpen=null, overdue=false, timeToFill=null;
  if(status==="open"){ daysOpen = daysBetween(v.openedDate, todayISO()); overdue = daysOpen!==null && daysOpen>OVERDUE_DAYS; }
  else if(status==="filled" && v.hiredDate){ timeToFill = daysBetween(v.openedDate, v.hiredDate); }
  return {status, daysOpen, overdue, timeToFill};
}
// Open-vacancy counts per store, shared by the district cards grid and the
// "Потребує уваги" combined-signal list below.
function computeVacancyStoreStats(){
  const openByStore = {}, oldestByStore = {};
  vacancies.forEach(v => {
    const info = vacancyInfo(v);
    if(info.status === "open"){
      openByStore[v.storeCode] = (openByStore[v.storeCode]||0)+1;
      if(!(v.storeCode in oldestByStore) || info.daysOpen > oldestByStore[v.storeCode]) oldestByStore[v.storeCode] = info.daysOpen;
    }
  });
  return {openByStore, oldestByStore};
}
// A conic-gradient "ring" gauge — the circular score cards from the JYSK
// Customer Voice reference dashboard, generalized to any 0-100 percentage
// this app already tracks (no fabricated metric — pct/label/valueText/sub
// all come from real data at the call site).
function gaugeHtml(pct, color, label, valueText, sub){
  const clamped = Math.max(0, Math.min(100, pct));
  return `
    <div class="gauge-card">
      <div class="gauge-ring" style="background:conic-gradient(${color} ${round2(clamped*3.6)}deg, var(--surface-soft) 0deg)">
        <div class="gauge-value" style="color:${color}">${Math.round(pct)}%</div>
      </div>
      <div class="gauge-info">
        <div class="lbl">${escapeHtml(label)}</div>
        <div class="val">${valueText}</div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}
      </div>
    </div>
  `;
}

// ================= PERSISTENCE (shared = district-wide, Firestore) =================

function sortStoresByCode(){ stores.sort((a,b) => a.code.localeCompare(b.code)); }

// One-time read-compatibility shim: stores used to keep a single overwritable
// comment string (`s.comment`). Comments are now a timestamped/attributed
// thread — same shape as `zones[i].comments` — so any real leftover string
// value becomes the first entry of `s.comments` instead of being silently
// discarded; we don't know who wrote it or when, so it's attributed
// generically. Idempotent — once `s.comments` is an array this is a no-op.
function normalizeStoreComments(s){
  if(!Array.isArray(s.comments)){
    s.comments = (s.comment && s.comment.trim())
      ? [{ text: s.comment.trim(), who: "Попередній коментар", when: "" }]
      : [];
    delete s.comment; // retired field — fully replaced by s.comments going forward
  }
  return s.comments;
}
function normalizeAllStoreComments(){ stores.forEach(normalizeStoreComments); }

// Same upgrade as normalizeStoreComments, for vacancies: `v.comments` used to
// be a single free-text string (see the "Коментар:" field on the expanded
// vacancy row) with no author/date. Any real leftover string becomes the
// first entry of the new attributed thread instead of being discarded.
function normalizeVacancyComments(v){
  if(!Array.isArray(v.comments)){
    const old = typeof v.comments === "string" ? v.comments.trim() : "";
    v.comments = old ? [{ text: old, who: "Попередній коментар", when: "" }] : [];
  }
  return v.comments;
}
function normalizeAllVacancyComments(){ vacancies.forEach(normalizeVacancyComments); }

// Stores are a fixed set of exactly the district's 10 — never added or
// removed through the UI — so kyiv1_stores being non-empty is an
// unambiguous "the one-time per-item migration has already happened"
// signal (unlike vacancies, which can legitimately be empty). Every other
// migrated read/write in this file trusts dataMigrated rather than
// re-checking emptiness itself.
// All the reads below are independent of each other (different keys/
// collections, nothing here depends on another's result except
// stores/vacancies/users' fallback branch on dataMigrated and the
// post-login migration) — fetched concurrently via Promise.all instead of
// one-by-one, since sequential awaiting each of ~13 separate Firestore
// round trips was the main reason login felt slow.
async function loadAll(){
  // kyiv1/admin-password is admin-only in firestore.rules (2026-09-19 —
  // any signed-in manager could otherwise read/overwrite the District
  // Manager's password hash directly, bypassing /api/admin-reset's email
  // confirmation entirely). A manager's own read would just get denied —
  // skip it for them; adminPassword stays at its ADMIN_DEFAULT_PASSWORD
  // default, which nothing in a manager's own UI ever reads.
  //
  // kyiv1_stores reads are scoped per-store too now (2026-09-20) — a
  // manager's token can only reach their OWN store's doc, so an unfiltered
  // fsCollectionGet would just come back permission-denied (caught,
  // returning [], which would wrongly read as "not migrated yet" forever).
  // Fetch just their own doc instead, same idea as kyiv1_users below.
  const sItemsPromise = currentUser.isAdmin
    ? fsCollectionGet("kyiv1_stores")
    : (async () => {
        try{ const snap = await getDoc(doc(db, "kyiv1_stores", currentUser.store)); return snap.exists() ? [snap.data()] : []; }
        catch(e){ return []; }
      })();
  // District-wide numbers for this tab's top summary — a manager's own
  // Firestore token genuinely can't compute this anymore (see above), so
  // it comes from functions/api/district-summary.js's service-account-
  // backed, numbers-only read instead. Admin's own `stores` below is
  // already the full, live district collection — no separate fetch or
  // separate variable needed there, see renderDistrictTab's topSummaryStores.
  const districtSummaryPromise = currentUser.isAdmin
    ? Promise.resolve([])
    : fetch("/api/district-summary").then(r => r.ok ? r.json() : []).catch(() => []);
  // kyiv1_equipment read is open to any signed-in user regardless of role
  // (see firestore.rules) — no admin/manager branching needed here, unlike
  // kyiv1_stores above.
  const equipmentPromise = fsCollectionGet("kyiv1_equipment");
  const [sItems, dsItems, eqItems, zRaw, llRaw, rlRaw, rsRaw, apRaw, krRaw, kbRaw, kcRaw, kccRaw, ktcRaw] = await Promise.all([
    sItemsPromise,
    districtSummaryPromise,
    equipmentPromise,
    fsGet(FS_KEYS.zones),
    fsGet(FS_KEYS.loginLog),
    fsGet(FS_KEYS.responsibilityLog),
    fsGet(FS_KEYS.responsibilitySeenAt),
    currentUser.isAdmin ? fsGet(FS_KEYS.adminPassword) : Promise.resolve(undefined),
    fsGet(FS_KEYS.kpiReports),
    fsGet(FS_KEYS.kpiBenchmarks),
    fsGet(FS_KEYS.kpiClearance),
    fsGet(FS_KEYS.kpiClickCollect),
    fsGet(FS_KEYS.kpiTabComments),
  ]);
  dataMigrated = sItems.length > 0;
  districtStores = dsItems;
  equipment = eqItems;
  zones = zRaw ? JSON.parse(zRaw) : DEFAULT_ZONES;
  loginLog = llRaw ? JSON.parse(llRaw) : [];
  responsibilityLog = rlRaw ? JSON.parse(rlRaw) : [];
  responsibilitySeenAt = rsRaw || null;
  if(currentUser.isAdmin) adminPassword = apRaw || ADMIN_DEFAULT_PASSWORD;
  kpiReports = krRaw ? JSON.parse(krRaw) : [];
  kpiBenchmarks = kbRaw ? JSON.parse(kbRaw) : [];
  kpiClearance = kcRaw ? JSON.parse(kcRaw) : [];
  kpiClickCollect = kccRaw ? JSON.parse(kccRaw) : [];
  kpiTabComments = ktcRaw ? JSON.parse(ktcRaw) : {};

  if(dataMigrated){
    stores = sItems;
    const [vItems, uItems] = await Promise.all([
      currentUser.isAdmin
        ? fsCollectionGet("kyiv1_vacancies")
        : fsQueryGet("kyiv1_vacancies", "storeCode", currentUser.store),
      currentUser.isAdmin
        ? fsCollectionGet("kyiv1_users")
        : (async () => {
            try{ const snap = await getDoc(doc(db, "kyiv1_users", currentUser.id)); return snap.exists() ? [snap.data()] : []; }
            catch(e){ return []; }
          })(),
    ]);
    vacancies = vItems;
    users = uItems;
  } else {
    const [sRaw, vRaw, uRaw] = await Promise.all([fsGet(FS_KEYS.stores), fsGet(FS_KEYS.vacancies), fsGet(FS_KEYS.users)]);
    stores = sRaw ? JSON.parse(sRaw) : DEFAULT_STORES;
    vacancies = vRaw ? JSON.parse(vRaw) : [];
    users = uRaw ? JSON.parse(uRaw) : DEFAULT_USERS;
  }
  sortStoresByCode();
  normalizeAllStoreComments();
  normalizeAllVacancyComments();
  if(currentUser.isAdmin && !dataMigrated) await migrateToPerItemDocs();
}

// One-time backfill: copies the old whole-district blob docs into the new
// per-item collections (see the comment above fsCollectionGet). Only admin
// tokens can write every store/vacancy/user doc (firestore.rules scopes a
// manager token to their own), so this only runs on an admin login, and
// only while dataMigrated is still false. Best-effort — stores/vacancies/
// users are already loaded (from the old blobs) by the time this runs, so
// a failure here just means the app keeps using the old blob docs until
// the next admin login retries; nothing the user sees depends on it
// succeeding immediately.
async function migrateToPerItemDocs(){
  try{
    await Promise.all([
      ...stores.map(s => fsDocSet("kyiv1_stores", s.code, s)),
      ...vacancies.map(v => fsDocSet("kyiv1_vacancies", v.id, v)),
      ...users.map(u => fsDocSet("kyiv1_users", u.id, u)),
    ]);
    dataMigrated = true;
  }catch(e){ /* retried on the next admin login */ }
}

const saveTimers = {}; // one debounce timer per persisted key, not shared — see debSave
function debSave(key, fn){ clearTimeout(saveTimers[key]); saveTimers[key] = setTimeout(fn, 250); }
function persistStores(code){
  if(dataMigrated){
    const s = stores.find(x => x.code === code);
    if(s) debSave("store:"+code, () => fsDocSet("kyiv1_stores", code, s));
  } else {
    debSave("stores-blob", () => fsSet(FS_KEYS.stores, JSON.stringify(stores)));
  }
}
function persistVacancies(id){
  if(dataMigrated){
    const v = vacancies.find(x => x.id === id);
    if(v) debSave("vacancy:"+id, () => fsDocSet("kyiv1_vacancies", id, v));
    else debSave("vacancy:"+id, () => fsDocDelete("kyiv1_vacancies", id));
  } else {
    debSave("vacancies-blob", () => fsSet(FS_KEYS.vacancies, JSON.stringify(vacancies)));
  }
}
async function persistZones(){ await fsSet(FS_KEYS.zones, JSON.stringify(zones)); }
function persistUsers(id){
  if(dataMigrated){
    const u = users.find(x => x.id === id);
    if(u) debSave("user:"+id, () => fsDocSet("kyiv1_users", id, u));
    else debSave("user:"+id, () => fsDocDelete("kyiv1_users", id));
  } else {
    debSave("users-blob", () => fsSet(FS_KEYS.users, JSON.stringify(users)));
  }
}
async function persistAdminPassword(){ await fsSet(FS_KEYS.adminPassword, adminPassword); }
async function persistKpiTabComments(){ await fsSet(FS_KEYS.kpiTabComments, JSON.stringify(kpiTabComments)); }

// Records one login event to the shared, district-wide log used by the
// "Активність" tab. Re-reads the doc first (instead of trusting local
// `loginLog`) so two people logging in around the same moment are less
// likely to clobber each other's entry.
async function logLoginEvent(user){
  try{
    const raw = await fsGet(FS_KEYS.loginLog);
    let log = raw ? JSON.parse(raw) : [];
    log.push({
      userId: user.id,
      name: user.isAdmin ? "District Manager" : user.name,
      store: user.isAdmin ? null : user.store,
      isAdmin: !!user.isAdmin,
      at: new Date().toISOString(),
    });
    log = pruneLogByAge(log);
    if(log.length > LOGIN_LOG_CAP) log = log.slice(log.length - LOGIN_LOG_CAP);
    loginLog = log;
    await fsSet(FS_KEYS.loginLog, JSON.stringify(log));
  }catch(e){ /* best-effort — never block login on this */ }
}

// Records a change to a zone's assigned responsible person(s), so the
// District Manager gets a notification bell in the topbar instead of
// having to notice the change by re-checking every card. Same
// re-read-before-write pattern as logLoginEvent, for the same reason.
async function logResponsibilityChange(zone, oldList, newList){
  try{
    const raw = await fsGet(FS_KEYS.responsibilityLog);
    let log = raw ? JSON.parse(raw) : [];
    log.push({
      zoneId: zone.id,
      zoneTitle: zone.title,
      oldResponsibles: oldList,
      newResponsibles: newList,
      changedBy: currentUser.name,
      at: new Date().toISOString(),
    });
    log = pruneLogByAge(log);
    if(log.length > RESPONSIBILITY_LOG_CAP) log = log.slice(log.length - RESPONSIBILITY_LOG_CAP);
    responsibilityLog = log;
    await fsSet(FS_KEYS.responsibilityLog, JSON.stringify(log));
  }catch(e){ /* best-effort — never block the assignment on this */ }
}
// Unseen = changed by someone other than the viewer, since the viewer's own
// edits don't need to notify them, after the last time they opened the bell.
function unseenResponsibilityChanges(){
  if(!currentUser || !currentUser.isAdmin) return [];
  const seenAt = responsibilitySeenAt ? new Date(responsibilitySeenAt) : new Date(0);
  return responsibilityLog.filter(e => e.changedBy !== currentUser.name && new Date(e.at) > seenAt);
}
async function markResponsibilityNotificationsSeen(){
  responsibilitySeenAt = new Date().toISOString();
  await fsSet(FS_KEYS.responsibilitySeenAt, responsibilitySeenAt);
}

  if(adminBtn) adminBtn.addEventListener("click", () => { adminPanelOpen = true; openAdminPanelModal(); });
  const exportBtn = document.getElementById("export-pptx-btn");
  if(exportBtn) exportBtn.addEventListener("click", () => { exportActiveTabPptx(); });
  const notifBtn = document.getElementById("notif-btn");
  if(notifBtn) notifBtn.addEventListener("click", () => openNotifModal());

  if(activeTab === "personnel") renderPersonnelTab();
  else if(activeTab === "kpi") renderKpiTab();
  else if(activeTab === "expenses") renderExpensesTab();
  else if(activeTab === "promo") renderPromoTab();
  else if(activeTab === "activity") renderActivityTab();
  else if(activeTab === "telegram") renderTelegramTab();
  else renderZonesTab();
}

// ================= TAB 1: STORES =================

function renderDistrictTab(containerId = "personnel-subtab-content"){
  const wrap = document.getElementById(containerId);
  // Since firestore.rules scoped kyiv1_stores reads per-store (2026-09-20),
  // a manager's own `stores` only ever holds their own store — accurate
  // for everything below, but not for this tab's district-wide top
  // summary. Admin's `stores` is still the full, live collection, so it
  // stays the source there too (no separate fetch); a manager's top
  // summary instead reads `districtStores` — a numbers-only snapshot from
  // functions/api/district-summary.js's service-account-backed read,
  // fetched once at login (see loadAll) since it can't listen live the
  // way onSnapshot does. Per-store sections further down intentionally
  // keep using `stores`/`scopedStores` (their own store only), never this.
  const topSummaryStores = currentUser.isAdmin ? stores : districtStores;
  const withActual = topSummaryStores.filter(s => s.actualStakes!=null);
  const baseSum = round2(topSummaryStores.reduce((s,x)=>s+(x.baseStakes||0),0));
  const actualSum = round2(withActual.reduce((s,x)=>s+(x.actualStakes||0),0));
  const gap = withActual.length ? round2(actualSum - withActual.reduce((s,x)=>s+(x.baseStakes||0),0)) : null;
  const deficitCount = topSummaryStores.filter(s => ["deficit","peopleWarning","peopleCritical"].includes(staffingStatus(s))).length;
  const withHc = topSummaryStores.filter(s => s.actualHeadcount!=null);
  const totalHc = withHc.reduce((s,x)=>s+x.actualHeadcount,0);
  const disabilityCount = topSummaryStores.filter(s => s.hasDisabilityEmployee===true).length;
  const cpdTotal = topSummaryStores.reduce((s,x)=>s+(x.cpdCount||0),0);

  const {openByStore} = computeVacancyStoreStats();

  // A manager only edits their own store already (canEdit below), and as
  // of 2026-09-20 can no longer even *read* other stores' numbers, rank or
  // comments here either (firestore.rules scopes kyiv1_stores/kyiv1_vacancies
  // reads per-store now, closing the gap where the earlier UI-only
  // narrowing here still left the raw data reachable via devtools).
  // `scopedStores` is just their own store for a manager (in practice
  // `stores` itself already is, post-restriction — this filter is now
  // belt-and-suspenders) and every store, unchanged, for admin.
  const scopedStores = currentUser.isAdmin ? stores : stores.filter(s => s.code === currentUser.store);

  const ranked = scopedStores
    .filter(s => s.actualStakes != null && s.baseStakes)
    .map(s => ({ s, pct: round2(s.actualStakes / s.baseStakes * 100) }))
    .sort((a,b) => b.pct - a.pct);
  const maxRankPct = ranked.length ? Math.max(...ranked.map(r => r.pct), 100) : 100;
  const top5Best = ranked.slice(0, 5);
  const top5Worst = ranked.slice(-5).reverse();
  const commented = scopedStores.filter(s => normalizeStoreComments(s).length > 0);

  // Overall district-fulfillment gauge — actual/norm stakes across stores
  // that actually have data entered (same base as the ranked list's own %).
  const baseSumWithActual = round2(withActual.reduce((s,x)=>s+(x.baseStakes||0),0));
  const overallPct = baseSumWithActual > 0 ? round2(actualSum / baseSumWithActual * 100) : null;
  const overallColor = overallPct==null ? "var(--ink-soft)" : overallPct<95 ? "var(--red)" : overallPct>105 ? "var(--green)" : "var(--navy)";

  // Status distribution — what share of stores sit in each STATUS_META bucket
  // (the JYSK reference's "розподіл оцінок" bar, applied to укомплектованість
  // instead of a customer rating we don't track).
  const statusCounts = {};
  topSummaryStores.forEach(s => { statusCounts[staffingStatus(s)] = (statusCounts[staffingStatus(s)]||0)+1; });
  const STATUS_ORDER = ["peopleCritical","peopleWarning","deficit","pending","ok","surplus"];
  const distRows = STATUS_ORDER.filter(st => statusCounts[st]).map(st => ({ count: statusCounts[st], meta: STATUS_META[st] }));

  // "Потребує уваги" — combines three signals this app already tracks
  // separately (staffing status, open vacancies, manager login silence)
  // into one ranked list, like the reference dashboard's multi-source
  // attention panel below its score cards. Worst staffing first, ties
  // broken by open vacancies then login silence.
  const managerByStore = {};
  users.forEach(u => { if(u.store) managerByStore[u.store] = u; });
  const rankByCode = {};
  ranked.forEach(r => { rankByCode[r.s.code] = r.pct; });
  const needsAttention = scopedStores.map(s => {
    const st = staffingStatus(s);
    const staffingBad = ["peopleCritical","peopleWarning","deficit"].includes(st);
    const openVac = openByStore[s.code] || 0;
    const mgr = managerByStore[s.code];
    let loginBadge = null;
    if(mgr){
      const events = loginLog.filter(e => e.userId === mgr.id).sort((a,b) => new Date(b.at) - new Date(a.at));
      const last = events[0];
      if(!last) loginBadge = { text: "не заходив(ла)", bad: true };
      else {
        const da = daysAgo(last.at);
        loginBadge = da > 7 ? { text: `вхід ${da} дн. тому`, bad: true } : { text: da===0 ? "вхід сьогодні" : `вхід ${da} дн. тому`, bad: false };
      }
    }
    // The staffing badge shows a percentage, but for a headcount-driven
    // status (peopleCritical/peopleWarning) the stakes ratio (rankByCode)
    // can read as fine — even over 100% — while headcount is still short
    // (part-time coverage filling the stakes gap); showing that number next
    // to "Критична нестача"/"Не вистачає людей" reads as contradictory.
    // Show how many % of the norm headcount is missing instead, for those
    // two statuses specifically — everything else keeps the stakes ratio.
    let staffingPctLabel = null;
    if((st === "peopleCritical" || st === "peopleWarning") && s.baseHeadcount){
      const deficitPct = round2((s.baseHeadcount - s.actualHeadcount) / s.baseHeadcount * 100);
      staffingPctLabel = `${deficitPct}% не вистачає`;
    } else {
      const gap = stakesGap(s.actualStakes, s.baseStakes);
      if(gap) staffingPctLabel = gap.kind === "deficit" ? `${gap.pct}% не вистачає` : gap.kind === "surplus" ? `+${gap.pct}% надлишок` : "у нормі";
    }
    const flagged = staffingBad || openVac > 0 || (loginBadge && loginBadge.bad);
    return { s, pct: rankByCode[s.code] ?? null, staffingPctLabel, meta: STATUS_META[st], staffingBad, openVac, loginBadge, flagged };
  }).filter(x => x.flagged)
    .sort((a,b) => {
      const score = (x) => (x.staffingBad?2:0) + (x.openVac>0?1:0) + (x.loginBadge && x.loginBadge.bad?1:0);
      return score(b) - score(a) || (a.pct ?? 999) - (b.pct ?? 999);
    });

  // Section numbers shift for a manager (no ranking section — comparing
  // one store to itself is meaningless) — computed once instead of
  // hardcoded so "3"/"4" never skip a number when ranking is hidden.
  const scopedDeficitCount = scopedStores.filter(s => ["deficit","peopleWarning","peopleCritical"].includes(staffingStatus(s))).length;
  const showRanking = currentUser.isAdmin && ranked.length > 0;
  let catIdx = 0;
  const idxAttention = ++catIdx;
  const idxStores = ++catIdx;
  const idxRanking = showRanking ? ++catIdx : null;
  const idxComments = commented.length ? ++catIdx : null;

  wrap.innerHTML = `
    ${heroBannerHtml("Магазини та ставки — стан укомплектованості дістрикту")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">НОРМА, СТАВОК</div><div class="val">${baseSum}</div></div>
      <div class="stat-card"><div class="lbl">ФАКТ ВВЕДЕНО ПО</div><div class="val">${withActual.length}<span class="unit">/ ${topSummaryStores.length}</span></div></div>
      <div class="stat-card"><div class="lbl">ГАП, СТАВОК</div><div class="val" style="${gap!=null?`color:${gap<0?'var(--red)':gap>0?'var(--green)':''}`:''}">${gap==null?"—":(gap>0?`+${gap}`:gap)}</div></div>
      <div class="stat-card"><div class="lbl">МАГАЗИНІВ З ДЕФІЦИТОМ</div><div class="val" style="${deficitCount>0?'color:var(--red)':''}">${deficitCount}</div></div>
      <div class="stat-card"><div class="lbl">ВСЬОГО ПРАЦІВНИКІВ</div><div class="val">${withHc.length?totalHc:"—"}</div></div>
      <div class="stat-card"><div class="lbl">З ІНВАЛІДНІСТЮ, МАГАЗИНІВ</div><div class="val">${disabilityCount}</div></div>
      <div class="stat-card"><div class="lbl">ЦПХ, ОСІБ</div><div class="val">${cpdTotal}</div></div>
    </section>

    <section class="overview-row">
      ${overallPct!=null
        ? gaugeHtml(overallPct, overallColor, "Укомплектованість дістрикту", `${actualSum} / ${baseSumWithActual} ставок`, `дані введено по ${withActual.length}/${topSummaryStores.length} магазинах`)
        : `<div class="tg-card gauge-card" style="margin-bottom:0;"><div class="gauge-info"><div class="lbl">Укомплектованість дістрикту</div><div class="val">—</div><div class="sub">ще немає введених фактичних даних</div></div></div>`}
      <div class="tg-card" style="margin-bottom:0;">
        <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл магазинів за статусом</div>
        ${distRows.map(({count, meta}) => `
          <div class="dist-bar-row">
            <div class="dist-bar-name">${escapeHtml(meta.label)}</div>
            <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(count/topSummaryStores.length*100)}%;background:${meta.color};"></div></div>
            <div class="dist-bar-count">${count} · ${Math.round(count/topSummaryStores.length*100)}%</div>
          </div>
        `).join("")}
      </div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">${idxAttention}</div><h2>Потребує уваги</h2>
        <div class="count ${needsAttention.length===0?'done':''}">${needsAttention.length===0?"без зауважень":`${needsAttention.length} ${pluralUA(needsAttention.length, "магазин", "магазини", "магазинів")}`}</div>
      </div>
      ${needsAttention.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Магазини з дефіцитом ставок, відкритими вакансіями або керуючим, який давно не заходив на сайт.</div>
        <div class="attn-list">
        ${needsAttention.map(x => `
          <div class="attn-row" style="--card-color:${x.meta.color};">
            <div class="attn-name">${escapeHtml(x.s.code)}${x.s.name ? ` · ${escapeHtml(x.s.name)}` : ""}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:${x.meta.color};border-color:${x.meta.color};background:#fff;">${escapeHtml(x.meta.label)}${x.staffingPctLabel ? ` · ${x.staffingPctLabel}` : ""}</span>
              <span class="attn-badge ${x.openVac>0 ? "bad" : ""}">${x.openVac>0 ? `вакансій: ${x.openVac}` : "вакансій немає"}</span>
              ${x.loginBadge ? `<span class="attn-badge ${x.loginBadge.bad ? "bad" : "good"}">${escapeHtml(x.loginBadge.text)}</span>` : ""}
            </div>
          </div>
        `).join("")}
        </div>
      ` : `<div class="empty-state">Наразі жоден магазин не потребує уваги.</div>`}
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">${idxStores}</div><h2>${currentUser.isAdmin ? "Магазини дістрикту" : "Мій магазин"}</h2>
        <div class="count" id="district-grid-count">${scopedDeficitCount===0?"без дефіциту":`${scopedDeficitCount} з дефіцитом`}</div>
      </div>
      ${currentUser.isAdmin ? `<input class="text-field store-search" id="store-search" placeholder="Пошук магазину за кодом або назвою…" value="${escapeHtml(storeSearchQuery)}">` : ""}
      <div class="cards-grid" id="cards-grid"></div>
    </section>
    ${showRanking ? `
    <section class="category">
      <div class="category-head">
        <div class="cat-index">${idxRanking}</div><h2>Рейтинг укомплектованості</h2>
        <div class="count done">${ranked.length} магазинів</div>
      </div>
      <div class="tg-desc" style="margin-bottom:14px;">Факт до норми (ставки) — від найвищого показника до найнижчого.</div>
      ${ranked.map(({s,pct}) => `
        <div class="tg-bar-row">
          <div class="tg-bar-name">${escapeHtml(s.code)}${s.name ? ` · ${escapeHtml(s.name)}` : ""}</div>
          <div class="tg-bar-track"><div class="tg-bar-fill" style="width:${Math.min(100, Math.round(pct/maxRankPct*100))}%;background:${pct<95?'var(--red)':pct>105?'var(--green)':'var(--navy)'};"></div></div>
          <div class="tg-bar-count">${stakesGapCompact(s.actualStakes, s.baseStakes)}</div>
        </div>
      `).join("")}
      ${ranked.length >= 4 ? `
      <div class="top5-grid" style="margin-top:18px;">
        <div>
          <div class="top5-head best">ТОП-5 НАЙКРАЩИХ</div>
          ${top5Best.map(({s}) => `<div class="top5-row"><span class="name">${escapeHtml(s.code)}<span class="code">${escapeHtml(s.name||"")}</span></span><span class="pct">${stakesGapCompact(s.actualStakes, s.baseStakes)}</span></div>`).join("")}
        </div>
        <div>
          <div class="top5-head worst">ТОП-5 · ПОТРЕБУЮТЬ УВАГИ</div>
          ${top5Worst.map(({s}) => `<div class="top5-row"><span class="name">${escapeHtml(s.code)}<span class="code">${escapeHtml(s.name||"")}</span></span><span class="pct">${stakesGapCompact(s.actualStakes, s.baseStakes)}</span></div>`).join("")}
        </div>
      </div>` : ""}
    </section>` : ""}
    ${commented.length ? `
    <section class="category">
      <div class="category-head">
        <div class="cat-index">${idxComments}</div><h2>Коментарі магазинів</h2>
        <div class="count done">${commented.length}</div>
      </div>
      <button class="reviews-toggle-btn" id="store-comments-toggle">${storeCommentsPanelOpen ? "Приховати коментарі" : "Показати коментарі"}</button>
      ${storeCommentsPanelOpen ? commented.map(s => {
        const list = normalizeStoreComments(s);
        const last = list[list.length - 1];
        return `
        <div class="review-card">
          <div class="who">${escapeHtml(s.name||s.code)}<span class="code">${escapeHtml(s.code)}</span>${list.length>1?`<span class="count">${list.length}</span>`:""}</div>
          <div class="txt">${escapeHtml(last.text)}</div>
          ${last.who || last.when ? `<div class="meta">${escapeHtml(last.who||"")}${last.who&&last.when?" · ":""}${escapeHtml(last.when||"")}</div>` : ""}
        </div>
      `;
      }).join("") : ""}
    </section>` : ""}
  `;
  renderDistrictStoreGrid();
  const searchInput = document.getElementById("store-search");
  if(searchInput) searchInput.addEventListener("input", () => { storeSearchQuery = searchInput.value; renderDistrictStoreGrid(); });
  const commentsToggle = document.getElementById("store-comments-toggle");
  if(commentsToggle) commentsToggle.addEventListener("click", () => { storeCommentsPanelOpen = !storeCommentsPanelOpen; renderDistrictTab(containerId); });
}
// Re-renders just the cards grid (and its count badge) for the live
// store-search box, without touching the rest of the tab — a full
// renderDistrictTab() on every keystroke would replace the <input> itself
// and drop focus/cursor position mid-typing.
function renderDistrictStoreGrid(){
  const grid = document.getElementById("cards-grid");
  if(!grid) return;
  const {openByStore, oldestByStore} = computeVacancyStoreStats();
  // Same scoping as renderDistrictTab() above: a manager only ever sees
  // their own store's card here, admin sees every store (and can search).
  const scopedStores = currentUser.isAdmin ? stores : stores.filter(s => s.code === currentUser.store);
  const q = storeSearchQuery.trim().toLowerCase();
  const filtered = scopedStores
    .map(s => ({ s, idx: stores.indexOf(s) }))
    .filter(({s}) => !q || (s.code + " " + (s.name||"")).toLowerCase().includes(q));
  grid.innerHTML = filtered.length
    ? filtered.map(({s, idx}) => storeCardHtml(s, idx, openByStore[s.code]||0, oldestByStore[s.code])).join("")
    : `<div class="empty-state">Не знайдено жодного магазину за запитом «${escapeHtml(storeSearchQuery)}».</div>`;
  wireStoreCardEvents();
  const countEl = document.getElementById("district-grid-count");
  if(countEl){
    if(q) countEl.textContent = `${filtered.length} / ${scopedStores.length} показано`;
    else {
      const deficitCount = scopedStores.filter(s => ["deficit","peopleWarning","peopleCritical"].includes(staffingStatus(s))).length;
      countEl.textContent = deficitCount===0 ? "без дефіциту" : `${deficitCount} з дефіцитом`;
    }
  }
}

function storeCardHtml(s, idx, openVacCount, oldestOpenDays){
  const status = staffingStatus(s);
  const meta = STATUS_META[status];
  const gapStakes = s.actualStakes==null ? null : round2(s.actualStakes - (s.baseStakes||0));
  const gapHc = s.actualHeadcount==null ? null : round2(s.actualHeadcount - (s.baseHeadcount||0));
  const pct = (gapStakes===null || !s.baseStakes) ? null : round2(gapStakes / s.baseStakes * 100);
  const partTimePct = (s.partTimeCount==null || !s.actualHeadcount) ? null : round2(s.partTimeCount / s.actualHeadcount * 100);
  const commentCount = normalizeStoreComments(s).length;
  const overdueVac = openVacCount > 0 && oldestOpenDays > OVERDUE_DAYS;
  const canEdit = currentUser.isAdmin || s.code === currentUser.store;
  const ro = canEdit ? "" : "disabled";

  return `
    <div class="card" data-idx="${idx}" style="--card-color:${meta.color}">
      <div class="card-top">
        <div>
          <div class="code">${escapeHtml(s.code)}</div>
          ${s.name ? `<div class="sm-name" style="color:var(--ink-2);font-weight:600;">${escapeHtml(s.name)}</div>` : ""}
          ${!canEdit ? `<div class="meta">🔒 лише перегляд</div>` : ""}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="status-pill">${meta.label}</span>
          <button class="comments-btn" data-action="open-comments">Коментарі${commentCount ? `<span class="count">${commentCount}</span>` : ""}</button>
        </div>
      </div>
      <table class="data-table">
        <thead><tr><th></th><th>Ставок</th><th>Людей</th></tr></thead>
        <tbody>
          <tr><td class="rlabel">Норма (базово)</td>
            <td><input class="num-field" data-field="baseStakes" placeholder="—" value="${s.baseStakes ?? ""}" ${ro} /></td>
            <td><input class="num-field" data-field="baseHeadcount" placeholder="—" value="${s.baseHeadcount ?? ""}" ${ro} /></td>
          </tr>
          <tr><td class="rlabel">Норма (сезон)</td>
            <td><input class="num-field" data-field="seasonStakes" placeholder="—" value="${s.seasonStakes ?? ""}" ${ro} /></td>
            <td><input class="num-field" data-field="seasonHeadcount" placeholder="—" value="${s.seasonHeadcount ?? ""}" ${ro} /></td>
          </tr>
          <tr><td class="rlabel emph">Фактично</td>
            <td><input class="num-field" data-field="actualStakes" placeholder="—" value="${s.actualStakes ?? ""}" ${ro} /></td>
            <td><input class="num-field" data-field="actualHeadcount" placeholder="—" value="${s.actualHeadcount ?? ""}" ${ro} /></td>
          </tr>
          <tr><td class="rlabel">Різниця</td>
            <td style="${gapStakes==null?'':`color:${gapStakes<0?'var(--red)':gapStakes>0?'var(--green)':''}`}">${gapStakes==null?"—":(gapStakes>0?`+${gapStakes}`:gapStakes)}</td>
            <td style="${gapHc==null?'':`color:${gapHc<0?'var(--red)':gapHc>0?'var(--green)':''}`}">${gapHc==null?"—":(gapHc>0?`+${gapHc}`:gapHc)}</td>
          </tr>
        </tbody>
      </table>
      ${pct!==null ? `
      <div class="progress-block">
        <div class="progress-head"><span class="lbl">ВІД НОРМИ</span><span class="val">${pct>0?"+":""}${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(Math.abs(pct),100)}%;background:${pct<0?'var(--red)':'var(--green)'};${pct<0?'margin-left:auto;':''}"></div></div>
      </div>` : ""}
      <div class="resp-row">
        <div class="hr-line"><span class="hl">Відкриті вакансії</span><span class="vac-count ${overdueVac?'overdue':''}"><b>${openVacCount}</b>${openVacCount>0?` (${oldestOpenDays} дн.)`:""}</span></div>
        <div class="hr-line"><span class="hl">ЦПХ (к-сть)</span><input class="num-field" style="width:56px;" data-field="cpdCount" placeholder="—" value="${s.cpdCount ?? ""}" ${ro} /></div>
        <div class="hr-line"><span class="hl">Ризикованих (к-сть)</span><input class="num-field" style="width:56px;" data-field="riskyCount" placeholder="—" value="${s.riskyCount ?? ""}" ${ro} /></div>
        <div class="hr-line"><span class="hl">Партаймерів (к-сть)</span>
          <span style="display:flex;align-items:center;gap:8px;">
            <input class="num-field" style="width:56px;" data-field="partTimeCount" placeholder="—" value="${s.partTimeCount ?? ""}" ${ro} />
            <span class="meta" style="min-width:32px;text-align:right;">${partTimePct==null ? "—" : partTimePct+"%"}</span>
          </span>
        </div>
        <div class="hr-line"><span class="hl">З інвалідністю</span>
          <div class="yn-toggle">
            <button class="yn-btn ${s.hasDisabilityEmployee===true?'active-yes':''}" data-action="disability-yes" ${ro}>Так</button>
            <button class="yn-btn ${s.hasDisabilityEmployee===false?'active-no':''}" data-action="disability-no" ${ro}>Ні</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireStoreCardEvents(){
  document.querySelectorAll('.card[data-idx]').forEach(card => {
    const idx = parseInt(card.dataset.idx, 10);
    const canEdit = currentUser.isAdmin || stores[idx].code === currentUser.store;
    card.querySelectorAll('input[data-field]').forEach(inp => {
      inp.addEventListener("change", () => {
        if(!canEdit) return;
        const field = inp.dataset.field;
        const isNum = inp.classList.contains("num-field");
        stores[idx][field] = isNum ? numOrNull(inp.value) : inp.value;
        persistStores(stores[idx].code);
        renderDistrictTab();
      });
    });
    const commentsBtn = card.querySelector('[data-action="open-comments"]');
    if(commentsBtn) commentsBtn.addEventListener("click", () => { commentsModalTarget = { kind: "store", id: stores[idx].code }; openCommentsModal(); });
    if(canEdit){
      const yesBtn = card.querySelector('[data-action="disability-yes"]');
      if(yesBtn) yesBtn.addEventListener("click", () => { stores[idx].hasDisabilityEmployee = true; persistStores(stores[idx].code); renderDistrictTab(); });
      const noBtn = card.querySelector('[data-action="disability-no"]');
      if(noBtn) noBtn.addEventListener("click", () => { stores[idx].hasDisabilityEmployee = false; persistStores(stores[idx].code); renderDistrictTab(); });
    }
  });
}

// Client-side .pptx generation (PptxGenJS, loaded from CDN only when the
// export button below is actually clicked — not on every page load), in
// the JYSK visual language (jysk-dashboard-report skill) matching a
// reference export Adam shared. Built entirely from data this dashboard
// already tracks — no server round-trip, no Telegram bot involvement —
// same admin-only gating as the Активність/Telegram-бот tabs.
//
// One deck PER TAB (exportActiveTabPptx, below the slide builders), not
// one combined district file — Adam asked for separate presentations
// matching the site's own navigation instead of a single always-full
// export. The 📤 Експорт PPTX button in the topbar reads currentUser's
// activeTab at click time and builds only that tab's deck:
//   Персонал        -> staffing+vacancy summary, онбординг, then one
//                       overview + one zones/coментарі slide PER STORE
//                       (the closest thing to a per-manager leave-behind,
//                       same two slide types the old combined deck used)
//   Відповідальність -> zone summary + "потребує уваги" ranked list
//   Звіти та показники -> latest-period overview tiles across every
//                       report type that has data, a ranked list for
//                       whichever report is freshest, + its own Click &
//                       Collect slide (two metrics, so two side-by-side
//                       lists rather than force-fitting one chart)
//   Витрати          -> Доставки (current month) + Обладнання (district
//                       totals per catalog item — no per-item photos,
//                       out of scope for a slide deck)
//   Активності та акції -> FY27 price-change calendar + marketing
//                       calendar, both as upcoming-first ranked lists
// Активність/Telegram-бот have no deck (internal admin tooling, not
// report content) — the button explains this rather than silently doing
// nothing.
//
// Two things Adam's reference had that this deliberately leaves out,
// both because the data genuinely doesn't exist here: a week-by-week
// trend chart per store (this app only ever holds the current snapshot,
// no history of past weeks' Норма/Факт) and a "К-сть талантів" tile
// (nothing in this app tracks a distinct "таланти" count). "Вакансії
// Амбасадор" became "найдовше відкриті вакансії" — this app has no
// vacancy category called "Амбасадор", so the closest real equivalent
// (oldest still-open vacancies) is used instead.
//
// Also follows Adam's own "Дизайнерські презентації" (designer-
// presentations) skill where its rules are runtime-compatible: this
// export runs entirely as JS in the visitor's browser (see above — no
// server round-trip), so the skill can't be *invoked* at click-time the
// way it would be in a chat — its concrete rules were folded into this
// generation code once instead. Applied: icon-in-a-circle section
// markers (icons pre-rendered once via sharp+react-icons, baked in below
// as PPTX_ICONS since sharp/react-dom aren't available in a browser),
// soft drop shadows on every card ("м'яка тінь на світлих темах"),
// speaker notes per slide, rounded corners throughout, no decorative
// edge stripes. Deliberately NOT applied: the skill's own gradient-mesh
// dark palette (Aurora/Sunset/etc.) — kept JYSK's navy/white instead,
// since that's the district's actual brand and what Adam's reference
// screenshot showed, and "one dominant color chosen for the topic" is
// itself one of the skill's own rules.
const PPTXGENJS_CDN = "https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js";
let pptxgenLoadPromise = null;
function loadPptxGenJS(){
  if(window.PptxGenJS) return Promise.resolve();
  if(pptxgenLoadPromise) return pptxgenLoadPromise;
  pptxgenLoadPromise = new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = PPTXGENJS_CDN;
    script.onload = () => resolve();
    script.onerror = () => { pptxgenLoadPromise = null; reject(new Error("Не вдалося завантажити бібліотеку для PowerPoint.")); };
    document.head.appendChild(script);
  });
  return pptxgenLoadPromise;
}

// Solid circle (navy by default, or `color`) + centered PPTX_ICONS glyph,
// per designer-presentations' "icons in circles" motif — used to mark each
// section header below, and (with a per-theme `color`) the hero-stat cards.
function pptxIconCircle(slide, pptx, x, y, d, iconKey, color){
  slide.addShape(pptx.ShapeType.ellipse, { x, y, w:d, h:d, fill:{color:color||PX.navy}, line:{type:"none"} });
  if(PPTX_ICONS[iconKey]) slide.addImage({ data:`image/png;base64,${PPTX_ICONS[iconKey]}`, x:x+d*0.22, y:y+d*0.22, w:d*0.56, h:d*0.56 });
}

// A fresh shadow options object every call — pptxgenjs mutates the object
// it's given in place, so a shared const would corrupt after the first use.
function pptxCardShadow(){
  return { type:"outer", color:"9AA3B2", opacity:0.35, blur:4, offset:2, angle:90 };
}

// A section header with an icon-in-a-circle marker to its left, per
// designer-presentations' motif — falls back to plain bold text when no
// iconKey is given (kept for callers that don't have a matching icon).
function pptxSectionHeader(slide, pptx, x, y, w, title, iconKey){
  const d = 0.32;
  let textX = x, textW = w;
  if(iconKey){
    pptxIconCircle(slide, pptx, x, y-0.02, d, iconKey);
    textX = x + d + 0.14; textW = w - d - 0.14;
  }
  slide.addText(title, { x:textX, y, w:textW, h:d, fontSize:14, bold:true, color:PX.ink, valign:"middle", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
}

// The navy full-bleed header bar is a deliberate, sourced exception to
// "avoid decorative bars spanning the slide" — it's JYSK's own reference
// export's actual house style (see the screenshot Adam sent) and this
// project's own established jysk-dashboard-report hero-banner motif, not
// an arbitrary stripe. Kept as the one repeated visual motif across every
// slide, per "commit to a visual motif" — nothing else in this deck uses
// an edge stripe or accent line.
function pptxAddHeader(slide, pptx, title, subtitle){
  slide.background = { color: PX.white };
  slide.addShape(pptx.ShapeType.rect, { x:0, y:0, w:"100%", h:0.95, fill:{color:PX.navy} });
  slide.addText("JYSK", { x:0.4, y:0.2, w:1.8, h:0.55, fontSize:24, bold:true, color:PX.white, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  slide.addText(title, { x:2.2, y:0.12, w:10.7, h:0.5, fontSize:24, bold:true, color:PX.white, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  slide.addText(subtitle, { x:2.2, y:0.58, w:10.7, h:0.3, fontSize:12, color:"D8DEEF", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
}

// tiles: [{label, value, color}] — laid out into `cols` per row (default
// 2); returns the y position right below the grid so the caller can stack
// more content under it.
function pptxAddStatTiles(slide, pptx, tiles, startY, cols=2){
  const gapX = 0.25, gapY = 0.16, startX = 0.4, totalW = 12.53;
  const tileW = (totalW - gapX*(cols-1)) / cols, tileH = 0.62;
  tiles.forEach((t, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const x = startX + col * (tileW + gapX);
    const y = startY + row * (tileH + gapY);
    slide.addShape(pptx.ShapeType.roundRect, { x, y, w:tileW, h:tileH, rectRadius:0.06, fill:{color:PX.paper}, line:{type:"none"}, shadow:pptxCardShadow() });
    slide.addText(t.label, { x:x+0.18, y, w:tileW*0.62, h:tileH, fontSize:11, color:PX.inkSoft, valign:"middle", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
    slide.addText(String(t.value), { x:x+tileW*0.55, y, w:tileW*0.45-0.18, h:tileH, fontSize:18, bold:true, color:t.color||PX.ink, align:"right", valign:"middle", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  });
  return startY + Math.ceil(tiles.length / cols) * (tileH + gapY);
}

// "Stats" layout (designer-presentations catalog) — bigger hero numbers in
// an icon-circle card, replacing pptxAddStatTiles on each deck's primary
// summary slide for more visual weight than the dense small-tile grid.
// Row height is fixed at 1.55in (vs. 0.62in for pptxAddStatTiles) — the
// same "how many rows of ranked list still fit below" convention applies,
// just with fewer stat rows ever needed here (max 4 per deck).
function pptxHeroStatsRow(slide, pptx, x, y, w, stats){
  const gapX = 0.25, cardH = 1.55, n = stats.length;
  const cardW = (w - gapX*(n-1)) / n;
  stats.forEach((s, i) => {
    const cx = x + i*(cardW+gapX);
    slide.addShape(pptx.ShapeType.roundRect, { x:cx, y, w:cardW, h:cardH, rectRadius:0.14, fill:{color:PX.paper}, line:{type:"none"}, shadow:pptxCardShadow() });
    if(s.icon) pptxIconCircle(slide, pptx, cx+0.22, y+0.22, 0.5, s.icon, s.color||PX.navy);
    slide.addText(String(s.value), { x:cx+0.22, y:y+0.8, w:cardW-0.44, h:0.5, fontSize:24, bold:true, color:s.color||PX.ink, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
    slide.addText(s.label, { x:cx+0.22, y:y+1.28, w:cardW-0.44, h:0.24, fontSize:10, color:PX.inkSoft, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  });
  return y + cardH + 0.25;
}

// Dominant color per deck topic (designer-presentations: "один домінантний
// колір... під тему, а не за замовчуванням синій") — chosen from JYSK's own
// palette, matching the site's own main.tab-* accent where one already
// exists (personnel=navy family, zones=green, expenses=red). `bg` is a
// pre-baked gradient-mesh JPEG (see PPTX_BG above) for the title/closing
// slides; `accent`/`accent2` recolor hero-stat icon circles on the light
// content slides so each deck reads as visually distinct, not five copies
// of the same navy template.
const PPTX_THEMES = {
  personnel: { bg: PPTX_BG.personnel, accent: "5B3E96", accent2: PX.navy },
  zones:     { bg: PPTX_BG.zones,     accent: PX.green, accent2: PX.navy },
  kpi:       { bg: PPTX_BG.kpi,       accent: PX.navy,  accent2: "229ED9" },
  expenses:  { bg: PPTX_BG.expenses,  accent: PX.red,   accent2: PX.navy },
  promo:     { bg: PPTX_BG.promo,     accent: PX.amber, accent2: PX.red },
};

// Dark "sandwich" cover slide (designer-presentations: title/section/final
// slides dark, content slides light) — gradient-mesh background, an eyebrow
// pill, and a full-sentence thesis headline built from this deck's own real
// numbers (never invented — see each pptxXxxDeck's thesis computation).
function pptxTitleSlide(pptx, theme, eyebrow, thesis, subtitle){
  const slide = pptx.addSlide();
  slide.background = { data: `image/jpeg;base64,${theme.bg}` };
  const pillW = Math.min(7, 0.5 + eyebrow.length * 0.088);
  slide.addShape(pptx.ShapeType.roundRect, { x:0.7, y:0.9, w:pillW, h:0.4, rectRadius:0.2, fill:{color:"FFFFFF", transparency:88}, line:{color:"FFFFFF", transparency:65, width:0.75} });
  slide.addText(eyebrow.toUpperCase(), { x:0.7, y:0.9, w:pillW, h:0.4, fontSize:11, color:"FFFFFF", fontFace:"Courier New", charSpacing:1, align:"center", valign:"middle", isTextBox:true, margin:0 });
  slide.addText(thesis, { x:0.7, y:2.7, w:11.93, h:2.6, fontSize:40, bold:true, color:"FFFFFF", fontFace:"Georgia", valign:"top", lineSpacingMultiple:1.1, isTextBox:true, margin:0 });
  slide.addText(subtitle, { x:0.7, y:5.55, w:11.93, h:0.5, fontSize:14, color:"D8DEEF", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  slide.addText("JYSK · KYIV-1 · ДІСТРИКТ", { x:0.7, y:6.9, w:8, h:0.3, fontSize:10.5, color:"AEB6DA", fontFace:"Courier New", charSpacing:1, isTextBox:true, margin:0 });
  slide.addNotes(`${eyebrow}. ${thesis}`);
}

// Dark closing slide — same background family as the title slide, a short
// closing statement (real data again, not a generic "дякуємо").
function pptxClosingSlide(pptx, theme, thesis, note){
  const slide = pptx.addSlide();
  slide.background = { data: `image/jpeg;base64,${theme.bg}` };
  slide.addText(thesis, { x:0.7, y:2.85, w:11.93, h:1.9, fontSize:30, bold:true, color:"FFFFFF", fontFace:"Georgia", valign:"top", lineSpacingMultiple:1.1, isTextBox:true, margin:0 });
  slide.addText(note, { x:0.7, y:4.55, w:11.93, h:0.5, fontSize:13, color:"D8DEEF", fontFace:PPTX_FONT, isTextBox:true, margin:0 });

  slide.addNotes(thesis);
}

// A compact ranked list — name(+sub) on the left, a colored value on the
// right, matching jysk-dashboard-report's ranked-list widget. Does NOT cap
// row count itself (some callers legitimately want more, e.g. a full
// 10-store table) — every caller on a 7.5in-tall slide must slice its own
// `rows` first: ~7 rows fit after a single row of pptxAddStatTiles (startY
// 1.25, one row @ cols>=3), ~6 after a two-row stat block (6+ tiles at
// cols=3), ~5 after a single row of the taller pptxHeroStatsRow cards.
// Forgetting this silently runs rows off the bottom of the slide.
function pptxAddRankedList(slide, pptx, x, y, w, title, rows, iconKey){
  pptxSectionHeader(slide, pptx, x, y, w, title, iconKey);
  let ry = y + 0.4;
  if(!rows.length){
    slide.addText("Немає даних", { x, y:ry, w, h:0.3, fontSize:11, color:PX.inkSoft, italic:true, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
    return;
  }
  rows.forEach(r => {
    slide.addShape(pptx.ShapeType.roundRect, { x, y:ry, w, h:0.55, rectRadius:0.05, fill:{color:PX.paper}, line:{type:"none"}, shadow:pptxCardShadow() });
    slide.addText(r.name, { x:x+0.15, y:ry, w:w*0.62, h:0.28, fontSize:11.5, bold:true, color:PX.ink, valign:"top", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
    if(r.sub) slide.addText(r.sub, { x:x+0.15, y:ry+0.25, w:w*0.62, h:0.25, fontSize:9.5, color:PX.inkSoft, valign:"top", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
    slide.addText(r.value, { x:x+w*0.6, y:ry, w:w*0.38-0.12, h:0.55, fontSize:13, bold:true, color:r.color||PX.ink, align:"right", valign:"middle", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
    ry += 0.63;
  });
}

// A thin rounded progress track + fill, matching the site's own
// .bar-track/.bar-fill — used for "ВІД НОРМИ" on each store's slide.
function pptxAddProgressBar(slide, pptx, x, y, w, label, pct, color){
  slide.addText(label, { x, y, w:w*0.6, h:0.25, fontSize:10.5, color:PX.inkSoft, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  slide.addText(`${pct>0?"+":""}${pct}%`, { x:x+w*0.6, y, w:w*0.4, h:0.25, fontSize:12, bold:true, color, align:"right", fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  const trackY = y + 0.28;
  slide.addShape(pptx.ShapeType.roundRect, { x, y:trackY, w, h:0.12, rectRadius:0.06, fill:{color:PX.paper}, line:{type:"none"} });
  const fillW = Math.max(0.08, Math.min(1, Math.abs(pct)/100) * w);
  slide.addShape(pptx.ShapeType.roundRect, { x: pct<0 ? x+w-fillW : x, y:trackY, w:fillW, h:0.12, rectRadius:0.06, fill:{color}, line:{type:"none"} });
}

function pptxFmtDiff(n){ return n>0 ? `+${n}` : String(n); }
function pptxTruncate(s, n){ s = String(s||""); return s.length>n ? s.slice(0,n-1)+"…" : s; }
// "YYYY-MM-DD" -> "DD.MM.YY" — a stat tile is only ~1.1in wide, too
// narrow for the full ISO date at 18pt bold without wrapping.
function pptxShortDate(iso){ const [y,m,d] = String(iso).split("-"); return `${d}.${m}.${y.slice(2)}`; }

function pptxDistrictSlide(pptx, allStores, allVacancies){
  const slide = pptx.addSlide();
  const withActual = allStores.filter(s => s.actualStakes!=null);
  const withHc = allStores.filter(s => s.actualHeadcount!=null);
  const baseSum = round2(allStores.reduce((s,x)=>s+(x.baseStakes||0),0));
  const actualSum = round2(withActual.reduce((s,x)=>s+(x.actualStakes||0),0));
  const gapStakes = withActual.length ? round2(actualSum - withActual.reduce((s,x)=>s+(x.baseStakes||0),0)) : null;
  const actualHc = round2(withHc.reduce((s,x)=>s+(x.actualHeadcount||0),0));
  const gapHc = withHc.length ? round2(actualHc - withHc.reduce((s,x)=>s+(x.baseHeadcount||0),0)) : null;
  const cpdTotal = allStores.reduce((s,x)=>s+(x.cpdCount||0),0);
  const riskyTotal = allStores.reduce((s,x)=>s+(x.riskyCount||0),0);
  const ptTotal = allStores.reduce((s,x)=>s+(x.partTimeCount||0),0);
  const withInfo = allVacancies.map(v => ({v, d: vacancyInfo(v)}));
  const openCount = withInfo.filter(x => x.d.status === "open").length;
  const filled = withInfo.filter(x => x.d.status === "filled" && x.d.timeToFill != null);
  const avgTtf = filled.length ? round2(filled.reduce((s,x)=>s+x.d.timeToFill,0)/filled.length) : null;
  const d = new Date();

  pptxAddHeader(slide, pptx, "Персонал — штат і вакансії", `${allStores.length} магазинів · ${d.getDate()} ${HERO_MONTH_NAMES_UA[d.getMonth()]} ${d.getFullYear()}`);

  const hero = [
    { icon:"trendingUp", label:"Різниця ставок", value: gapStakes==null?"—":pptxFmtDiff(gapStakes), color: gapStakes==null?PX.navy:(gapStakes<0?PX.red:PX.green) },
    { icon:"users", label:"Різниця людей", value: gapHc==null?"—":pptxFmtDiff(gapHc), color: gapHc==null?PX.navy:(gapHc<0?PX.red:PX.green) },
    { icon:"storeAlert", label:"Відкритих вакансій", value: openCount, color: openCount>0?PX.red:PX.green },
    { icon:"clock", label:"Середній Time-to-Fill", value: avgTtf==null?"—":`${avgTtf} дн.`, color:PX.navy },
  ];
  let y = pptxHeroStatsRow(slide, pptx, 0.4, 1.25, 12.53, hero);
  const tiles = [
    { label:"Норма, ставок", value: baseSum },
    { label:"Факт, ставок", value: actualSum },
    { label:"Всього працівників", value: actualHc },
    { label:"ЦПХ, осіб", value: cpdTotal },
    { label:"Ризикованих, осіб", value: riskyTotal },
  ];
  y = pptxAddStatTiles(slide, pptx, tiles, y, 5) + 0.2;

  const deficitRanked = allStores
    .filter(s => s.actualHeadcount!=null && s.baseHeadcount!=null && s.actualHeadcount - s.baseHeadcount < 0)
    .map(s => ({ s, gap: round2(s.actualHeadcount - s.baseHeadcount) }))
    .sort((a,b) => a.gap - b.gap)
    .slice(0,5)
    .map(({s,gap}) => ({ name:`${s.code} · ${s.name||""}`, sub:"Не вистачає людей", value:`${gap}`, color:PX.red }));

  const oldestOpen = withInfo
    .filter(x => x.d.status === "open")
    .sort((a,b) => b.d.daysOpen - a.d.daysOpen)
    .slice(0,5)
    .map(({v,d:info}) => {
      const store = allStores.find(s => s.code === v.storeCode);
      return { name:`${v.storeCode} · ${store?.name||""}`, sub: v.position||"", value:`${info.daysOpen} дн.`, color: info.overdue?PX.red:PX.ink };
    });

  pptxAddRankedList(slide, pptx, 0.4, y, 6.05, "Фокусні магазини (дефіцит людей)", deficitRanked, "storeAlert");
  pptxAddRankedList(slide, pptx, 6.85, y, 6.05, "Найдовше відкриті вакансії", oldestOpen, "clock");

  slide.addNotes(`Дистрикт Kyiv-1, ${allStores.length} магазинів. Факт ${actualSum} ставок проти норми ${baseSum} (різниця ${gapStakes==null?"—":pptxFmtDiff(gapStakes)}). Відкритих вакансій: ${openCount}. Дивись фокусні магазини та найдовше відкриті вакансії нижче для пріоритетів на цей тиждень.`);
}

function pptxStoreOverviewSlide(pptx, s, allVacancies, openByStore){
  const slide = pptx.addSlide();
  pptxAddHeader(slide, pptx, `${s.code} · ${s.name||""}`, "Місячний огляд магазину");

  const status = staffingStatus(s);
  const meta = STATUS_META[status];
  slide.addShape(pptx.ShapeType.roundRect, { x:11.8, y:0.28, w:1.15, h:0.35, rectRadius:0.17, fill:{color:PX.white}, shadow:pptxCardShadow() });
  slide.addText(meta.label, { x:11.8, y:0.28, w:1.15, h:0.35, fontSize:9.5, bold:true, color:meta.color, align:"center", valign:"middle", fontFace:PPTX_FONT, isTextBox:true, margin:0 });

  slide.addTable([
    [
      {text:"Показник", options:{bold:true, color:PX.white, fill:{color:PX.navy}}},
      {text:"Норма (базово)", options:{bold:true, color:PX.white, fill:{color:PX.navy}}},
      {text:"Норма (сезон)", options:{bold:true, color:PX.white, fill:{color:PX.navy}}},
      {text:"Фактично", options:{bold:true, color:PX.white, fill:{color:PX.navy}}},
      {text:"Різниця", options:{bold:true, color:PX.white, fill:{color:PX.navy}}},
    ],
    ["Ставок", s.baseStakes??"—", s.seasonStakes??"—", s.actualStakes??"—", s.actualStakes!=null?pptxFmtDiff(round2(s.actualStakes-(s.baseStakes||0))):"—"],
    ["Людей", s.baseHeadcount??"—", s.seasonHeadcount??"—", s.actualHeadcount??"—", s.actualHeadcount!=null?pptxFmtDiff(round2(s.actualHeadcount-(s.baseHeadcount||0))):"—"],
  ], { x:0.4, y:1.25, w:12.53, colW:[3.73,2.2,2.2,2.2,2.2], fontSize:12, fontFace:PPTX_FONT, border:{color:PX.line, pt:0.75}, align:"center", valign:"middle", autoPage:false, rowH:0.42 });

  const gapStakes = s.actualStakes==null ? null : round2(s.actualStakes - (s.baseStakes||0));
  const pct = (gapStakes===null || !s.baseStakes) ? null : round2(gapStakes / s.baseStakes * 100);
  let y = 2.65;
  if(pct != null){
    pptxAddProgressBar(slide, pptx, 0.4, y, 12.53, "ВІД НОРМИ", pct, pct<0?PX.red:PX.green);
    y += 0.6;
  }

  const openCount = openByStore[s.code] || 0;
  const smtCount = allVacancies.filter(v => v.storeCode===s.code && v.position==="SMT" && vacancyInfo(v).status==="open").length;
  const tiles = [
    { label:"Відкритих вакансій", value:openCount, color: openCount>0?PX.red:null },
    { label:"ЦПХ, осіб", value:s.cpdCount??0 },
    { label:"Ризикованих, осіб", value:s.riskyCount??0 },
    { label:"Партаймерів, осіб", value:s.partTimeCount??0 },
    { label:"К-сть SMT (вакансії)", value:smtCount },
    { label:"Працівник з інвалідністю", value: s.hasDisabilityEmployee===true?"Так":s.hasDisabilityEmployee===false?"Ні":"—" },
  ];
  pptxAddStatTiles(slide, pptx, tiles, y, 3);

  slide.addNotes(`${s.code} · ${s.name||""}. Статус: ${meta.label}. Факт ${s.actualStakes??"—"} ставок / ${s.actualHeadcount??"—"} людей проти норми ${s.baseStakes??"—"} / ${s.baseHeadcount??"—"}. Відкритих вакансій: ${openCount}.`);
}

// Second slide per store — real, already-tracked data the reference
// screenshot showed alongside the numbers: responsibility zones assigned
// to this store's people (Відповідальність tab) and the store's own
// comment thread. Split onto its own slide rather than crammed under the
// overview — "one clear focal point, detail below it" (visual-design-
// principles skill), not an overflowing single slide.
function pptxStoreZonesAndCommentsSlide(pptx, s, allZones){
  const slide = pptx.addSlide();
  pptxAddHeader(slide, pptx, `${s.code} · ${s.name||""}`, "Відповідальність та коментарі");

  const storeZones = allZones.filter(z => (z.responsibles||[]).some(r => r.trim().endsWith("— " + s.code)));
  pptxSectionHeader(slide, pptx, 0.4, 1.15, 6.05, "Зони відповідальності", "target");
  let zy = 1.55;
  if(!storeZones.length){
    slide.addText("Немає призначених зон", { x:0.4, y:zy, w:6.05, h:0.3, fontSize:11, color:PX.inkSoft, italic:true, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  } else {
    storeZones.slice(0,4).forEach(z => {
      const cardH = 1.1;
      slide.addShape(pptx.ShapeType.roundRect, { x:0.4, y:zy, w:6.05, h:cardH, rectRadius:0.06, fill:{color:PX.paper}, line:{type:"none"}, shadow:pptxCardShadow() });
      slide.addText(z.title, { x:0.6, y:zy+0.08, w:5.7, h:0.3, fontSize:11.5, bold:true, color:PX.ink, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
      slide.addText(pptxTruncate(z.goal, 130), { x:0.6, y:zy+0.38, w:5.7, h:0.45, fontSize:9, color:PX.inkSoft, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
      slide.addText(`Прогрес: ${z.progress ?? 0}%  ·  ${(z.responsibles||[]).join(", ")}`, { x:0.6, y:zy+0.82, w:5.7, h:0.24, fontSize:9, bold:true, color:PX.green, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
      zy += cardH + 0.15;
    });
  }

  const comments = normalizeStoreComments(s).slice(-5).reverse();
  pptxSectionHeader(slide, pptx, 6.85, 1.15, 6.05, "Коментарі", "messageSquare");
  let cy = 1.55;
  if(!comments.length){
    slide.addText("Коментарів ще немає", { x:6.85, y:cy, w:6.05, h:0.3, fontSize:11, color:PX.inkSoft, italic:true, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
  } else {
    comments.forEach(c => {
      const cardH = 0.85;
      slide.addShape(pptx.ShapeType.roundRect, { x:6.85, y:cy, w:6.05, h:cardH, rectRadius:0.06, fill:{color:PX.paper}, line:{type:"none"}, shadow:pptxCardShadow() });
      slide.addText(pptxTruncate(c.text, 150), { x:7.05, y:cy+0.08, w:5.65, h:0.5, fontSize:10, color:PX.ink, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
      slide.addText(`${c.who}${c.when ? " · " + c.when : ""}`, { x:7.05, y:cy+0.58, w:5.65, h:0.22, fontSize:8.5, color:PX.inkSoft, italic:true, fontFace:PPTX_FONT, isTextBox:true, margin:0 });
      cy += cardH + 0.15;
    });
  }

  slide.addNotes(`${s.code} · ${s.name||""}. ${storeZones.length} зон(и) відповідальності призначено людям цього магазину, ${comments.length} останніх коментар(ів) нижче.`);
}

// ---- Персонал deck: summary slides + one overview/zones pair per store ----
function pptxOnboardingSummarySlide(pptx){
  const slide = pptx.addSlide();
  pptxAddHeader(slide, pptx, "Онбординг", "Навчальні плани нових працівників");
  const snap = ONBOARDING_SNAPSHOTS[ONBOARDING_SNAPSHOTS.length - 1] || null;
  const plans = snap ? snap.plans : [];
  const total = plans.length;
  const overdue = plans.filter(p => p.dur < 0).length;
  const avgPct = total ? Math.round(plans.reduce((s,p)=>s+(p.pct||0),0)/total) : 0;
  const hero = [
    { icon:"award", label:"Активних планів", value: total, color:PX.navy },
    { icon:"clock", label:"Прострочених", value: overdue, color: overdue>0?PX.red:PX.green },
    { icon:"trendingUp", label:"Середній прогрес", value: `${avgPct}%`, color:PX.navy },
    { icon:"calendar", label:"Дата зрізу", value: snap ? pptxShortDate(snap.date) : "—", color:PX.navy },
  ];
  let y = pptxHeroStatsRow(slide, pptx, 0.4, 1.25, 12.53, hero);
  const worst = [...plans].sort((a,b) => a.dur - b.dur).slice(0,5).map(p => ({
    name: `${p.name} — ${p.store}`,
    sub: onboardingPlanShortName(p.plan),
    value: p.dur < 0 ? `${Math.abs(p.dur)} дн. прострочено` : `${p.dur} дн. лишилось`,
    color: p.dur < 0 ? PX.red : (p.pct||0) < 30 ? PX.amber : PX.ink,
  }));
  pptxAddRankedList(slide, pptx, 0.4, y, 12.53, "Плани, що потребують уваги", worst, "clock");
  slide.addNotes(`Онбординг станом на ${snap ? snap.date : "—"}: ${total} активних планів, ${overdue} прострочено, середній прогрес ${avgPct}%.`);
}

function pptxPersonnelDeck(pptx){

  pptxTitleSlide(pptx, theme, "Персонал", thesis, "Kyiv-1 · штат, вакансії, онбординг та відповідальність по кожному магазину");

// ---- Звіти та показники deck ----
// Shared by the KPI deck's overview slide and its title-slide thesis — the
// "which report type has data, which is freshest" computation only needs
// doing once. avgOf() gives the district's own average for a report's
// ownStores, used both for hero-stat tiles and the title's network
// comparison — never invented, always derived straight from real entries.
function avgOf(rows){ const vals=(rows||[]).map(r=>r.value).filter(v=>v!=null); return vals.length ? round2(vals.reduce((a,b)=>a+b,0)/vals.length) : null; }
function pptxKpiFreshest(){
  const latestOf = (title) => kpiBenchmarks.filter(b=>b.title===title).sort((a,b)=>new Date(b.addedAt)-new Date(a.addedAt))[0] || null;
  const b7 = latestOf("Використання 7-го коду");
  const bComplex = latestOf("Комплексні продажі");
  const bEnergy = latestOf("Енерджи");
  const bMobility = latestOf("Мобіліті");
  const clearance = [...kpiClearance].sort((a,b)=>new Date(b.addedAt)-new Date(a.addedAt))[0] || null;
  const cc = [...kpiClickCollect].sort((a,b)=>new Date(b.addedAt)-new Date(a.addedAt))[0] || null;
  const candidates = [
    b7 && { icon:"percent", label:"Використання 7-го коду", period:b7.period, addedAt:b7.addedAt, unit:b7.unit, goodDirection:b7.goodDirection, networkAvg:b7.networkAvg, rows:b7.ownStores },
    bComplex && { icon:"shoppingCart", label:"Комплексні продажі", period:bComplex.period, addedAt:bComplex.addedAt, unit:bComplex.unit, goodDirection:bComplex.goodDirection, networkAvg:bComplex.networkAvg, rows:bComplex.ownStores },
    bEnergy && { icon:"trendingUp", label:"Енерджи", period:bEnergy.period, addedAt:bEnergy.addedAt, unit:bEnergy.unit, goodDirection:bEnergy.goodDirection, networkAvg:bEnergy.networkAvg, rows:bEnergy.ownStores },
    bMobility && { icon:"award", label:"Мобіліті", period:bMobility.period, addedAt:bMobility.addedAt, unit:bMobility.unit, goodDirection:bMobility.goodDirection, networkAvg:bMobility.networkAvg, rows:bMobility.ownStores },
    clearance && { icon:"package", label:"Розпродажні залишки", period:clearance.periodRange, addedAt:clearance.addedAt, unit:"%", goodDirection:"low", networkAvg:null, rows:clearance.stores.map(s=>({code:s.code,name:s.name,value:s.share})) },
    cc && { icon:"circleCheck", label:"C&C вчасне підтвердження", period:cc.period, addedAt:cc.addedAt, unit:"%", goodDirection:"high", networkAvg:cc.onTime.networkAvg, rows:cc.onTime.ownStores },
  ].filter(Boolean).sort((a,b) => new Date(b.addedAt) - new Date(a.addedAt));
  return { cc, candidates, freshest: candidates[0] || null };
}

function pptxKpiOverviewSlide(pptx, data){
  const slide = pptx.addSlide();
  pptxAddHeader(slide, pptx, "Звіти та показники", "Останні дані по кожному звіту");
  const hero = data.candidates.map(c => ({
    icon: c.icon, label: c.label, color: PX.navy,
    value: avgOf(c.rows)!=null ? `${avgOf(c.rows)}${c.unit}` : "—",
  }));
  if(!hero.length) hero.push({ label:"Даних ще немає", value:"—", color:PX.navy });
  let y = pptxHeroStatsRow(slide, pptx, 0.4, 1.25, 12.53, hero);

  const freshest = data.freshest;
  if(freshest){
    const dirMul = freshest.goodDirection === "low" ? 1 : -1;
    // Capped to 5 — see the comment on pptxAddRankedList (hero-stats row).
    const rows = [...freshest.rows].filter(r=>r.value!=null).sort((a,b)=>(a.value-b.value)*dirMul).slice(0,5)
      .map(r => ({ name:`${r.code} · ${r.name||""}`, value:`${r.value}${freshest.unit}`, color:PX.ink }));
    pptxAddRankedList(slide, pptx, 0.4, y, 12.53, `${freshest.label} — по магазинах (${freshest.period})`, rows, "target");
  }
  slide.addNotes(`Останні дані по звітах дістрикту.${freshest ? ` Найсвіжіший — ${freshest.label}, ${freshest.period}.` : " Даних ще немає."}`);
}

function pptxKpiDeck(pptx){
  const theme = PPTX_THEMES.kpi;
  const data = pptxKpiFreshest();
  const f = data.freshest;
  let thesis;
  if(f && f.networkAvg!=null){
    const ownAvg = avgOf(f.rows);
    if(ownAvg!=null){
      const diff = round2(ownAvg - f.networkAvg);
      const better = f.goodDirection==="low" ? diff<0 : diff>0;
      // "випереджає мережу" (accusative) vs "відстає від мережі" (genitive
      // after "від") — different verbs, different case, can't share one
      // noun form the way an earlier draft of this line did.
      thesis = diff===0 ? `Дістрикт точно на рівні мережі у «${f.label}»` : better ? `Дістрикт випереджає мережу на ${Math.abs(diff)}${f.unit} у «${f.label}»` : `Дістрикт відстає від мережі на ${Math.abs(diff)}${f.unit} у «${f.label}»`;
    } else thesis = `Останні дані — «${f.label}», ${f.period}`;
  } else if(f){
    thesis = `Останні дані дістрикту — «${f.label}», ${f.period}`;
  } else {
    thesis = "Показники ще не надходили цього періоду";
  }
  pptxTitleSlide(pptx, theme, "Звіти та показники", thesis, "Kyiv-1 · зведення по всіх мережевих звітах дістрикту");
  pptxKpiOverviewSlide(pptx, data);
  if(data.cc) pptxClickCollectSlide(pptx, data.cc);
  pptxClosingSlide(pptx, theme, thesis, "Kyiv-1 Dashboard · Звіти та показники");
}

function pptxExpensesDeck(pptx){
