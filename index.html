});

const FS_KEYS = { users: "users", zones: "zones", stores: "staffing-stores", vacancies: "vacancies", adminPassword: "admin-password", loginLog: "login-log", responsibilityLog: "responsibility-log", responsibilitySeenAt: "responsibility-seen-at" };
const LOGIN_LOG_CAP = 3000; // keep the Firestore doc small — oldest entries drop off
const RESPONSIBILITY_LOG_CAP = 300; // far fewer assignment changes than logins, so a smaller cap is plenty

async function fsGet(key) {
  try {
    const snap = await getDoc(doc(db, "kyiv1", key));
    return snap.exists() ? snap.data().value : undefined;
  } catch (e) { return undefined; }
}
async function fsSet(key, value) {
  try { await setDoc(doc(db, "kyiv1", key), { value }, { merge: true }); } catch (e) {}
}

// Same project, separate collection — state for telegram-bot/worker.js (see TAB: TELEGRAM BOT below).
async function tgGet(key) {
  try {
    const snap = await getDoc(doc(db, "telegram-bot", key));
    return snap.exists() ? snap.data().value : undefined;
  } catch (e) { return undefined; }
}
async function tgSet(key, value) {
  try { await setDoc(doc(db, "telegram-bot", key), { value }, { merge: true }); } catch (e) {}
}

// ================= THEME (день/ніч) =================
const THEME_KEY = "kyiv1-theme";
function getTheme(){
  try{ return localStorage.getItem(THEME_KEY) === "dark" ? "dark" : "light"; }catch(e){ return "light"; }
}
function applyTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
}
function setTheme(theme){
  applyTheme(theme);
  try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
}
applyTheme(getTheme()); // застосувати збережену тему одразу, до першого рендеру — без "блимання"

// Sourcing-activity heuristic (з аналітики HR-вакансій): чим більше
// відкритих контактів — тим активніше керуючий опрацьовує вакансію.
// Мало кандидатів І мало контактів одночасно — сигнал звернути увагу.
const SOURCING_ATTENTION_CANDIDATES = 5;
const SOURCING_ATTENTION_CONTACTS = 3;
const SOURCING_GOOD_CONTACTS = 10;

function sourcingStatus(v){
  const cand = v.candidateCount, contacts = v.openContacts;
  if((cand === null || cand === undefined) && (contacts === null || contacts === undefined)){
    return {label:"Дані не введено", color:"var(--ink-soft)", border:"var(--line)", level:"none"};
  }
  const c = cand ?? 0, oc = contacts ?? 0;
  if(oc >= SOURCING_GOOD_CONTACTS) return {label:"Активно опрацьовується", color:"var(--green)", border:"var(--green-dim)", level:"good"};
  if(c <= SOURCING_ATTENTION_CANDIDATES && oc <= SOURCING_ATTENTION_CONTACTS) return {label:"Потребує уваги", color:"var(--red)", border:"var(--red-dim)", level:"attention"};
  return {label:"Помірна активність", color:"var(--amber)", border:"var(--amber-dim)", level:"moderate"};
}

function round2(n){ return Math.round(n*100)/100; }
// Ukrainian noun-count agreement (1 -> one, 2-4 -> few, 5+/11-14 -> many),
// e.g. pluralUA(3, "зона", "зони", "зон") === "зони" — used wherever a
// count badge is built from data whose length isn't always 5+.
function pluralUA(n, one, few, many){
  const mod10 = n % 10, mod100 = n % 100;
  if(mod100 >= 11 && mod100 <= 14) return many;
  if(mod10 === 1) return one;
  if(mod10 >= 2 && mod10 <= 4) return few;
  return many;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((new Date(b)-new Date(a))/86400000); }
function escapeHtml(str){ return String(str ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

const HERO_MONTH_NAMES_UA = ["січня","лютого","березня","квітня","травня","червня","липня","серпня","вересня","жовтня","листопада","грудня"];
function heroUpdatedLabel(){

  return `Оновлено ${d.getDate()} ${HERO_MONTH_NAMES_UA[d.getMonth()]} ${d.getFullYear()}`;
}
function heroBannerHtml(title){

      <div class="hero-eyebrow">KYIV-1 · ДІСТРИКТ · ${heroUpdatedLabel()}</div>
      <div class="hero-title">${escapeHtml(title)}</div>
    </div>
  `;
}
function numOrNull(v){ if(v===""||v===null||v===undefined) return null; const n=parseFloat(String(v).replace(",",".")); return isNaN(n)?null:round2(n); }

function staffingStatus(s){
  if(s.actualStakes===null||s.actualStakes===undefined) return "pending";
  const diff = round2(s.actualStakes - (s.baseStakes||0));
  if(s.actualHeadcount!==null && s.actualHeadcount!==undefined && s.baseHeadcount!==null && s.baseHeadcount!==undefined){
    const hcDiff = round2(s.actualHeadcount - s.baseHeadcount);
    if(hcDiff <= -3) return "peopleCritical";
    if(hcDiff <= -1) return "peopleWarning";
  }
  if(diff < -0.01) return "deficit";
  if(diff > 0.01) return "surplus";
  return "ok";
}
function vacancyInfo(v){
  const status = v.hireStatus || "open";
  let daysOpen=null, overdue=false, timeToFill=null;
  if(status==="open"){ daysOpen = daysBetween(v.openedDate, todayISO()); overdue = daysOpen!==null && daysOpen>OVERDUE_DAYS; }
  else if(status==="filled" && v.hiredDate){ timeToFill = daysBetween(v.openedDate, v.hiredDate); }
  return {status, daysOpen, overdue, timeToFill};
}
// Open-vacancy counts per store, shared by the district cards grid and the
// "Потребує уваги" combined-signal list below.
function computeVacancyStoreStats(){
  const openByStore = {}, oldestByStore = {};
  vacancies.forEach(v => {
    const info = vacancyInfo(v);
    if(info.status === "open"){
      openByStore[v.storeCode] = (openByStore[v.storeCode]||0)+1;
      if(!(v.storeCode in oldestByStore) || info.daysOpen > oldestByStore[v.storeCode]) oldestByStore[v.storeCode] = info.daysOpen;
    }
  });
  return {openByStore, oldestByStore};
}
// A conic-gradient "ring" gauge — the circular score cards from the JYSK
// Customer Voice reference dashboard, generalized to any 0-100 percentage
// this app already tracks (no fabricated metric — pct/label/valueText/sub
// all come from real data at the call site).
function gaugeHtml(pct, color, label, valueText, sub){
  const clamped = Math.max(0, Math.min(100, pct));
  return `
    <div class="gauge-card">
      <div class="gauge-ring" style="background:conic-gradient(${color} ${round2(clamped*3.6)}deg, var(--surface-soft) 0deg)">
        <div class="gauge-value" style="color:${color}">${Math.round(pct)}%</div>
      </div>
      <div class="gauge-info">
        <div class="lbl">${escapeHtml(label)}</div>
        <div class="val">${valueText}</div>
        ${sub ? `<div class="sub">${sub}</div>` : ""}
      </div>
    </div>
  `;
}

// Records one login event to the shared, district-wide log used by the
// "Активність" tab. Re-reads the doc first (instead of trusting local
// `loginLog`) so two people logging in around the same moment are less
// likely to clobber each other's entry.
async function logLoginEvent(user){
  try{
    const raw = await fsGet(FS_KEYS.loginLog);
    let log = raw ? JSON.parse(raw) : [];
    log.push({
      userId: user.id,
      name: user.isAdmin ? "District Manager" : user.name,
      store: user.isAdmin ? null : user.store,
      isAdmin: !!user.isAdmin,
      at: new Date().toISOString(),
    });
    if(log.length > LOGIN_LOG_CAP) log = log.slice(log.length - LOGIN_LOG_CAP);
    loginLog = log;
    await fsSet(FS_KEYS.loginLog, JSON.stringify(log));
  }catch(e){ /* best-effort — never block login on this */ }
}

// Records a change to a zone's assigned responsible person(s), so the
// District Manager gets a notification bell in the topbar instead of
// having to notice the change by re-checking every card. Same
// re-read-before-write pattern as logLoginEvent, for the same reason.
async function logResponsibilityChange(zone, oldList, newList){
  try{
    const raw = await fsGet(FS_KEYS.responsibilityLog);
    let log = raw ? JSON.parse(raw) : [];
    log.push({
      zoneId: zone.id,
      zoneTitle: zone.title,
      oldResponsibles: oldList,
      newResponsibles: newList,
      changedBy: currentUser.name,
      at: new Date().toISOString(),
    });
    if(log.length > RESPONSIBILITY_LOG_CAP) log = log.slice(log.length - RESPONSIBILITY_LOG_CAP);
    responsibilityLog = log;
    await fsSet(FS_KEYS.responsibilityLog, JSON.stringify(log));
  }catch(e){ /* best-effort — never block the assignment on this */ }
}
// Unseen = changed by someone other than the viewer, since the viewer's own
// edits don't need to notify them, after the last time they opened the bell.
function unseenResponsibilityChanges(){
  if(!currentUser || !currentUser.isAdmin) return [];
  const seenAt = responsibilitySeenAt ? new Date(responsibilitySeenAt) : new Date(0);
  return responsibilityLog.filter(e => e.changedBy !== currentUser.name && new Date(e.at) > seenAt);
}
async function markResponsibilityNotificationsSeen(){
  responsibilitySeenAt = new Date().toISOString();
  await fsSet(FS_KEYS.responsibilitySeenAt, responsibilitySeenAt);
}

  document.getElementById("login-theme-toggle").onclick = () => { setTheme(getTheme() === "dark" ? "light" : "dark"); renderLogin(); };

  document.getElementById("mgr-login-btn").onclick = () => {
    const sel = document.getElementById("mgr-select");
    const pass = document.getElementById("mgr-pass").value;
    const user = users.find(u => u.id === sel.value);
    const errEl = document.getElementById("mgr-err");
    if(!user){ errEl.textContent = "Оберіть керуючого."; return; }
    if(pass !== user.password){ errEl.textContent = "Невірний пароль."; return; }
    currentUser = {id:user.id, name:`${user.name} — ${user.store}`, isAdmin:false, store:user.store};
    logLoginEvent({id:user.id, name:user.name, store:user.store, isAdmin:false});
    render();
  };
  document.getElementById("adm-login-btn").onclick = () => {
    const pass = document.getElementById("adm-pass").value;
    const errEl = document.getElementById("adm-err");
    if(pass !== adminPassword){ errEl.textContent = "Невірний пароль."; return; }
    currentUser = {id:"admin", name:"Адам · District Manager", isAdmin:true};
    logLoginEvent({id:"admin", name:"District Manager", isAdmin:true});
    render();
  };
  ["mgr-pass","adm-pass"].forEach(id=>{
    const inp = document.getElementById(id);
    if(inp) inp.addEventListener("keydown", e => { if(e.key==="Enter"){ document.getElementById(id==="mgr-pass"?"mgr-login-btn":"adm-login-btn").click(); } });
  });
}

// ================= APP SHELL =================

function render(){
  if(!currentUser){ renderLogin(); return; }
  if((activeTab === "activity" || activeTab === "telegram") && !currentUser.isAdmin) activeTab = "district";
  startPolling();
  const root = document.getElementById("root");
  root.innerHTML = `
    <header class="topbar">
      <div class="brand"><h1>Dashboard Kyiv 1</h1><span class="tag">KYIV-1 · ДІСТРИКТ</span></div>
      <div class="topbar-right">
        <nav class="tab-nav">
          <button class="tab-btn ${activeTab==='district'?'active':''}" data-tab="district">Магазини та ставки</button>
          <button class="tab-btn ${activeTab==='vacancies'?'active':''}" data-tab="vacancies">Вакансії</button>
          <button class="tab-btn ${activeTab==='zones'?'active':''}" data-tab="zones">Відповідальність</button>
          ${currentUser.isAdmin ? `<button class="tab-btn ${activeTab==='activity'?'active':''}" data-tab="activity">Активність</button>` : ""}
          ${currentUser.isAdmin ? `<button class="tab-btn ${activeTab==='telegram'?'active':''}" data-tab="telegram">🤖 Telegram-бот</button>` : ""}
        </nav>
        <span class="who">Увійшли як: <b>${escapeHtml(currentUser.name)}</b></span>
        ${currentUser.isAdmin ? `<button class="icon-btn-top" id="notif-btn" title="Зміни відповідальних, які ви ще не переглянули">🔔${unseenResponsibilityChanges().length ? `<span class="notif-badge">${unseenResponsibilityChanges().length}</span>` : ""}</button>` : ""}
        <button class="icon-btn-top" id="theme-toggle-btn" title="Перемкнути тему (день/ніч)">${getTheme() === "dark" ? "☀️ Світла" : "🌙 Темна"}</button>
        <button class="icon-btn-top" id="password-btn">Пароль</button>
        ${currentUser.isAdmin ? `<button class="icon-btn-top" id="admin-panel-btn">Адмін-панель</button>` : ""}
        <button class="icon-btn-top" id="logout-btn">Вийти</button>
      </div>
    </header>
    <main id="tab-content" class="tab-${activeTab}"></main>
    <div class="overlay" id="comments-overlay"></div>
    <div class="overlay" id="password-overlay"></div>
    <div class="overlay" id="notif-overlay"></div>
  `;
  document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => { activeTab = btn.dataset.tab; render(); }));
  document.getElementById("logout-btn").addEventListener("click", () => { currentUser = null; stopPolling(); render(); });
  document.getElementById("password-btn").addEventListener("click", () => { passwordModalOpen = true; openPasswordModal(); });
  document.getElementById("theme-toggle-btn").addEventListener("click", () => {
    setTheme(getTheme() === "dark" ? "light" : "dark");
    render();
  });
  const adminBtn = document.getElementById("admin-panel-btn");
  if(adminBtn) adminBtn.addEventListener("click", () => { adminPanelOpen = true; openAdminPanelModal(); });
  const notifBtn = document.getElementById("notif-btn");
  if(notifBtn) notifBtn.addEventListener("click", () => openNotifModal());

  if(activeTab === "district") renderDistrictTab();
  else if(activeTab === "vacancies") renderVacanciesTab();
  else if(activeTab === "activity") renderActivityTab();
  else if(activeTab === "telegram") renderTelegramTab();
  else renderZonesTab();
}

// ================= TAB 1: STORES =================

function renderDistrictTab(){
  const wrap = document.getElementById("tab-content");
  const withActual = stores.filter(s => s.actualStakes!=null);
  const baseSum = round2(stores.reduce((s,x)=>s+(x.baseStakes||0),0));
  const actualSum = round2(withActual.reduce((s,x)=>s+(x.actualStakes||0),0));
  const gap = withActual.length ? round2(actualSum - withActual.reduce((s,x)=>s+(x.baseStakes||0),0)) : null;
  const deficitCount = stores.filter(s => ["deficit","peopleWarning","peopleCritical"].includes(staffingStatus(s))).length;
  const withHc = stores.filter(s => s.actualHeadcount!=null);
  const totalHc = withHc.reduce((s,x)=>s+x.actualHeadcount,0);
  const disabilityCount = stores.filter(s => s.hasDisabilityEmployee===true).length;
  const cpdTotal = stores.reduce((s,x)=>s+(x.cpdCount||0),0);

  const {openByStore} = computeVacancyStoreStats();

  const ranked = stores
    .filter(s => s.actualStakes != null && s.baseStakes)
    .map(s => ({ s, pct: round2(s.actualStakes / s.baseStakes * 100) }))
    .sort((a,b) => b.pct - a.pct);
  const maxRankPct = ranked.length ? Math.max(...ranked.map(r => r.pct), 100) : 100;
  const top5Best = ranked.slice(0, 5);
  const top5Worst = ranked.slice(-5).reverse();
  const commented = stores.filter(s => s.comment && s.comment.trim());

  // Overall district-fulfillment gauge — actual/norm stakes across stores
  // that actually have data entered (same base as the ranked list's own %).
  const baseSumWithActual = round2(withActual.reduce((s,x)=>s+(x.baseStakes||0),0));
  const overallPct = baseSumWithActual > 0 ? round2(actualSum / baseSumWithActual * 100) : null;
  const overallColor = overallPct==null ? "var(--ink-soft)" : overallPct<95 ? "var(--red)" : overallPct>105 ? "var(--green)" : "var(--navy)";

  // Status distribution — what share of stores sit in each STATUS_META bucket
  // (the JYSK reference's "розподіл оцінок" bar, applied to укомплектованість
  // instead of a customer rating we don't track).
  const statusCounts = {};
  stores.forEach(s => { statusCounts[staffingStatus(s)] = (statusCounts[staffingStatus(s)]||0)+1; });
  const STATUS_ORDER = ["peopleCritical","peopleWarning","deficit","pending","ok","surplus"];
  const distRows = STATUS_ORDER.filter(st => statusCounts[st]).map(st => ({ count: statusCounts[st], meta: STATUS_META[st] }));

  // "Потребує уваги" — combines three signals this app already tracks
  // separately (staffing status, open vacancies, manager login silence)
  // into one ranked list, like the reference dashboard's multi-source
  // attention panel below its score cards. Worst staffing first, ties
  // broken by open vacancies then login silence.
  const managerByStore = {};
  users.forEach(u => { if(u.store) managerByStore[u.store] = u; });
  const rankByCode = {};
  ranked.forEach(r => { rankByCode[r.s.code] = r.pct; });
  const needsAttention = stores.map(s => {
    const st = staffingStatus(s);
    const staffingBad = ["peopleCritical","peopleWarning","deficit"].includes(st);
    const openVac = openByStore[s.code] || 0;
    const mgr = managerByStore[s.code];
    let loginBadge = null;
    if(mgr){
      const events = loginLog.filter(e => e.userId === mgr.id).sort((a,b) => new Date(b.at) - new Date(a.at));
      const last = events[0];
      if(!last) loginBadge = { text: "не заходив(ла)", bad: true };
      else {
        const da = daysAgo(last.at);
        loginBadge = da > 7 ? { text: `вхід ${da} дн. тому`, bad: true } : { text: da===0 ? "вхід сьогодні" : `вхід ${da} дн. тому`, bad: false };
      }
    }
    const flagged = staffingBad || openVac > 0 || (loginBadge && loginBadge.bad);
    return { s, pct: rankByCode[s.code] ?? null, meta: STATUS_META[st], staffingBad, openVac, loginBadge, flagged };
  }).filter(x => x.flagged)
    .sort((a,b) => {
      const score = (x) => (x.staffingBad?2:0) + (x.openVac>0?1:0) + (x.loginBadge && x.loginBadge.bad?1:0);
      return score(b) - score(a) || (a.pct ?? 999) - (b.pct ?? 999);
    });

  wrap.innerHTML = `
    ${heroBannerHtml("Магазини та ставки — стан укомплектованості дістрикту")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">НОРМА, СТАВОК</div><div class="val">${baseSum}</div></div>
      <div class="stat-card"><div class="lbl">ФАКТ ВВЕДЕНО ПО</div><div class="val">${withActual.length}<span class="unit">/ ${stores.length}</span></div></div>
      <div class="stat-card"><div class="lbl">ГАП, СТАВОК</div><div class="val" style="${gap!=null?`color:${gap<0?'var(--red)':gap>0?'var(--green)':''}`:''}">${gap==null?"—":(gap>0?`+${gap}`:gap)}</div></div>
      <div class="stat-card"><div class="lbl">МАГАЗИНІВ З ДЕФІЦИТОМ</div><div class="val" style="${deficitCount>0?'color:var(--red)':''}">${deficitCount}</div></div>
      <div class="stat-card"><div class="lbl">ВСЬОГО ПРАЦІВНИКІВ</div><div class="val">${withHc.length?totalHc:"—"}</div></div>
      <div class="stat-card"><div class="lbl">З ІНВАЛІДНІСТЮ, МАГАЗИНІВ</div><div class="val">${disabilityCount}</div></div>
      <div class="stat-card"><div class="lbl">ЦПХ, ОСІБ</div><div class="val">${cpdTotal}</div></div>
    </section>

    <section class="overview-row">
      ${overallPct!=null
        ? gaugeHtml(overallPct, overallColor, "Укомплектованість дістрикту", `${actualSum} / ${baseSumWithActual} ставок`, `дані введено по ${withActual.length}/${stores.length} магазинах`)
        : `<div class="tg-card gauge-card" style="margin-bottom:0;"><div class="gauge-info"><div class="lbl">Укомплектованість дістрикту</div><div class="val">—</div><div class="sub">ще немає введених фактичних даних</div></div></div>`}
      <div class="tg-card" style="margin-bottom:0;">
        <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл магазинів за статусом</div>
        ${distRows.map(({count, meta}) => `
          <div class="dist-bar-row">
            <div class="dist-bar-name">${escapeHtml(meta.label)}</div>
            <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(count/stores.length*100)}%;background:${meta.color};"></div></div>
            <div class="dist-bar-count">${count} · ${Math.round(count/stores.length*100)}%</div>
          </div>
        `).join("")}
      </div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">1</div><h2>Потребує уваги</h2>
        <div class="count ${needsAttention.length===0?'done':''}">${needsAttention.length===0?"без зауважень":`${needsAttention.length} ${pluralUA(needsAttention.length, "магазин", "магазини", "магазинів")}`}</div>
      </div>
      ${needsAttention.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Магазини з дефіцитом ставок, відкритими вакансіями або керуючим, який давно не заходив на сайт.</div>
        <div class="attn-list">
        ${needsAttention.map(x => `
          <div class="attn-row" style="--card-color:${x.meta.color};">
            <div class="attn-name">${escapeHtml(x.s.code)}${x.s.name ? ` · ${escapeHtml(x.s.name)}` : ""}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:${x.meta.color};border-color:${x.meta.color};background:#fff;">${escapeHtml(x.meta.label)}${x.pct!=null ? ` · ${x.pct}%` : ""}</span>
              <span class="attn-badge ${x.openVac>0 ? "bad" : ""}">${x.openVac>0 ? `вакансій: ${x.openVac}` : "вакансій немає"}</span>
              ${x.loginBadge ? `<span class="attn-badge ${x.loginBadge.bad ? "bad" : "good"}">${escapeHtml(x.loginBadge.text)}</span>` : ""}
            </div>
          </div>
        `).join("")}
        </div>
      ` : `<div class="empty-state">Наразі жоден магазин не потребує уваги.</div>`}
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">2</div><h2>Магазини дістрикту</h2>
        <div class="count" id="district-grid-count">${deficitCount===0?"без дефіциту":`${deficitCount} з дефіцитом`}</div>
      </div>
      <input class="text-field store-search" id="store-search" placeholder="Пошук магазину за кодом або назвою…" value="${escapeHtml(storeSearchQuery)}">
      <div class="cards-grid" id="cards-grid"></div>
    </section>
    ${ranked.length ? `
    <section class="category">
      <div class="category-head">
        <div class="cat-index">3</div><h2>Рейтинг укомплектованості</h2>
        <div class="count done">${ranked.length} магазинів</div>
      </div>
      <div class="tg-desc" style="margin-bottom:14px;">Факт до норми (ставки) — від найвищого показника до найнижчого.</div>
      ${ranked.map(({s,pct}) => `
        <div class="tg-bar-row">
          <div class="tg-bar-name">${escapeHtml(s.code)}${s.name ? ` · ${escapeHtml(s.name)}` : ""}</div>
          <div class="tg-bar-track"><div class="tg-bar-fill" style="width:${Math.min(100, Math.round(pct/maxRankPct*100))}%;background:${pct<95?'var(--red)':pct>105?'var(--green)':'var(--navy)'};"></div></div>
          <div class="tg-bar-count">${pct}%</div>
        </div>
      `).join("")}
      ${ranked.length >= 4 ? `
      <div class="top5-grid" style="margin-top:18px;">
        <div>
          <div class="top5-head best">ТОП-5 НАЙКРАЩИХ</div>
          ${top5Best.map(({s,pct}) => `<div class="top5-row"><span class="name">${escapeHtml(s.code)}<span class="code">${escapeHtml(s.name||"")}</span></span><span class="pct">${pct}%</span></div>`).join("")}
        </div>
        <div>
          <div class="top5-head worst">ТОП-5 · ПОТРЕБУЮТЬ УВАГИ</div>
          ${top5Worst.map(({s,pct}) => `<div class="top5-row"><span class="name">${escapeHtml(s.code)}<span class="code">${escapeHtml(s.name||"")}</span></span><span class="pct">${pct}%</span></div>`).join("")}
        </div>
      </div>` : ""}
    </section>` : ""}
    ${commented.length ? `
    <section class="category">
      <div class="category-head">
        <div class="cat-index">4</div><h2>Коментарі магазинів</h2>
        <div class="count done">${commented.length}</div>
      </div>
      <button class="reviews-toggle-btn" id="store-comments-toggle">${storeCommentsPanelOpen ? "Приховати коментарі" : "Показати коментарі"}</button>
      ${storeCommentsPanelOpen ? commented.map(s => `
        <div class="review-card">
          <div class="who">${escapeHtml(s.name||s.code)}<span class="code">${escapeHtml(s.code)}</span></div>
          <div class="txt">${escapeHtml(s.comment)}</div>
        </div>
      `).join("") : ""}
    </section>` : ""}
  `;
  renderDistrictStoreGrid();
  const searchInput = document.getElementById("store-search");
  if(searchInput) searchInput.addEventListener("input", () => { storeSearchQuery = searchInput.value; renderDistrictStoreGrid(); });
  const commentsToggle = document.getElementById("store-comments-toggle");
  if(commentsToggle) commentsToggle.addEventListener("click", () => { storeCommentsPanelOpen = !storeCommentsPanelOpen; renderDistrictTab(); });
}
// Re-renders just the cards grid (and its count badge) for the live
// store-search box, without touching the rest of the tab — a full
// renderDistrictTab() on every keystroke would replace the <input> itself
// and drop focus/cursor position mid-typing.
function renderDistrictStoreGrid(){
  const grid = document.getElementById("cards-grid");
  if(!grid) return;
  const {openByStore, oldestByStore} = computeVacancyStoreStats();
  const q = storeSearchQuery.trim().toLowerCase();
  const filtered = stores
    .map((s, idx) => ({ s, idx }))
    .filter(({s}) => !q || (s.code + " " + (s.name||"")).toLowerCase().includes(q));
  grid.innerHTML = filtered.length
    ? filtered.map(({s, idx}) => storeCardHtml(s, idx, openByStore[s.code]||0, oldestByStore[s.code])).join("")
    : `<div class="empty-state">Не знайдено жодного магазину за запитом «${escapeHtml(storeSearchQuery)}».</div>`;
  wireStoreCardEvents();
  const countEl = document.getElementById("district-grid-count");
  if(countEl){
    if(q) countEl.textContent = `${filtered.length} / ${stores.length} показано`;
    else {
      const deficitCount = stores.filter(s => ["deficit","peopleWarning","peopleCritical"].includes(staffingStatus(s))).length;
      countEl.textContent = deficitCount===0 ? "без дефіциту" : `${deficitCount} з дефіцитом`;
    }
  }
}

function storeCardHtml(s, idx, openVacCount, oldestOpenDays){
  const status = staffingStatus(s);
  const meta = STATUS_META[status];
  const gapStakes = s.actualStakes==null ? null : round2(s.actualStakes - (s.baseStakes||0));
  const gapHc = s.actualHeadcount==null ? null : round2(s.actualHeadcount - (s.baseHeadcount||0));
  const pct = (gapStakes===null || !s.baseStakes) ? null : round2(gapStakes / s.baseStakes * 100);
  const commentOpen = commentOpenFor === s.code;
  const hasComment = !!(s.comment && s.comment.trim());
  const overdueVac = openVacCount > 0 && oldestOpenDays > OVERDUE_DAYS;
  const canEdit = currentUser.isAdmin || s.code === currentUser.store;
  const ro = canEdit ? "" : "disabled";

  return `
    <div class="card" data-idx="${idx}" style="--card-color:${meta.color}">
      <div class="card-top">
        <div>
          <div class="code">${escapeHtml(s.code)}</div>
          ${s.name ? `<div class="sm-name" style="color:var(--ink-2);font-weight:600;">${escapeHtml(s.name)}</div>` : ""}
          ${!canEdit ? `<div class="meta">🔒 лише перегляд</div>` : ""}
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="status-pill">${meta.label}</span>
          <button class="icon-btn ${hasComment?'active':''}" data-action="toggle-comment" title="Коментар" ${!canEdit && !hasComment ? "disabled" : ""}>💬</button>
        </div>
      </div>
      ${commentOpen ? `<div class="comment-box">
        <textarea class="textarea" rows="3" data-field="comment" placeholder="Коментар до магазину…" ${ro}>${escapeHtml(s.comment)}</textarea>
        ${canEdit ? `<div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
          <button class="btn2 btn-navy" data-action="save-comment" style="padding:6px 14px;font-size:12px;">Зберегти коментар</button>
          <span class="meta save-comment-msg" style="color:var(--green);"></span>
        </div>` : ""}
      </div>` : ""}
      <table class="data-table">
        <thead><tr><th></th><th>Ставок</th><th>Людей</th></tr></thead>
        <tbody>
          <tr><td class="rlabel">Норма (базово)</td>
            <td><input class="num-field" data-field="baseStakes" placeholder="—" value="${s.baseStakes ?? ""}" ${ro} /></td>
            <td><input class="num-field" data-field="baseHeadcount" placeholder="—" value="${s.baseHeadcount ?? ""}" ${ro} /></td>
          </tr>
          <tr><td class="rlabel">Норма (сезон)</td>
            <td><input class="num-field" data-field="seasonStakes" placeholder="—" value="${s.seasonStakes ?? ""}" ${ro} /></td>
            <td><input class="num-field" data-field="seasonHeadcount" placeholder="—" value="${s.seasonHeadcount ?? ""}" ${ro} /></td>
          </tr>
          <tr><td class="rlabel emph">Фактично</td>
            <td><input class="num-field" data-field="actualStakes" placeholder="—" value="${s.actualStakes ?? ""}" ${ro} /></td>
            <td><input class="num-field" data-field="actualHeadcount" placeholder="—" value="${s.actualHeadcount ?? ""}" ${ro} /></td>
          </tr>
          <tr><td class="rlabel">Різниця</td>
            <td style="${gapStakes==null?'':`color:${gapStakes<0?'var(--red)':gapStakes>0?'var(--green)':''}`}">${gapStakes==null?"—":(gapStakes>0?`+${gapStakes}`:gapStakes)}</td>
            <td style="${gapHc==null?'':`color:${gapHc<0?'var(--red)':gapHc>0?'var(--green)':''}`}">${gapHc==null?"—":(gapHc>0?`+${gapHc}`:gapHc)}</td>
          </tr>
        </tbody>
      </table>
      ${pct!==null ? `
      <div class="progress-block">
        <div class="progress-head"><span class="lbl">ВІД НОРМИ</span><span class="val">${pct>0?"+":""}${pct}%</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.min(Math.abs(pct),100)}%;background:${pct<0?'var(--red)':'var(--green)'};${pct<0?'margin-left:auto;':''}"></div></div>
      </div>` : ""}
      <div class="resp-row">
        <div class="hr-line"><span class="hl">Відкриті вакансії</span><span class="vac-count ${overdueVac?'overdue':''}"><b>${openVacCount}</b>${openVacCount>0?` (${oldestOpenDays} дн.)`:""}</span></div>
        <div class="hr-line"><span class="hl">ЦПХ (к-сть)</span><input class="num-field" style="width:56px;" data-field="cpdCount" placeholder="—" value="${s.cpdCount ?? ""}" ${ro} /></div>
        <div class="hr-line"><span class="hl">Ризикованих (к-сть)</span><input class="num-field" style="width:56px;" data-field="riskyCount" placeholder="—" value="${s.riskyCount ?? ""}" ${ro} /></div>
        <div class="hr-line"><span class="hl">З інвалідністю</span>
          <div class="yn-toggle">
            <button class="yn-btn ${s.hasDisabilityEmployee===true?'active-yes':''}" data-action="disability-yes" ${ro}>Так</button>
            <button class="yn-btn ${s.hasDisabilityEmployee===false?'active-no':''}" data-action="disability-no" ${ro}>Ні</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function wireStoreCardEvents(){
  document.querySelectorAll('.card[data-idx]').forEach(card => {
    const idx = parseInt(card.dataset.idx, 10);
    const canEdit = currentUser.isAdmin || stores[idx].code === currentUser.store;
    card.querySelectorAll('input[data-field]').forEach(inp => {
      inp.addEventListener("change", () => {
        if(!canEdit) return;
        const field = inp.dataset.field;
        const isNum = inp.classList.contains("num-field");
        stores[idx][field] = isNum ? numOrNull(inp.value) : inp.value;
        persistStores();
        renderDistrictTab();
      });
    });
    const commentBtn = card.querySelector('[data-action="toggle-comment"]');
    if(commentBtn) commentBtn.addEventListener("click", () => { commentOpenFor = commentOpenFor === stores[idx].code ? null : stores[idx].code; renderDistrictTab(); });
    // Коментар навмисно НЕ зберігається по "change"/blur, як числові поля вище:
    // клік по кнопці "Зберегти" сам знімає фокус з textarea, а якщо той blur
    // одразу тригерить повний renderDistrictTab(), кнопка встигає зникнути з
    // DOM ще до того, як браузер довершить сам клік — і збереження виглядає
    // так, ніби нічого не відбулось. Тому єдиний шлях збереження коментаря —
    // явний клік, і він НЕ перерендерює картку (лише оновлює те, що
    // потребує оновлення: іконку 💬 і напис "Збережено").
    const saveCommentBtn = card.querySelector('[data-action="save-comment"]');
    if(saveCommentBtn) saveCommentBtn.addEventListener("click", () => {
      if(!canEdit) return;
      const ta = card.querySelector('textarea[data-field="comment"]');
      if(!ta) return;
      stores[idx].comment = ta.value;
      persistStores();
      if(commentBtn) commentBtn.classList.toggle("active", !!ta.value.trim());
      const msg = card.querySelector('.save-comment-msg');
      if(msg) msg.textContent = "Збережено ✓";
    });
    if(canEdit){
      const yesBtn = card.querySelector('[data-action="disability-yes"]');
      if(yesBtn) yesBtn.addEventListener("click", () => { stores[idx].hasDisabilityEmployee = true; persistStores(); renderDistrictTab(); });
      const noBtn = card.querySelector('[data-action="disability-no"]');
      if(noBtn) noBtn.addEventListener("click", () => { stores[idx].hasDisabilityEmployee = false; persistStores(); renderDistrictTab(); });
    }
  });
}

// ================= TAB 2: VACANCIES =================

function renderVacanciesTab(){
  const wrap = document.getElementById("tab-content");
  const withInfo = vacancies.map(v => ({v, d: vacancyInfo(v)}));
  const openCount = withInfo.filter(x => x.d.status === "open").length;
  const overdueCount = withInfo.filter(x => x.d.overdue).length;
  const filled = withInfo.filter(x => x.d.status === "filled" && x.d.timeToFill != null);
  const avgTtf = filled.length ? round2(filled.reduce((s,x)=>s+x.d.timeToFill,0)/filled.length) : null;
  const filtered = withInfo
    .filter(({d}) => vacFilter === "all" ? true : vacFilter === "open" ? d.status === "open" : d.status !== "open")
    .filter(({v}) => vacStoreFilter === "all" || v.storeCode === vacStoreFilter)
    .sort((a,b) => a.v.storeCode.localeCompare(b.v.storeCode));

  const openVacs = withInfo.filter(x => x.d.status === "open").map(x => x.v);
  const totalCandidates = openVacs.reduce((s,v) => s + (v.candidateCount||0), 0);
  const totalContacts = openVacs.reduce((s,v) => s + (v.openContacts||0), 0);
  const attentionCount = openVacs.filter(v => sourcingStatus(v).level === "attention").length;

  // "Потребує уваги" — open vacancies that are either overdue against the
  // team's own time-to-fill target, or flagged by the sourcing heuristic
  // (few candidates and few open contacts at once) — combines two signals
  // that otherwise only show up as small badges buried in the table below.
  const needsAttentionVacs = withInfo
    .filter(x => x.d.status === "open")
    .map(({v, d}) => ({ v, d, sourcing: sourcingStatus(v) }))
    .filter(x => x.d.overdue || x.sourcing.level === "attention")
    .sort((a,b) => (b.d.daysOpen||0) - (a.d.daysOpen||0));

  wrap.innerHTML = `
    ${heroBannerHtml("Вакансії дістрикту — пошук кандидатів і time-to-fill")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ВІДКРИТІ ВАКАНСІЇ</div><div class="val">${openCount}</div></div>
      <div class="stat-card"><div class="lbl">ПРОСТРОЧЕНО (&gt;${OVERDUE_DAYS} ДН.)</div><div class="val" style="${overdueCount>0?'color:var(--red)':''}">${overdueCount}</div></div>
      <div class="stat-card"><div class="lbl">СЕРЕДНІЙ TIME-TO-FILL</div><div class="val" style="${avgTtf!=null?`color:${avgTtf>OVERDUE_DAYS?'var(--red)':'var(--green)'}`:''}">${avgTtf ?? "—"}${avgTtf!=null?`<span class="unit">дн.</span>`:""}</div></div>
      <div class="stat-card"><div class="lbl">ЦІЛЬ TIME-TO-FILL</div><div class="val">${OVERDUE_DAYS}<span class="unit">дн.</span></div></div>
      <div class="stat-card"><div class="lbl">КАНДИДАТІВ (ВІДКРИТІ)</div><div class="val">${totalCandidates}</div></div>
      <div class="stat-card"><div class="lbl">ВІДКРИТИХ КОНТАКТІВ</div><div class="val">${totalContacts}</div></div>
      <div class="stat-card"><div class="lbl">ПОТРЕБУЮТЬ УВАГИ</div><div class="val" style="${attentionCount>0?'color:var(--red)':''}">${attentionCount}</div></div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">1</div><h2>Потребує уваги</h2>
        <div class="count ${needsAttentionVacs.length===0?'done':''}">${needsAttentionVacs.length===0?"без зауважень":`${needsAttentionVacs.length} ${pluralUA(needsAttentionVacs.length, "вакансія", "вакансії", "вакансій")}`}</div>
      </div>
      ${needsAttentionVacs.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Відкриті вакансії, що прострочили ціль по time-to-fill або мають мало кандидатів і контактів одночасно.</div>
        <div class="attn-list">
        ${needsAttentionVacs.map(({v, d, sourcing}) => `
          <div class="attn-row" style="--card-color:${d.overdue?'var(--red)':sourcing.color};">
            <div class="attn-name">${escapeHtml(v.storeCode)} · ${escapeHtml(v.position)}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:${d.overdue?'var(--red)':'var(--ink-soft)'};border-color:${d.overdue?'var(--red)':'var(--line)'};background:#fff;">${d.daysOpen} дн. відкрита${d.overdue?` · прострочено`:""}</span>
              <span class="attn-badge" style="color:${sourcing.color};border-color:${sourcing.border};background:#fff;">${escapeHtml(sourcing.label)}</span>
            </div>
          </div>
        `).join("")}
        </div>
      ` : `<div class="empty-state">Наразі жодна вакансія не потребує уваги.</div>`}
    </section>

    <div class="filter-row">
      <button class="filter-chip ${vacFilter==='all'?'active':''}" data-filter="all">Всі</button>
      <button class="filter-chip ${vacFilter==='open'?'active':''}" data-filter="open">Відкриті</button>
      <button class="filter-chip ${vacFilter==='closed'?'active':''}" data-filter="closed">Закриті</button>
      <select class="text-field" id="vac-store-filter" style="width:auto; margin-left:4px;">
        <option value="all">Всі магазини</option>
        ${stores.map(s => `<option value="${s.code}" ${vacStoreFilter===s.code?"selected":""}>${s.code}${s.sm ? " · " + escapeHtml(s.sm) : ""}</option>`).join("")}
      </select>
      <button class="btn2 btn-navy vac-add-btn" id="add-vacancy-btn">+ Додати вакансію</button>
    </div>
    ${!currentUser.isAdmin ? `<div class="meta" style="margin:-10px 0 12px;">🔒 Ви бачите всі вакансії дістрикту, але редагувати й додавати можете лише для магазину ${escapeHtml(currentUser.store)}.</div>` : ""}
    <div class="meta" style="margin:-8px 0 12px;">
      🟢 багато відкритих контактів — керуючий активно опрацьовує вакансію · 🟡 помірна активність · 🔴 мало кандидатів і мало контактів — потрібна увага
    </div>
    <div id="add-vacancy-form"></div>
    ${filtered.length === 0 ? `
      <div class="empty-state">${vacancies.length===0 ? "Ще немає жодної вакансії в дістрикті." : "Немає вакансій за цим фільтром."}</div>
    ` : `
      <div class="vac-table-wrap">
        <table class="vac-table">
          <thead><tr><th>Магазин</th><th>Зайнятість</th><th>Посада</th><th>Кандидати</th><th>Контакти</th><th>Пошук</th><th>Дата відкриття</th><th>Дата закриття</th><th>Ціль (${OVERDUE_DAYS} днів)</th><th></th></tr></thead>
          <tbody id="vac-tbody"></tbody>
        </table>
      </div>
    `}
  `;
  document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => { vacFilter = btn.dataset.filter; renderVacanciesTab(); }));
  const storeFilterSel = document.getElementById("vac-store-filter");
  if(storeFilterSel) storeFilterSel.addEventListener("change", () => { vacStoreFilter = storeFilterSel.value; renderVacanciesTab(); });
  const addBtn = document.getElementById("add-vacancy-btn");
  if(addBtn) addBtn.addEventListener("click", () => { addingVacancy = !addingVacancy; renderVacanciesTab(); if(addingVacancy) renderAddVacancyForm(); });
  if(addingVacancy) renderAddVacancyForm();
  const tbody = document.getElementById("vac-tbody");
  if(tbody){ tbody.innerHTML = filtered.map(({v}) => vacancyRowHtml(v)).join(""); wireVacancyRowEvents(); }
}

    if(hireStatus === "filled" && !hiredDate){ errEl.textContent = "Вкажіть дату закриття (найму)."; errEl.style.display="block"; return; }

      openedDate, hiredDate: hireStatus==="filled" ? hiredDate : null, hireStatus, responsiblePerson:null, priority:null,
      minorEmployeePresent:null, searchChannels:[], marketingPresence:"", ambassadorActions:"", comments:"", workUaContacts:null, workUaUpdatedAt:null,
      candidateCount:null, openContacts:null });
    persistVacancies(); addingVacancy = false; renderVacanciesTab();
  });
}

function vacancyRowHtml(v){
  const info = vacancyInfo(v);
  const statusMeta = HIRE_STATUS[v.hireStatus || "open"];
  const store = stores.find(s => s.code === v.storeCode);
  const rowColor = info.overdue ? "var(--red)" : statusMeta.color;
  const expanded = expandedVacancy === v.id;
  const canEdit = currentUser.isAdmin || v.storeCode === currentUser.store;
  const ro = canEdit ? "" : "disabled";
  const src = sourcingStatus(v);
  let targetCell = `<span class="target-muted">—</span>`;
  if(v.hireStatus === "filled"){
    targetCell = info.timeToFill != null
      ? `<span class="${info.timeToFill>OVERDUE_DAYS?'overdue-flag':'target-ok'}">${info.timeToFill} дн. <span class="target-muted">(ціль ${OVERDUE_DAYS})</span></span>`
      : `<span class="overdue-flag">вкажіть дату</span>`;
  } else if(v.hireStatus === "open" || !v.hireStatus){
    targetCell = `<span class="${info.overdue?'overdue-flag':'target-muted'}">${info.daysOpen} дн. ${info.overdue?"· прострочено":`(ціль ${OVERDUE_DAYS})`}</span>`;
  }
  const mainRow = `
    <tr class="vac-row" data-id="${v.id}" style="--row-color:${rowColor}">
      <td class="vac-td vac-td--store"><span class="vac-code">${escapeHtml(v.storeCode)}</span>${store ? `<span class="vac-sm">${escapeHtml(store.sm)}</span>` : ""}</td>
      <td class="vac-td vac-td--center">${v.employmentShare ?? "—"} ставки</td>
      <td class="vac-td vac-td--center"><span class="vac-position">${escapeHtml(v.position||"—")}</span></td>
      <td class="vac-td vac-td--center"><input type="text" inputMode="numeric" class="num-field" style="width:52px;" data-vac-field="candidateCount" placeholder="—" value="${v.candidateCount ?? ""}" ${ro} /></td>
      <td class="vac-td vac-td--center"><input type="text" inputMode="numeric" class="num-field" style="width:52px;" data-vac-field="openContacts" placeholder="—" value="${v.openContacts ?? ""}" ${ro} /></td>
      <td class="vac-td vac-td--center"><span class="activity-badge" style="color:${src.color};background:#fff;border:1px solid ${src.border};">${src.label}</span></td>
      <td class="vac-td vac-td--center"><input type="date" class="date-input-inline" data-vac-field="openedDate" value="${v.openedDate||""}" ${ro} /></td>
      <td class="vac-td vac-td--center">
        <select class="status-select" data-vac-field="hireStatus" style="color:${statusMeta.color}" ${ro}>
          ${Object.entries(HIRE_STATUS).map(([k,m]) => `<option value="${k}" ${v.hireStatus===k?"selected":""}>${m.label}</option>`).join("")}
        </select>
        ${v.hireStatus === "filled" ? `<input type="date" class="date-input-inline" data-vac-field="hiredDate" value="${v.hiredDate||""}" style="margin-top:4px;display:block;" ${ro} />` : ""}
      </td>
      <td class="vac-td vac-td--center">${targetCell}</td>
      <td class="vac-td vac-td--actions">${canEdit ? `<button class="icon-btn" data-action="delete" title="Видалити">✕</button>` : ""}<button class="icon-btn" data-action="expand" title="Деталі">${expanded ? "▲" : "▼"}</button></td>
    </tr>`;
  const detailRow = expanded ? `
    <tr class="vac-detail-row"><td class="vac-td vac-detail-td" colspan="10">
      <div class="vac-expanded-grid">
        <div><span class="exp-label">Відповідальний:</span><select class="text-field" data-vac-field="responsiblePerson" ${ro}><option value="">—</option>${RESPONSIBLE_OPTIONS.map(r => `<option value="${r}" ${v.responsiblePerson===r?"selected":""}>${r}</option>`).join("")}</select></div>
        <div><span class="exp-label">Пріоритет:</span><select class="text-field" data-vac-field="priority" ${ro}><option value="">—</option><option value="1" ${v.priority==1?"selected":""}>1</option><option value="2" ${v.priority==2?"selected":""}>2</option><option value="3" ${v.priority==3?"selected":""}>3</option></select></div>
        <div><span class="exp-label">Неповнолітніх:</span> ${v.minorEmployeePresent ?? "—"}</div>
        <div><span class="exp-label">Маркетинг:</span> ${escapeHtml(v.marketingPresence||"—")}</div>
      </div>
      <div style="margin-top:10px;"><span class="exp-label">Коментар:</span><textarea class="textarea" rows="2" data-vac-field="comments" placeholder="—" ${ro}>${escapeHtml(v.comments||"")}</textarea></div>
    </td></tr>` : "";
  return mainRow + detailRow;
}

function wireVacancyRowEvents(){
  document.querySelectorAll('.vac-row').forEach(row => {
    const id = row.dataset.id;
    const v0 = vacancies.find(x => x.id === id);
    const canEdit = v0 && (currentUser.isAdmin || v0.storeCode === currentUser.store);
    row.querySelectorAll('[data-vac-field]').forEach(inp => {
      inp.addEventListener("change", () => {
        if(!canEdit) return;
        const v = vacancies.find(x => x.id === id); if(!v) return;
        const field = inp.dataset.vacField;
        if(field === "candidateCount" || field === "openContacts"){
          v[field] = numOrNull(inp.value);
        } else {
          v[field] = inp.value || (field==="hiredDate"?null:inp.value);
        }
        persistVacancies(); renderVacanciesTab();
      });
    });
    const delBtn = row.querySelector('[data-action="delete"]');
    if(delBtn && canEdit) delBtn.addEventListener("click", () => { vacancies = vacancies.filter(v => v.id !== id); persistVacancies(); renderVacanciesTab(); });
    const expBtn = row.querySelector('[data-action="expand"]');
    if(expBtn) expBtn.addEventListener("click", () => { expandedVacancy = expandedVacancy === id ? null : id; renderVacanciesTab(); });
  });
  document.querySelectorAll('.vac-detail-row [data-vac-field]').forEach(inp => {
    inp.addEventListener("change", () => {
      const tr = inp.closest("tr").previousElementSibling;
      const id = tr ? tr.dataset.id : null; if(!id) return;
      const v = vacancies.find(x => x.id === id); if(!v) return;
      if(!(currentUser.isAdmin || v.storeCode === currentUser.store)) return;
      const field = inp.dataset.vacField;
      v[field] = field === "priority" ? (inp.value===""?null:Number(inp.value)) : inp.value;
      persistVacancies();
    });
  });
}

// ================= TAB 3: ВІДПОВІДАЛЬНІСТЬ (zones) =================

function renderZonesTab(){
  const wrap = document.getElementById("tab-content");
  const filledCount = zones.filter(z => z.responsibles && z.responsibles.length > 0).length;
  const zonesTotal = zones.length || 1; // guards the % math below if zones is ever empty
  const unfilledCount = zones.length - filledCount;
  const avgProgress = zones.length ? Math.round(zones.reduce((s,z)=>s+(Number.isFinite(z.progress)?z.progress:0),0)/zones.length) : 0;
  const avgColor = avgProgress < 40 ? "var(--red)" : avgProgress < 70 ? "var(--amber)" : "var(--green)";

  // "Потребує уваги" — zones with no responsible assigned at all, or with
  // a responsible but very low progress; unassigned zones sort first since
  // that's the more fundamental gap.
  const needsAttentionZones = zones
    .map(z => ({ z, hasResp: !!(z.responsibles && z.responsibles.length > 0), progress: Number.isFinite(z.progress) ? z.progress : 0 }))
    .filter(x => !x.hasResp || x.progress < 40)
    .sort((a,b) => (a.hasResp === b.hasResp) ? a.progress - b.progress : (a.hasResp ? 1 : -1));

  wrap.innerHTML = `
    ${heroBannerHtml("Відповідальність — зони амбасадорів дістрикту")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ПРИЗНАЧЕНО ЗОН</div><div class="val">${filledCount}<span class="unit">/ ${zones.length}</span></div></div>
      <div class="stat-card"><div class="lbl">КАТЕГОРІЙ</div><div class="val">${CATEGORIES.length}</div></div>
      <div class="stat-card"><div class="lbl">КОМЕНТАРІВ ВСЬОГО</div><div class="val">${zones.reduce((s,z)=>s+(z.comments||[]).length,0)}</div></div>
    </section>
    <section class="overview-row">
      ${gaugeHtml(avgProgress, avgColor, "Середній прогрес по зонах", `${avgProgress}% в середньому`, `${filledCount}/${zones.length} зон із призначеним відповідальним`)}
      <div class="tg-card" style="margin-bottom:0;">
        <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл зон за призначенням</div>
        <div class="dist-bar-row">
          <div class="dist-bar-name">Призначено</div>
          <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(filledCount/zonesTotal*100)}%;background:var(--green);"></div></div>
          <div class="dist-bar-count">${filledCount} · ${Math.round(filledCount/zonesTotal*100)}%</div>
        </div>
        <div class="dist-bar-row">
          <div class="dist-bar-name">Не призначено</div>
          <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(unfilledCount/zonesTotal*100)}%;background:var(--red);"></div></div>
          <div class="dist-bar-count">${unfilledCount} · ${Math.round(unfilledCount/zonesTotal*100)}%</div>
        </div>
      </div>
    </section>

    <section class="category">
      <div class="category-head">
        <div class="cat-index">1</div><h2>Потребує уваги</h2>
        <div class="count ${needsAttentionZones.length===0?'done':''}">${needsAttentionZones.length===0?"без зауважень":`${needsAttentionZones.length} ${pluralUA(needsAttentionZones.length, "зона", "зони", "зон")}`}</div>
      </div>
      ${needsAttentionZones.length ? `
        <div class="tg-desc" style="margin-bottom:6px;">Зони без призначеного відповідального або з прогресом нижче 40%.</div>
        <div class="attn-list">
        ${needsAttentionZones.map(({z, hasResp, progress}) => { const progColor = progress<40?'var(--red)':progress<70?'var(--amber)':'var(--green)'; return `
          <div class="attn-row" style="--card-color:${hasResp?progColor:'var(--red)'};">
            <div class="attn-name">${escapeHtml(z.title)}</div>
            <div class="attn-badges">
              <span class="attn-badge" style="color:${hasResp?'var(--green)':'var(--red)'};border-color:${hasResp?'var(--green)':'var(--red)'};background:#fff;">${hasResp?"Призначено":"Не призначено"}</span>
              <span class="attn-badge attn-badge-progress">
                <span class="mini-bar"><span class="mini-bar-fill" style="width:${progress}%;background:${progColor};"></span></span>
                <span>${progress}%</span>
              </span>
            </div>
          </div>
        `; }).join("")}
        </div>
      ` : `<div class="empty-state">Наразі жодна зона не потребує уваги.</div>`}
    </section>

    <div id="zones-root"></div>
  `;
  const zonesRoot = document.getElementById("zones-root");
  CATEGORIES.forEach((cat, catIdx) => {
    const items = zones.filter(z => z.cat === cat);
    if(items.length === 0) return;
    const catFilled = items.filter(z => z.responsibles && z.responsibles.length > 0).length;
    const catDone = catFilled === items.length;
    const section = document.createElement("div");
    section.className = "category";
    section.innerHTML = `
      <div class="category-head">
        <span class="cat-index">${String(catIdx+1).padStart(2,"0")}</span>
        <h2>${escapeHtml(cat)}</h2>
        <span class="count ${catDone?'done':''}">${catFilled}/${items.length}</span>
      </div>
      <div class="cards-grid">${items.map(z => zoneCardHtml(z)).join("")}</div>
    `;
    zonesRoot.appendChild(section);
  });
  wireZoneEvents();
}

function zoneCardHtml(z){
  const list = (z.responsibles || []).filter(Boolean);
  const hasResp = list.length > 0;
  const commentCount = (z.comments || []).length;
  const progress = Number.isFinite(z.progress) ? z.progress : 0;
  return `
    <div class="card" data-zone-id="${z.id}" style="--card-color:${hasResp?'var(--green)':'var(--red)'}">
      <div class="card-top"><div><h3>${escapeHtml(z.title)}</h3>${z.sub ? `<div class="meta">${escapeHtml(z.sub)}</div>` : ""}</div></div>
      <p class="goal">${escapeHtml(z.goal)}</p>
      <div class="progress-block">
        <div class="progress-head">
          <span class="lbl">Прогрес</span>
          <span style="display:flex;align-items:center;gap:6px;">
            <span class="val" id="progress-val-${z.id}">${progress}%</span>
            <button class="icon-btn" data-unlock-id="${z.id}" title="Розблокувати повзунок для редагування">🔓</button>
          </span>
        </div>
        <input type="range" min="0" max="100" value="${progress}" data-progress-id="${z.id}" style="--pct:${progress}%" disabled />
      </div>
      <div class="resp-row">
        <div class="resp-label">${list.length > 1 ? "Відповідальні" : "Відповідальний"}</div>
        ${hasResp ? list.map(n => `<div class="resp-name"><span class="dot"></span>${escapeHtml(n)}</div>`).join("") : `<div class="resp-name empty"><span class="dot"></span>Не призначено</div>`}
        ${z.lastEditedBy ? `<div class="meta">оновив: ${escapeHtml(z.lastEditedBy)}</div>` : ""}
      </div>
      <div class="card-actions">
        <button class="edit-link" data-assign-id="${z.id}">Призначити →</button>
        <button class="comments-btn" data-comments-id="${z.id}">Коментарі${commentCount ? `<span class="count">${commentCount}</span>` : ""}</button>
      </div>
    </div>
  `;
}

function wireZoneEvents(){
  document.querySelectorAll('[data-assign-id]').forEach(btn => {
    btn.addEventListener("click", () => {
      const z = zones.find(x => x.id === btn.dataset.assignId);
      if(!z) return;
      const current = (z.responsibles||[]).join(", ");
      const val = window.prompt(`Відповідальний(і) за "${z.title}" (через кому, напр. "Ім'я — J104"):`, current);
      if(val === null) return;
      const oldList = (z.responsibles || []).slice();
      z.responsibles = val.split(",").map(s=>s.trim()).filter(Boolean).slice(0,3);
      z.lastEditedBy = currentUser.name;
      z.lastEditedAt = new Date().toISOString();
      persistZones();
      // Notify the District Manager (bell icon) whenever the assignment
      // actually changes — but not when they're the one changing it.
      if(JSON.stringify(oldList) !== JSON.stringify(z.responsibles)) logResponsibilityChange(z, oldList, z.responsibles);
      renderZonesTab();
    });
  });
  document.querySelectorAll('[data-comments-id]').forEach(btn => {
    btn.addEventListener("click", () => { commentsModalZoneId = btn.dataset.commentsId; openCommentsModal(); });
  });
  // The slider starts `disabled` (see zoneCardHtml) so it can't be nudged by
  // a stray click, scroll-wheel-while-hovering, or touch-scroll gesture —
  // it only becomes draggable after an explicit unlock click, and re-locks
  // itself the moment a drag commits, so each change takes a deliberate
  // unlock + drag, never an accidental one.
  document.querySelectorAll('[data-unlock-id]').forEach(btn => {
    btn.addEventListener("click", () => {
      const inp = document.querySelector(`input[data-progress-id="${btn.dataset.unlockId}"]`);
      if(!inp) return;
      inp.disabled = false;
      inp.focus();
    });
  });
  document.querySelectorAll('input[type=range][data-progress-id]').forEach(inp => {
    inp.addEventListener("input", () => {
      inp.style.setProperty("--pct", inp.value + "%");
      const lbl = document.getElementById("progress-val-" + inp.dataset.progressId);
      if(lbl) lbl.textContent = inp.value + "%";
    });
    inp.addEventListener("change", () => {
      const z = zones.find(x => x.id === inp.dataset.progressId);
      if(!z) return;
      z.progress = Number(inp.value);
      persistZones();
      inp.disabled = true;
    });
  });
}

// ================= TAB 4: АКТИВНІСТЬ (District Manager only) =================

function daysAgo(iso){ return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }

function renderActivityTab(){
  const wrap = document.getElementById("tab-content");
  const managerEvents = loginLog.filter(e => !e.isAdmin);
  const now = Date.now();
  const in7d = (iso) => (now - new Date(iso).getTime()) <= 7*86400000;
  const in30d = (iso) => (now - new Date(iso).getTime()) <= 30*86400000;

  const perUser = users.map(u => {
    const events = managerEvents.filter(e => e.userId === u.id).sort((a,b) => new Date(b.at) - new Date(a.at));
    const last = events[0] || null;
    return {
      user: u,
      total: events.length,
      last7: events.filter(e => in7d(e.at)).length,
      last30: events.filter(e => in30d(e.at)).length,
      lastAt: last ? last.at : null,
    };
  }).sort((a,b) => (b.lastAt ? new Date(b.lastAt) : 0) - (a.lastAt ? new Date(a.lastAt) : 0));

  const neverCount = perUser.filter(p => p.total === 0).length;
  const silent7dCount = perUser.filter(p => p.total > 0 && p.last7 === 0).length;
  const activeTodayCount = perUser.filter(p => p.lastAt && daysAgo(p.lastAt) === 0).length;
  const totalLogins = managerEvents.length;

  const recent = loginLog.slice().sort((a,b) => new Date(b.at) - new Date(a.at)).slice(0, 15);
  const regularCount = perUser.length - neverCount - silent7dCount;
  const perUserTotal = perUser.length || 1; // guards the % math below if the users list is ever empty

  const activityBadgeInfo = (p) => {
    if(p.total === 0) return { label: "Ще не заходив(ла)", color: "var(--red)" };
    if(p.last7 === 0) return { label: "Мовчить >7 днів", color: "var(--amber)" };
    return { label: "Регулярно заходить", color: "var(--green)" };
  };
  // "Потребує уваги" — managers who never logged in or have gone quiet for
  // over a week, pulled out of the full table below so they're scannable
  // at a glance instead of buried among everyone who logs in normally.
  const needsAttentionUsers = perUser
    .filter(p => p.total === 0 || p.last7 === 0)
    .sort((a,b) => (a.total === 0 ? 0 : 1) - (b.total === 0 ? 0 : 1));

  wrap.innerHTML = `
    ${heroBannerHtml("Активність керуючих — входи на сайт")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ВСЬОГО ВХОДІВ КЕРУЮЧИХ</div><div class="val">${totalLogins}</div></div>
      <div class="stat-card"><div class="lbl">АКТИВНІ СЬОГОДНІ</div><div class="val" style="${activeTodayCount>0?'color:var(--green)':''}">${activeTodayCount}<span class="unit">/ ${users.length}</span></div></div>
      <div class="stat-card"><div class="lbl">МОВЧАТЬ &gt;7 ДНІВ</div><div class="val" style="${silent7dCount>0?'color:var(--amber)':''}">${silent7dCount}</div></div>
      <div class="stat-card"><div class="lbl">ЖОДНОГО ВХОДУ</div><div class="val" style="${neverCount>0?'color:var(--red)':''}">${neverCount}</div></div>
    </section>

    <div class="tg-card">
      <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл керуючих за відвідуваністю</div>
      <div class="dist-bar-row">
        <div class="dist-bar-name">Регулярно заходить</div>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(regularCount/perUserTotal*100)}%;background:var(--green);"></div></div>
        <div class="dist-bar-count">${regularCount} · ${Math.round(regularCount/perUserTotal*100)}%</div>
      </div>
      <div class="dist-bar-row">
        <div class="dist-bar-name">Мовчить &gt;7 днів</div>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(silent7dCount/perUserTotal*100)}%;background:var(--amber);"></div></div>
        <div class="dist-bar-count">${silent7dCount} · ${Math.round(silent7dCount/perUserTotal*100)}%</div>
      </div>

function tgKyivNow() {

    hour: "2-digit", minute: "2-digit", hour12: false,

function tgRoundTo5(hhmm) {
  const [hh, mm] = hhmm.split(":").map(Number);
  const rounded = Math.round((hh * 60 + mm) / 5) * 5;
  const h = Math.floor((rounded % 1440) / 60), m = rounded % 60;

}

// ---- overview ----
function tgStatsTotals(days) {
  const totals = {};
  const base = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(base); d.setUTCDate(d.getUTCDate() - i);
    const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit" });
    const parts = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
    const key = `${parts.year}-${parts.month}-${parts.day}`;
    const day = (tgChatState.stats && tgChatState.stats[key]) || {};
    for (const [uid, count] of Object.entries(day)) totals[uid] = (totals[uid] || 0) + count;
  }
  return totals;
}
// Sums every day the bot has ever recorded for this chat — "увесь час".
function tgStatsTotalsAll() {
  const totals = {};
  for (const day of Object.values(tgChatState.stats || {})) {
    for (const [uid, count] of Object.entries(day)) totals[uid] = (totals[uid] || 0) + count;
  }
  return totals;
}
const TG_STATS_PERIODS = {
  week: { label: "7 днів", totals: () => tgStatsTotals(7) },
  month: { label: "30 днів", totals: () => tgStatsTotals(30) },
  all: { label: "увесь час", totals: () => tgStatsTotalsAll() },
};
// Groups a {uid: count} totals map by the store each uid is linked to
// (tgChatState.storeMembers, learned from captions/replies or filled in by
// hand — see the kyiv1-daily-check skill) — so the leaderboard reflects the
// district's actual store structure instead of one flat, capped ranking
// that only happens to surface whoever posts the most overall. Everyone
// with at least one message in the period is included, not just a top N;
// people not yet linked to a store fall into a separate "Без магазину" group
// rather than being silently dropped.
function tgActivityByStore(periodTotals) {
  const storeMembers = tgChatState.storeMembers || {};
  const names = tgChatState.names || {};
  const byStore = {};
  const unassigned = [];
  for (const [uid, count] of Object.entries(periodTotals)) {
    const entry = { uid, name: names[uid] || uid, count };
    const code = storeMembers[uid];
    if (code) {
      if (!byStore[code]) byStore[code] = { store: stores.find(s => s.code === code) || { code, name: "" }, members: [], total: 0 };
      byStore[code].members.push(entry);
      byStore[code].total += count;
    } else {
      unassigned.push(entry);
    }
  }
  for (const g of Object.values(byStore)) g.members.sort((a, b) => b.count - a.count);
  unassigned.sort((a, b) => b.count - a.count);
  const groups = Object.values(byStore).sort((a, b) => b.total - a.total);
  return { groups, unassigned };
}
