// Ті самі обчислення, що вже є в renderKpiBenchmarkCard (рейтинг, динаміка,
// топ/антитоп), просто у вигляді короткого тексту для автопідсумку.
function kpiAutoSummaryBenchmark(r, prevEntry){
  const dirMul = r.goodDirection === "low" ? 1 : -1;
  const byGoodness = (a, b) => {
    if(a.value == null && b.value == null) return 0;
    if(a.value == null) return 1;
    if(b.value == null) return -1;
    return (a.value - b.value) * dirMul;
  };
  const districts = [...r.districts].sort(byGoodness);
  const ownStores = r.ownStores.filter(s => s.value != null).sort(byGoodness);
  const ownRank = districts.findIndex(d => d.name === r.ownDistrictName) + 1;
  const ownValue = ownRank > 0 ? districts[ownRank - 1].value : null;
  const parts = [];
  parts.push(ownRank > 0
    ? `${r.ownDistrictName} — ${ownRank} місце з ${districts.length} (${ownValue}${r.unit}, мережа ${r.networkAvg}${r.unit}).`
    : `${r.ownDistrictName} відсутній у рейтингу дистриктів цього звіту.`);
  if(prevEntry && ownValue != null){
    const prevOwn = prevEntry.districts.find(d => d.name === r.ownDistrictName)?.value;
    if(prevOwn != null){
      const delta = Math.round((ownValue - prevOwn) * 100) / 100;
      if(Math.abs(delta) < 0.005) parts.push("Без змін проти попереднього завантаження.");
      else{
        const improved = r.goodDirection === "low" ? delta < 0 : delta > 0;
        parts.push(`${improved ? "Покращення" : "Погіршення"} проти попереднього завантаження: ${delta > 0 ? "+" : ""}${delta}${r.unit}.`);
      }
    }
  }
  if(ownStores.length){
    const bestStore = ownStores[0], worstStore = ownStores[ownStores.length - 1];
    parts.push(bestStore !== worstStore
      ? `Найкращий магазин — ${bestStore.name} (${bestStore.value}${r.unit}), потребує уваги — ${worstStore.name} (${worstStore.value}${r.unit}).`
      : `Магазин: ${bestStore.name} (${bestStore.value}${r.unit}).`);
  }
  const ownInTopBest = (r.topBest || []).find(s => s.district === r.ownDistrictName);
  const ownInTopWorst = (r.topWorst || []).find(s => s.district === r.ownDistrictName);
  if(ownInTopBest) parts.push(`${ownInTopBest.name} — у ТОП-10 найкращих по мережі.`);
  if(ownInTopWorst) parts.push(`${ownInTopWorst.name} — у ТОП-10, що потребують уваги по мережі.`);
  if(r.ownStoresInDistrict && r.ownStores.length < r.ownStoresInDistrict){
    parts.push(`Дані лише по ${r.ownStores.length} із ${r.ownStoresInDistrict} магазинів дістрикту.`);
  }
  return parts.join(" ");
}

function kpiAutoSummaryClearance(r){
  const stores = [...r.stores].sort((a,b) => b.share - a.share); // найбільша частка залишків — перша
  const parts = [];
  parts.push(`Частка залишків по дістрикту — ${r.currentShare}%, зміна за тиждень ${r.weekChange > 0 ? "+" : ""}${r.weekChange}%.`);
  if(stores.length > 1){
    const worst = stores[0], best = stores[stores.length - 1];
    parts.push(`Найбільше залишків — ${worst.name} (${worst.share}%), найменше — ${best.name} (${best.share}%).`);
  }
  if(r.growthCount > 0) parts.push(`${r.growthCount} із ${r.storesInScope} магазинів зі зростанням залишків за тиждень.`);
  if(r.storesInScope < r.storesInDistrict) parts.push(`Дані лише по ${r.storesInScope} із ${r.storesInDistrict} магазинів дістрикту.`);
  return parts.join(" ");
}

function kpiAutoSummaryClickCollect(r, prevEntry){
  const summarizeMetric = (label, metric, prevMetric, target) => {
    const districts = [...metric.districts].sort((a,b) => b.value - a.value);
    const ownRank = districts.findIndex(d => d.name === r.ownDistrictName) + 1;
    const ownValue = ownRank > 0 ? districts[ownRank - 1].value : null;
    if(ownValue == null) return `${label}: дані по «${r.ownDistrictName}» відсутні.`;
    let s = `${label}: ${ownValue}% — ${ownRank} місце з ${districts.length}`;
    s += target != null ? (ownValue >= target ? `, ціль ${target}% виконано.` : `, нижче цілі ${target}%.`) : ".";
    if(prevMetric){
      const prevOwn = prevMetric.districts.find(d => d.name === r.ownDistrictName)?.value;
      if(prevOwn != null){
        const delta = Math.round((ownValue - prevOwn) * 100) / 100;
        if(Math.abs(delta) >= 0.005) s += ` ${delta > 0 ? "▲" : "▼"}${Math.abs(delta)} проти попереднього завантаження.`;
      }
    }
    return s;
  };
  return [
    summarizeMetric("Вчасне підтвердження", r.onTime, prevEntry?.onTime, 98),
    summarizeMetric("Додатковий товар", r.attachment, prevEntry?.attachment, null),
  ].join(" ");
}

// ---- "Динаміка по магазину" — a trend chart across every period of a
// report, for one selected store (dataviz skill: change-over-time = a
// line chart; single series needs no legend; label the endpoints/extremes,
// not every point; hairline gridlines; a 2px line with a surface-ringed
// end-dot). Adam asked for this on every "Звіти та показники" switcher
// that actually accumulates period history (the six below) — "Швидкі
// показники" has no store dimension (free-form district numbers) and
// "Доставки" is its own monthly-cost data shape, so neither gets one.
function kpiTrendSvg(points, unit, goodDirection){
  const have = points.map((p,i) => ({...p, i})).filter(p => p.value != null);
  if(have.length < 2) return null;
  const w = 640, h = 170, padL = 44, padR = 14, padT = 16, padB = 24;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  const vals = have.map(p => p.value);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(lo === hi){ const bump = Math.max(1, Math.abs(lo) * 0.1); lo -= bump; hi += bump; }
  const span = hi - lo, pad = span * 0.12;
  lo -= pad; hi += pad;
  const n = points.length;
  const x = i => n === 1 ? padL + plotW / 2 : padL + (i / (n - 1)) * plotW;
  const y = v => padT + plotH - ((v - lo) / (hi - lo)) * plotH;

  const first = have[0].value, last = have[have.length - 1].value;
  const flat = Math.abs(last - first) < 0.005;
  const improved = goodDirection === "low" ? last < first : last > first;
  const lineColor = flat ? "var(--ink-soft)" : (improved ? "var(--green)" : "var(--red)");

  let lineD = "";
  have.forEach((p, k) => { lineD += (k === 0 ? "M" : "L") + x(p.i).toFixed(1) + "," + y(p.value).toFixed(1) + " "; });
  const areaD = `${lineD}L${x(have[have.length-1].i).toFixed(1)},${(padT+plotH).toFixed(1)} L${x(have[0].i).toFixed(1)},${(padT+plotH).toFixed(1)} Z`;

  const gridVals = [lo + span*0.12 + pad, lo + (hi-lo)/2, hi - span*0.12 - pad]; // ~min/mid/max of the real (unpadded) data range
  const fmtVal = v => Math.round(v*100)/100;

  const dots = have.map((p,k) => {
    const isEdge = k === 0 || k === have.length-1;
    return `
      <circle cx="${x(p.i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="4" fill="${lineColor}" stroke="var(--paper-2)" stroke-width="2">
        <title>${escapeHtml(p.period)}: ${fmtVal(p.value)}${unit}</title>
      </circle>
      ${isEdge ? `<text x="${x(p.i).toFixed(1)}" y="${(y(p.value) - 10).toFixed(1)}" text-anchor="${k===0?"start":"end"}" font-size="11" font-weight="700" fill="var(--ink-2)">${fmtVal(p.value)}${unit}</text>` : ""}
    `;
  }).join("");

  const shortLabel = s => { s = String(s||""); return s.length>12 ? s.slice(0,11)+"…" : s; };
  const xLabels = points.map((p,i) => `<text x="${x(i).toFixed(1)}" y="${h-6}" text-anchor="middle" font-size="9.5" fill="var(--ink-soft)">${escapeHtml(shortLabel(p.period))}</text>`).join("");

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block;overflow:visible;" role="img" aria-label="Динаміка по магазину">
      ${gridVals.map(v => `<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${w-padR}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${padL-6}" y="${(y(v)+3).toFixed(1)}" text-anchor="end" font-size="9.5" fill="var(--ink-soft)">${fmtVal(v)}${unit}</text>`).join("")}
      <path d="${areaD}" fill="${lineColor}" fill-opacity="0.1" stroke="none"/>
      <path d="${lineD}" fill="none" stroke="${lineColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${xLabels}
    </svg>
  `;
}

// metrics: [{label, unit, goodDirection, storesOf(entry)->[{code,name,value}]}]
// — one or more parallel series for the SAME selected store (Click & Collect
// needs two: on-time and attachment). Every metric shares one store <select>.
function kpiDynamicsSectionHtml(items, metrics, selectAttr){
  const chronological = [...items].sort((a,b) => new Date(a.addedAt) - new Date(b.addedAt));
  if(chronological.length < 2){
    return `
      <div class="tg-card" style="margin-top:18px;">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px;color:var(--ink-2);">Динаміка по магазину</div>
        <div class="tg-desc">Ще недостатньо періодів для динаміки — з'явиться після наступного завантаження.</div>
      </div>
    `;
  }
  const latest = chronological[chronological.length - 1];
  const latestStores = metrics[0].storesOf(latest);
  if(!kpiDynamicsStore || !latestStores.some(s => s.code === kpiDynamicsStore)){
    kpiDynamicsStore = (!currentUser.isAdmin && latestStores.some(s => s.code === currentUser.store)) ? currentUser.store : (latestStores[0]?.code || null);
  }
  const storeSelectHtml = `
    <select class="text-field" ${selectAttr} style="width:auto;margin-bottom:0;">
      ${latestStores.map(s => `<option value="${escapeHtml(s.code)}" ${s.code===kpiDynamicsStore?"selected":""}>${escapeHtml(s.code)}${s.name?" · "+escapeHtml(s.name):""}</option>`).join("")}
    </select>
  `;
  const panels = metrics.map(m => {
    const points = chronological.map(r => {
      const s = m.storesOf(r).find(x => x.code === kpiDynamicsStore);
      return { period: r.period, value: s ? s.value : null };
    });
    const svg = kpiTrendSvg(points, m.unit, m.goodDirection);
    return `
      <div>
        ${metrics.length > 1 ? `<div style="font-weight:700;font-size:12px;margin-bottom:6px;color:var(--ink-2);">${escapeHtml(m.label)}</div>` : ""}
        ${svg || `<div class="tg-desc">Недостатньо періодів із даними по цьому магазину для цього показника.</div>`}
      </div>
    `;
  }).join("");
  return `
    <div class="tg-card" style="margin-top:18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
        <div style="font-weight:700;font-size:13px;color:var(--ink-2);">Динаміка по магазину</div>
        ${storeSelectHtml}
      </div>
      ${metrics.length > 1 ? `<div class="top5-grid">${panels}</div>` : panels}
    </div>
  `;
}

function daysAgo(iso){ return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000); }

function renderActivityTab(){
  const wrap = document.getElementById("tab-content");
  const managerEvents = loginLog.filter(e => !e.isAdmin);
  const now = Date.now();
  const in7d = (iso) => (now - new Date(iso).getTime()) <= 7*86400000;
  const in30d = (iso) => (now - new Date(iso).getTime()) <= 30*86400000;

  const perUser = users.map(u => {
    const events = managerEvents.filter(e => e.userId === u.id).sort((a,b) => new Date(b.at) - new Date(a.at));
    const last = events[0] || null;
    return {
      user: u,
      total: events.length,
      last7: events.filter(e => in7d(e.at)).length,
      last30: events.filter(e => in30d(e.at)).length,
      lastAt: last ? last.at : null,
    };
  }).sort((a,b) => (b.lastAt ? new Date(b.lastAt) : 0) - (a.lastAt ? new Date(a.lastAt) : 0));

  const neverCount = perUser.filter(p => p.total === 0).length;
  const silent7dCount = perUser.filter(p => p.total > 0 && p.last7 === 0).length;
  const activeTodayCount = perUser.filter(p => p.lastAt && daysAgo(p.lastAt) === 0).length;
  const totalLogins = managerEvents.length;

  const regularCount = perUser.length - neverCount - silent7dCount;
  const perUserTotal = perUser.length || 1; // guards the % math below if the users list is ever empty

  const activityBadgeInfo = (p) => {
    if(p.total === 0) return { label: "Ще не заходив(ла)", color: "var(--red)" };
    if(p.last7 === 0) return { label: "Мовчить >7 днів", color: "var(--amber)" };
    return { label: "Регулярно заходить", color: "var(--green)" };
  };
  // "Потребує уваги" — managers who never logged in or have gone quiet for
  // over a week, pulled out of the full table below so they're scannable
  // at a glance instead of buried among everyone who logs in normally.
  const needsAttentionUsers = perUser
    .filter(p => p.total === 0 || p.last7 === 0)
    .sort((a,b) => (a.total === 0 ? 0 : 1) - (b.total === 0 ? 0 : 1));

  wrap.innerHTML = `
    ${heroBannerHtml("Активність керуючих — входи на сайт")}
    <section class="stat-row">
      <div class="stat-card"><div class="lbl">ВСЬОГО ВХОДІВ КЕРУЮЧИХ</div><div class="val">${totalLogins}</div></div>
      <div class="stat-card"><div class="lbl">АКТИВНІ СЬОГОДНІ</div><div class="val" style="${activeTodayCount>0?'color:var(--green)':''}">${activeTodayCount}<span class="unit">/ ${users.length}</span></div></div>
      <div class="stat-card"><div class="lbl">МОВЧАТЬ &gt;7 ДНІВ</div><div class="val" style="${silent7dCount>0?'color:var(--amber)':''}">${silent7dCount}</div></div>
      <div class="stat-card"><div class="lbl">ЖОДНОГО ВХОДУ</div><div class="val" style="${neverCount>0?'color:var(--red)':''}">${neverCount}</div></div>
    </section>

    <div class="tg-card">
      <div style="font-weight:700;font-size:12.5px;margin-bottom:8px;color:var(--ink-2);">Розподіл керуючих за відвідуваністю</div>
      <div class="dist-bar-row">
        <div class="dist-bar-name">Регулярно заходить</div>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(regularCount/perUserTotal*100)}%;background:var(--green);"></div></div>
        <div class="dist-bar-count">${regularCount} · ${Math.round(regularCount/perUserTotal*100)}%</div>
      </div>
      <div class="dist-bar-row">
        <div class="dist-bar-name">Мовчить &gt;7 днів</div>
        <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${Math.round(silent7dCount/perUserTotal*100)}%;background:var(--amber);"></div></div>
        <div class="dist-bar-count">${silent7dCount} · ${Math.round(silent7dCount/perUserTotal*100)}%</div>
      </div>
      <div class="dist-bar-row">
        <div class="dist-bar-name">Ще не заходив(ла)</div>

          <tbody>

                ? (daysAgo(p.lastAt) === 0 ? "сьогодні" : daysAgo(p.lastAt) === 1 ? "вчора" : `${daysAgo(p.lastAt)} дн. тому`)
                : "—";
              return `
                <tr class="activity-row" style="--row-color:${badge.color}">
                  <td class="vac-td"><span class="vac-code">${escapeHtml(p.user.store)}</span></td>
                  <td class="vac-td">${escapeHtml(p.user.name)}</td>
                  <td class="vac-td vac-td--center">${p.total}</td>
                  <td class="vac-td vac-td--center">${p.last7}</td>
                  <td class="vac-td vac-td--center">${p.last30}</td>
                  <td class="vac-td vac-td--center">${lastLabel}</td>
                  <td class="vac-td vac-td--center">${badgeHtml}</td>
                </tr>`;
            }).join("")}
          </tbody>
        </table>
      </div>
    </section>

  `;
}

function tgKyivNow() {
  const fmt = new Intl.DateTimeFormat("en-US", {
    timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", hour12: false,
  });
  const parts = Object.fromEntries(fmt.formatToParts(new Date()).map(p => [p.type, p.value]));
  return { dateStr: `${parts.year}-${parts.month}-${parts.day}`, hhmm: `${parts.hour}:${parts.minute}`, month: `${parts.year}-${parts.month}` };
}
function tgRoundTo5(hhmm) {
  const [hh, mm] = hhmm.split(":").map(Number);
  const rounded = Math.round((hh * 60 + mm) / 5) * 5;
  const h = Math.floor((rounded % 1440) / 60), m = rounded % 60;
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}

function tgStatsTotals(days) {
  const totals = {};
  const base = new Date();
  for (let i = 0; i < days; i++) {
    const d = new Date(base); d.setUTCDate(d.getUTCDate() - i);
    const fmt = new Intl.DateTimeFormat("en-US", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit" });
    const parts = Object.fromEntries(fmt.formatToParts(d).map(p => [p.type, p.value]));
    const key = `${parts.year}-${parts.month}-${parts.day}`;
    const day = (tgChatState.stats && tgChatState.stats[key]) || {};
    for (const [uid, count] of Object.entries(day)) totals[uid] = (totals[uid] || 0) + count;
  }
  return totals;
}
// Sums every day the bot has ever recorded for this chat — "увесь час".
function tgStatsTotalsAll() {
  const totals = {};
  for (const day of Object.values(tgChatState.stats || {})) {
    for (const [uid, count] of Object.entries(day)) totals[uid] = (totals[uid] || 0) + count;
  }
  return totals;
}
const TG_STATS_PERIODS = {
  week: { label: "7 днів", totals: () => tgStatsTotals(7) },
  month: { label: "30 днів", totals: () => tgStatsTotals(30) },
  all: { label: "увесь час", totals: () => tgStatsTotalsAll() },
};
// Groups a {uid: count} totals map by the store each uid is linked to
// (tgChatState.storeMembers, learned from captions/replies or filled in by
// hand — see the kyiv1-daily-check skill) — so the leaderboard reflects the
// district's actual store structure instead of one flat, capped ranking
// that only happens to surface whoever posts the most overall. Everyone
// with at least one message in the period is included, not just a top N;
// people not yet linked to a store fall into a separate "Без магазину" group
// rather than being silently dropped.
function tgActivityByStore(periodTotals) {
  const storeMembers = tgChatState.storeMembers || {};
  const names = tgChatState.names || {};
  const byStore = {};
  const unassigned = [];
  for (const [uid, count] of Object.entries(periodTotals)) {
    const entry = { uid, name: names[uid] || uid, count };
    const code = storeMembers[uid];
    if (code) {
      if (!byStore[code]) byStore[code] = { store: stores.find(s => s.code === code) || { code, name: "" }, members: [], total: 0 };
      byStore[code].members.push(entry);
      byStore[code].total += count;
    } else {
      unassigned.push(entry);
    }
  }
  for (const g of Object.values(byStore)) g.members.sort((a, b) => b.count - a.count);
  unassigned.sort((a, b) => b.count - a.count);
  const groups = Object.values(byStore).sort((a, b) => b.total - a.total);
  return { groups, unassigned };
}

// ---- analysis ----
// Richer, per-message breakdown (media, "success" and "support" keyword
// hits, day-by-day regularity) fed by worker.js's state.stats2 — recorded
// going forward only from state.stats2Since, since Telegram's Bot API
// can't retrieve a chat's message history. See the disclaimer text in
// tgAnalysisHtml() for what this is (and isn't) meant to show.
const TG_MONTH_NAMES_UA = ["січня", "лютого", "березня", "квітня", "травня", "червня", "липня", "серпня", "вересня", "жовтня", "листопада", "грудня"];
function tgFormatDateUA(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return `${d} ${TG_MONTH_NAMES_UA[m - 1]} ${y}`;
}
function tgDaysBetween(a, b) {
  const da = new Date(a + "T00:00:00Z"), db = new Date(b + "T00:00:00Z");
  return Math.max(1, Math.round((db - da) / 86400000) + 1);
}
function tgDayWord(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return "днів";
  if (mod10 === 1) return "день";
  if (mod10 >= 2 && mod10 <= 4) return "дні";
  return "днів";
}
function tgParticipantWord(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod100 >= 11 && mod100 <= 14) return "учасників";
  if (mod10 === 1) return "учасник";
  if (mod10 >= 2 && mod10 <= 4) return "учасники";
  return "учасників";
}
function tgAnalysisData() {
  const stats2 = tgChatState.stats2 || {};
  const days = Object.keys(stats2).sort();
  const users = {};
  for (const day of days) {
    for (const [uid, rec] of Object.entries(stats2[day])) {
      const u = users[uid] || (users[uid] = { msgs: 0, photos: 0, videos: 0, docs: 0, replies: 0, success: 0, support: 0, activeDays: 0, days: {} });
      u.msgs += rec.msgs || 0;
      u.photos += rec.photos || 0;
      u.videos += rec.videos || 0;
      u.docs += rec.docs || 0;
      u.replies += rec.replies || 0;
      u.success += rec.success || 0;
      u.support += rec.support || 0;
      u.activeDays += 1;
      u.days[day] = rec.msgs || 0;
    }
  }
  return { days, users };
}
// Score is deliberately not "just count messages": volume is capped at half
// the scale, the rest comes from media use, success/support keyword hits,
// and how many of the tracked days the person showed up at all.
function tgEngagementScore(u, maxMsgs, totalDays) {
  const volume = maxMsgs > 0 ? (u.msgs / maxMsgs) * 5 : 0;
  const media = Math.min(1.5, (u.photos + u.videos + u.docs) * 0.3);
  const signal = Math.min(2, (u.success + u.support) * 0.5);
  const regularity = totalDays > 0 ? Math.min(1.5, (u.activeDays / totalDays) * 1.5) : 0;
  return Math.max(1, Math.min(10, Math.round(volume + media + signal + regularity)));
}
// Groups the analysis rows by the store each uid is already linked to
// (tgChatState.storeMembers, filled in automatically as people are
// recognized — see the kyiv1-daily-check skill) so the table reads by
// store instead of one long flat ranking. Anyone not yet linked to a
// store lands in a separate "Без магазину" group rather than being
// silently dropped from the analysis.
function tgGroupAnalysisRowsByStore(rows) {
  const storeMembers = tgChatState.storeMembers || {};
  const byStore = {};
  const unassigned = [];
  for (const r of rows) {
    const code = storeMembers[r.uid];
    if (code) {
      if (!byStore[code]) byStore[code] = { store: stores.find(s => s.code === code) || { code, name: "" }, rows: [] };
      byStore[code].rows.push(r);
    } else {
      unassigned.push(r);
    }
  }
  const groups = Object.values(byStore)
    .map(g => ({ ...g, avgScore: Math.round(g.rows.reduce((s, r) => s + r.score, 0) / g.rows.length * 10) / 10 }))
    .sort((a, b) => b.avgScore - a.avgScore);
  return { groups, unassigned };
}
function tgAnalysisHtml() {
  const since = tgChatState.stats2Since;
  if (!since) {
    return `
      <div class="tg-card">
        <h2>Аналіз активності</h2>
        <div class="tg-desc">Ще немає даних для аналізу. Ця вкладка рахує розширену статистику (медіа, згадки про виконані завдання, підтримку колег, регулярність) з моменту, коли бот почав це відстежувати — Telegram не дозволяє прочитати історію чату заднім числом, тож аналіз завжди починається "від сьогодні".</div>
        <div class="tg-desc" style="margin-bottom:0;">Якщо бот уже якийсь час працює в цьому чаті, а дані тут порожні — ймовірно, ще не задеплоєно оновлену версію <code>telegram-bot/worker.js</code>. Це відбувається автоматично при push у <code>main</code> (див. <code>telegram-bot/README.md</code>, розділ «Автодеплой»); якщо це перший запуск — перевірте вкладку Actions репозиторію, чи задеплоївся Worker. Дані з'являться з наступного повідомлення в чаті після деплою.</div>
      </div>
    `;
  }

  const { days, users } = tgAnalysisData();
  const today = tgKyivNow().dateStr;
  const totalDays = tgDaysBetween(since, today);
  const uids = Object.keys(users);
  if (!uids.length) {
    return `
      <div class="tg-card">
        <h2>Аналіз активності</h2>
        <div class="tg-desc" style="margin-bottom:0;">Дані збираються з ${tgFormatDateUA(since)} — поки що жодних повідомлень не зафіксовано.</div>
      </div>
    `;
  }

  const maxMsgs = Math.max(...uids.map(uid => users[uid].msgs));
  const rows = uids
    .map(uid => { const u = users[uid]; return { uid, name: tgChatState.names?.[uid] || uid, ...u, score: tgEngagementScore(u, maxMsgs, totalDays) }; })
    .sort((a, b) => b.score - a.score || b.msgs - a.msgs);

  const byVolume = [...rows].sort((a, b) => b.msgs - a.msgs).slice(0, 3);
  const qualityScore = (r) => r.success * 2 + r.support * 2 + r.photos + r.videos + r.docs;
  const byQuality = [...rows].sort((a, b) => qualityScore(b) - qualityScore(a)).slice(0, 3);
  const lowActivity = totalDays >= 3 ? rows.filter(r => (r.activeDays / totalDays) < 0.34) : [];

  const totals = rows.reduce((acc, r) => {
    acc.msgs += r.msgs; acc.media += r.photos + r.videos + r.docs;
    acc.success += r.success; acc.support += r.support;
    return acc;
  }, { msgs: 0, media: 0, success: 0, support: 0 });
  const avgMsgs = Math.round(totals.msgs / rows.length);

  const dayHeat = (u) => days.slice(-14).map(d => `<span class="tg-heat-dot ${u.days[d] ? "on" : ""}" title="${d}"></span>`).join("");
  const analysisTableHtml = (groupRows) => `
    <div style="overflow-x:auto;">
      <table class="tg-table">
        <thead><tr>
          <th>#</th><th>Учасник</th><th>Повідомлень</th><th>Медіа</th><th>Успіхи</th>
          <th>Підтримка/відповіді</th><th>Активність по днях</th><th>Оцінка</th>
        </tr></thead>
        <tbody>
          ${groupRows.map((r, i) => `
            <tr>
              <td class="mono">${i + 1}</td>
              <td>${escapeHtml(r.name)}</td>
              <td class="mono">${r.msgs}</td>
              <td class="mono">${r.photos + r.videos + r.docs}</td>
              <td class="mono">${r.success}</td>
              <td class="mono">${r.support + r.replies}</td>
              <td><span class="tg-heat">${dayHeat(r)}</span><span style="color:var(--ink-soft);font-size:11px;">${r.activeDays}/${totalDays}</span></td>
              <td><span class="tg-pill ${r.score >= 7 ? "tg-pill-green" : r.score >= 4 ? "tg-pill-amber" : "tg-pill-red"}">${r.score}/10</span></td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
  const { groups: storeGroups, unassigned } = tgGroupAnalysisRowsByStore(rows);

  return `
    <div class="tg-card">
      <h2>Аналіз активності</h2>

      <h2>Короткі висновки</h2>

        Нагадуємо: ця сторінка показує активність у чаті, а не оцінку роботи людини — не варто робити висновки про продуктивність конкретного співробітника лише на основі цих цифр.

// ---- leaderboard (levels & reputation) ----
// Points are earned in worker.js (POINTS const): a message, a bonus for
// photo/video/document, for "success"/"support" keyword signals, and
// bigger bonuses for a first-of-the-day evening report, morning photo
// report, or monthly-checklist confirmation. Purely a chat-engagement
// signal, same disclaimer as "Аналіз активності" — not a productivity score.
// Status card for the twice-a-day (10:00/17:00) "Активності/Акції" chat
// digest — a separate, self-resetting daily counter (worker.js's
// state.dailyPoints), unrelated to the cumulative state.points below.
function tgActivityDigestCardHtml() {
  const at = tgChatState.activityTopic;
  const ad = tgChatState.activityDigest || {};
  const today = tgKyivNow().dateStr;
  return `
    <div class="tg-card">
      <h2>Щоденна статистика в чаті</h2>
      <div class="tg-desc">
        Прив'язується командою <code>/setactivitytopic</code>, написаною в потрібній темі (напр. «Активності/Акції»).
        О 10:00 бот надсилає туди підсумок активності <b>за вчора</b>, о 17:00 — зріз <b>за сьогодні</b> (з короткою
        мотивацією) — рахунок щодня оновлюється з нуля. Лідерборд і рівні вище (і на сайті) рахуються окремо й ніколи не скидаються.
      </div>
      ${at ? `<div class="tg-row"><span class="tg-pill tg-pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${at.threadId}</span></div>`
           : `<div class="tg-empty">Тема ще не прив'язана.</div>`}
      ${at ? `<div class="tg-row" style="margin-top:8px;gap:16px;">
        <span class="tg-pill ${ad.lastSent10 === today ? "tg-pill-green" : "tg-pill-amber"}">10:00 — ${ad.lastSent10 === today ? "надіслано сьогодні" : "ще не сьогодні"}</span>
        <span class="tg-pill ${ad.lastSent17 === today ? "tg-pill-green" : "tg-pill-amber"}">17:00 — ${ad.lastSent17 === today ? "надіслано сьогодні" : "ще не сьогодні"}</span>
      </div>` : ""}
    </div>

    <div class="tg-card">
      <h2>Дайджест досягнень за тиждень</h2>
      <div class="tg-desc">
        Щопонеділка о 10:01, у ту саму тему: найактивніші учасники тижня, магазини з найбільшою кількістю виконаних
        завдань (вечірні звіти + ранкові фотозвіти), і — якщо на боті ввімкнено відстеження реакцій
        (<code>telegram-bot/README.md</code>, крок «Реакції на привітання», опційний) — чиє привітання зібрало найбільше
        реакцій за тиждень.
      </div>
      ${at ? `<div class="tg-row"><span class="tg-pill ${ad.lastSentWeekly ? "tg-pill-green" : "tg-pill-amber"}">Понеділок 10:01 — ${ad.lastSentWeekly ? `останній раз надіслано ${escapeHtml(ad.lastSentWeekly)}` : "ще не надсилався"}</span></div>`
           : `<div class="tg-empty">Спершу прив'яжіть тему вище.</div>`}
    </div>
  `;
}

function tgLeaderboardHtml() {
  const points = tgChatState.points || {};
  const uids = Object.keys(points).filter((uid) => points[uid] > 0);
  if (!uids.length) {
    return `
      <div class="tg-card">
        <h2>Рейтинг</h2>
        <div class="tg-desc" style="margin-bottom:0;">Ще немає накопичених балів. Бали нараховуються за повідомлення, медіа, вечірні/ранкові звіти по магазинах і підтвердження щомісячного чекліста — з'являться після першої активності в чаті.</div>
      </div>
      ${tgActivityDigestCardHtml()}
    `;
  }

  const rows = uids
    .map((uid) => ({ uid, name: tgChatState.names?.[uid] || uid, pts: points[uid] }))
    .sort((a, b) => b.pts - a.pts);
  const medals = ["🥇", "🥈", "🥉"];
  const maxPts = rows[0].pts;

  return `
    <div class="tg-card">
      <h2>Рейтинг чату</h2>
      <div class="tg-desc">
        Бали: +1 за повідомлення, +2 за фото/відео/документ, +3 за згадку про виконане завдання, +1 за підтримку колег,
        +10 за вечірній звіт і +10 за ранковий фотозвіт мінусових залишків (перший раз на день по кожному магазину),
        +15 за підтвердження щомісячного чекліста. Це показник активності в чаті, а не оцінка роботи людини.
      </div>
      <div style="overflow-x:auto;">
        <table class="tg-table">
          <thead><tr><th>#</th><th>Учасник</th><th>Рівень</th><th>Бали</th><th>До наступного рівня</th></tr></thead>
          <tbody>
            ${rows.map((r, i) => {
              const level = tgGetLevel(r.pts);
              const next = TG_LEVELS[level.idx + 1];
              const progress = next ? Math.min(100, Math.round(((r.pts - level.min) / (next.min - level.min)) * 100)) : 100;
              const toNext = next ? `${next.min - r.pts} балів до «${next.emoji} ${next.name}»` : "максимальний рівень 🎉";
              return `
                <tr>
                  <td class="mono">${medals[i] || i + 1}</td>
                  <td>${escapeHtml(r.name)}</td>
                  <td><span class="tg-pill tg-pill-green">${level.emoji} ${level.name}</span></td>
                  <td class="mono">${r.pts}</td>
                  <td>
                    <div class="tg-bar-row" style="padding:0;">
                      <div class="tg-bar-track" style="width:100px;flex:none;"><div class="tg-bar-fill" style="width:${progress}%;"></div></div>
                      <span style="font-size:11px;color:var(--ink-soft);white-space:nowrap;">${toNext}</span>
                    </div>
                  </td>
                </tr>
              `;
            }).join("")}
          </tbody>
        </table>
      </div>
      <div class="tg-desc" style="margin-bottom:0;margin-top:10px;">Топ-10 у самому чаті — командою <code>/rating</code> (або <code>/top</code>). Тут — повний список.</div>
    </div>

    <div class="tg-card">
      <h2>Рівні</h2>
      <div style="display:flex;flex-wrap:wrap;gap:10px;">
        ${TG_LEVELS.map((l) => `<span class="tg-pill ${maxPts >= l.min ? "tg-pill-green" : "tg-pill-amber"}">${l.emoji} ${l.name} — від ${l.min}</span>`).join("")}
      </div>
    </div>

    ${tgActivityDigestCardHtml()}
  `;
}

      ${rt ? `<div class="tg-row"><span class="tg-pill tg-pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${rt.threadId}</span></div>`

           <div style="display:flex;flex-wrap:wrap;gap:6px;">${missingText.map(s => `<span class="tg-pill tg-pill-amber">${escapeHtml(s.code)}</span>`).join("")}</div>`
        : `<div class="tg-row"><span class="tg-pill tg-pill-green">Усі магазини відзвітували сьогодні ✅</span></div>`}

    <div class="tg-card">

      <div class="tg-desc">Прив'язується командою /setphotoreportstopic — або автоматично, коли надійде фото з підписом-кодом магазину.</div>
      ${pt ? `<div class="tg-row"><span class="tg-pill tg-pill-green">Прив'язано</span><span class="mono" style="font-size:12px;color:var(--ink-soft);">thread_id: ${pt.threadId}</span></div>`
           : `<div class="tg-empty">Тема ще не прив'язана.</div>`}
      <div class="tg-row" style="margin-top:10px;">
        <label>Вікно перевірки</label>

        mc.cycleMonth !== now.month ? `<div class="tg-empty">Цикл на цей місяць ще не запускався (стартує 1 числа).</div>` :
        missing.length ? `<div class="tg-desc">Ще не підтвердили ${missing.length} з ${stores.length}:</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;">${missing.map(s => `<span class="tg-pill tg-pill-amber">${escapeHtml(s.code)}</span>`).join("")}</div>`
        : `<div class="tg-row"><span class="tg-pill tg-pill-green">Усі магазини підтвердили ✅</span></div>`}
    </div>
  `;
}

// Read-only here — managed via /trackack (reply to a message) in the chat
// itself, same division as topic bindings and moderation (see README).
function tgAcksHtml() {
  const acks = Object.entries(tgChatState.trackedAcks || {});
  return `
    <div class="tg-card">
      <h2>Тригери на реакції</h2>

        командою <code>/trackack &lt;мітка&gt;</code> (відповіддю на нього, напр. на інструкцію) — відтоді будь-яка
        реакція від учасника чату зараховується як «ознайомлений(а)». Перевірити — <code>/ackstatus</code>
        (відповіддю на позначене повідомлення) або <code>/acklist</code> для повного списку. Потребує один раз
        оновленого webhook з типом <code>message_reaction</code> (<code>telegram-bot/README.md</code>, розділ
        «Реакції») — без цього кроку позначення працює, але реакції не зараховуються.
      </div>
      ${acks.length ? "" : `<div class="tg-empty">Ще немає повідомлень під відстеженням.</div>`}

          <thead><tr><th>Мітка</th><th>Позначив(ла)</th><th>Дата</th><th>Ознайомились</th></tr></thead>

// ---- event binding ----
function tgBindSubTabHandlers() {
  if (tgSubTab === "overview") {
    document.querySelectorAll("[data-tg-stats-period]").forEach(b => {
      b.addEventListener("click", () => { tgStatsPeriod = b.dataset.tgStatsPeriod; renderTelegramTab(); });
    });
  }
  if (tgSubTab === "reminders") {
    document.querySelectorAll("[data-tg-del-reminder]").forEach(b => {
      b.addEventListener("click", async () => {
        tgChatState.reminders = (tgChatState.reminders || []).filter(r => r.id !== b.dataset.tgDelReminder);
        await tgSaveChatState(); renderTelegramTab();
      });
    });
    const daysSel = document.getElementById("tg-rem-days");
    const daysCustom = document.getElementById("tg-rem-days-custom");
    daysSel.addEventListener("change", () => { daysCustom.style.display = daysSel.value === "custom" ? "" : "none"; });
    document.getElementById("tg-rem-add-btn").addEventListener("click", async () => {
      const time = tgRoundTo5(document.getElementById("tg-rem-time").value || "09:00");
      const daysSelVal = daysSel.value;
      const dayMap = { "пн": "mon", "вт": "tue", "ср": "wed", "чт": "thu", "пт": "fri", "сб": "sat", "нд": "sun" };
      const days = daysSelVal === "custom"
        ? daysCustom.value.split(",").map(s => dayMap[s.trim().toLowerCase()] || s.trim().toLowerCase()).filter(Boolean)
        : daysSelVal === "daily" ? "daily" : daysSelVal.split(",");
      const text = document.getElementById("tg-rem-text").value.trim();
      if (!text) { document.getElementById("tg-rem-save-msg").textContent = "Вкажіть текст."; return; }
      tgChatState.reminders = tgChatState.reminders || [];
      tgChatState.reminders.push({ id: String(Date.now()).slice(-6), time, days, text, lastSentDate: null });
      await tgSaveChatState(); renderTelegramTab();
    });
  }

  if (tgSubTab === "reports") {
    document.getElementById("tg-rw-save-btn").addEventListener("click", async () => {
      tgChatState.reportsWindow = { start: tgRoundTo5(document.getElementById("tg-rw-start").value), end: tgRoundTo5(document.getElementById("tg-rw-end").value) };
      await tgSaveChatState();
      document.getElementById("tg-rw-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-pw-save-btn").addEventListener("click", async () => {
      tgChatState.photoReportsWindow = { start: tgRoundTo5(document.getElementById("tg-pw-start").value), end: tgRoundTo5(document.getElementById("tg-pw-end").value) };
      await tgSaveChatState();
      document.getElementById("tg-pw-save-msg").textContent = "Збережено ✓";
    });
  }

  if (tgSubTab === "members") {
    document.querySelectorAll("[data-tg-del-member]").forEach(b => {
      b.addEventListener("click", async () => {
        delete tgChatState.storeMembers[b.dataset.tgDelMember];
        await tgSaveChatState(); renderTelegramTab();
      });
    });
  }

  if (tgSubTab === "tasks") {
    document.getElementById("tg-mc-time-save-btn").addEventListener("click", async () => {
      tgChatState.monthlyChecklist = { ...(tgChatState.monthlyChecklist || {}), time: tgRoundTo5(document.getElementById("tg-mc-time").value) };
      await tgSaveChatState();
      document.getElementById("tg-mc-time-save-msg").textContent = "Збережено ✓";
    });
  }

  if (tgSubTab === "settings") {
    document.getElementById("tg-label-save-btn").addEventListener("click", async () => {
      tgChatState.label = document.getElementById("tg-label-text").value.trim();
      tgLabels[tgSelectedChatId] = tgChatState.label || null;
      await tgSaveChatState();
      document.getElementById("tg-label-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-rules-save-btn").addEventListener("click", async () => {
      tgChatState.rules = document.getElementById("tg-rules-text").value;
      await tgSaveChatState();
      document.getElementById("tg-rules-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-digest-save-btn").addEventListener("click", async () => {
      tgChatState.digest = { ...(tgChatState.digest || {}), enabled: document.getElementById("tg-digest-on").checked, time: tgRoundTo5(document.getElementById("tg-digest-time").value) };
      await tgSaveChatState();
      document.getElementById("tg-digest-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-morning-save-btn").addEventListener("click", async () => {
      tgChatState.morning = { ...(tgChatState.morning || {}), enabled: document.getElementById("tg-morning-on").checked, time: tgRoundTo5(document.getElementById("tg-morning-time").value) };
      await tgSaveChatState();
      document.getElementById("tg-morning-save-msg").textContent = "Збережено ✓";
    });
    document.getElementById("tg-congrats-on").addEventListener("change", async (e) => {
      tgChatState.congratsEnabled = e.target.checked;
      await tgSaveChatState(); renderTelegramTab();
    });
  }

  if (tgSubTab === "warns") {
    document.querySelectorAll("[data-tg-reset-warn]").forEach(b => {
      b.addEventListener("click", async () => {
        tgChatState.warns[b.dataset.tgResetWarn] = 0;
        await tgSaveChatState(); renderTelegramTab();
      });
    });
  }
}

// ================= REAL-TIME SYNC (Firestore push, not polling) =================

function isTyping(){
  const el = document.activeElement;
  if(!el) return false;
  const tag = el.tagName;
  return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}
function canApplyRemoteUpdate(){
  if(!currentUser) return false;
  if(isTyping()) return false; // не перебивати активне редагування
  if(document.getElementById("comments-overlay")?.classList.contains("open")) return false;
  if(document.getElementById("password-overlay")?.classList.contains("open")) return false;
  if(document.getElementById("notif-overlay")?.classList.contains("open")) return false;
  if(document.getElementById("tg-subtab-overlay")?.classList.contains("open")) return false;
  if(addingVacancy) return false;
  return true;
}

let realtimeUnsubs = [];
function startPolling(){
  if(realtimeUnsubs.length) return;
  const bind = (key, apply) => onSnapshot(doc(db, "kyiv1", key), (snap) => {
    if(!snap.exists() || !canApplyRemoteUpdate()) return;
    apply(snap.data().value);
    render();
  });
  const bindCollection = (collectionName, apply) => onSnapshot(collection(db, collectionName), (snap) => {
    if(!canApplyRemoteUpdate()) return;
    const items = [];
    snap.forEach(d => items.push(d.data()));
    apply(items);
    render();
  });
  // dataMigrated (set in loadAll, unchanged for the rest of this session)
  // decides doc-per-category vs. collection-of-per-item-docs listeners —
  // see the comment above fsCollectionGet.
  if(dataMigrated){
    // kyiv1_stores/kyiv1_vacancies reads are scoped per-store now
    // (2026-09-20, see firestore.rules) — an unfiltered collection
    // listener would just get permission-denied for a manager token, same
    // reasoning as kyiv1_users right below (already scoped since phase 4).
    if(currentUser.isAdmin){
      realtimeUnsubs.push(bindCollection("kyiv1_stores", (items) => { stores = items; sortStoresByCode(); normalizeAllStoreComments(); }));
      realtimeUnsubs.push(bindCollection("kyiv1_vacancies", (items) => { vacancies = items; normalizeAllVacancyComments(); }));
    } else {
      realtimeUnsubs.push(onSnapshot(doc(db, "kyiv1_stores", currentUser.store), (snap) => {
        if(!canApplyRemoteUpdate()) return;
        stores = snap.exists() ? [snap.data()] : [];
        sortStoresByCode();
        normalizeAllStoreComments();
        render();
      }));
      realtimeUnsubs.push(onSnapshot(query(collection(db, "kyiv1_vacancies"), where("storeCode", "==", currentUser.store)), (snap) => {
        if(!canApplyRemoteUpdate()) return;
        const items = [];
        snap.forEach(d => items.push(d.data()));
        vacancies = items;
        normalizeAllVacancyComments();
        render();
      }));
    }
    if(currentUser.isAdmin){
      realtimeUnsubs.push(bindCollection("kyiv1_users", (items) => { users = items; }));
    } else {
      realtimeUnsubs.push(onSnapshot(doc(db, "kyiv1_users", currentUser.id), (snap) => {
        if(!canApplyRemoteUpdate()) return;
        users = snap.exists() ? [snap.data()] : [];
        render();
      }));
    }
  } else {
    realtimeUnsubs.push(bind(FS_KEYS.users, (v) => { users = v ? JSON.parse(v) : DEFAULT_USERS; }));
    realtimeUnsubs.push(bind(FS_KEYS.stores, (v) => { stores = v ? JSON.parse(v) : DEFAULT_STORES; sortStoresByCode(); normalizeAllStoreComments(); }));
    realtimeUnsubs.push(bind(FS_KEYS.vacancies, (v) => { vacancies = v ? JSON.parse(v) : []; normalizeAllVacancyComments(); }));
  }
  // kyiv1_equipment read is open to every signed-in user (see
  // firestore.rules) — one unconditional listener regardless of role,
  // unlike kyiv1_stores/kyiv1_vacancies above.
  realtimeUnsubs.push(bindCollection("kyiv1_equipment", (items) => { equipment = items; }));
  realtimeUnsubs.push(bind(FS_KEYS.zones, (v) => { zones = v ? JSON.parse(v) : DEFAULT_ZONES; }));
  realtimeUnsubs.push(bind(FS_KEYS.loginLog, (v) => { loginLog = v ? JSON.parse(v) : []; }));
  realtimeUnsubs.push(bind(FS_KEYS.responsibilityLog, (v) => { responsibilityLog = v ? JSON.parse(v) : []; }));
  realtimeUnsubs.push(bind(FS_KEYS.responsibilitySeenAt, (v) => { responsibilitySeenAt = v || null; }));
  // Admin-only in firestore.rules — a manager's subscription would just
  // get permission-denied, see the same note in loadAll().
  if(currentUser.isAdmin) realtimeUnsubs.push(bind(FS_KEYS.adminPassword, (v) => { adminPassword = v || ADMIN_DEFAULT_PASSWORD; }));
}
function stopPolling(){
  realtimeUnsubs.forEach((unsub) => unsub());
  realtimeUnsubs = [];
}

// ================= INIT =================

async function init(){
  users = await fetchLoginDirectory();
  render();
}
init();
</script>
